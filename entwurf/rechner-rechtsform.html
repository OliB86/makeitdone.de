<body>
<template id="tpl">


<div style="width: 100%; background: #ffffff; color: #141414; font-family: Inter, system-ui, sans-serif">

<section style="max-width: 1120px; margin: 0 auto; padding: 64px 24px 24px; display: flex; flex-direction: column; gap: 18px">
<a href="rechner.html" style="align-self: flex-start; font-size: 14px; font-weight: 500; text-decoration: none; color: #3d3d3d">← Alle Rechner</a>
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Rechner · Rechtsform</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(34px, 5vw, 56px); line-height: 1.05; max-width: 900px">Einzelunternehmen, GmbH oder Holding? Rechne selbst.</h1>
<p style="margin: 0; font-size: 15px; color: #3d3d3d">Aus der Praxis: So hat es <a href="so-arbeiten-wir.html">Kunde B</a> umgesetzt.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3d3d3d; max-width: 780px">Wer schnell wächst, bleibt oft zu lange Einzelunternehmer – und zahlt auf jeden Euro Gewinn den persönlichen Spitzensteuersatz. Verschieb die Werte und sieh, was in welcher Struktur bleibt.</p>
</section>

<section style="max-width: 1120px; margin: 0 auto; padding: 16px 24px 48px; display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-start">
<div style="flex: 1 1 340px; min-width: 0; background: #f4f4f4; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 22px">
<sc-for list="{{sliders}}" as="sl" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="{{sl.id}}" style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 600"><span>{{sl.label}}</span><span style="font-family: 'Space Grotesk', sans-serif">{{sl.shown}}</span></label>
<input id="{{sl.id}}" type="range" min="{{sl.min}}" max="{{sl.max}}" step="{{sl.step}}" value="{{sl.value}}" onInput="{{sl.change}}">
<span style="font-size: 12px; color: #5c5c5c">{{sl.hint}}</span>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 600">Veranlagung</span>
<div role="group" aria-label="Veranlagung" style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{veranl}}" as="v" hint-placeholder-count="2">
<button type="button" onClick="{{v.pick}}" aria-pressed="{{v.on}}" style="{{v.style}}">{{v.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 600">Gewinne der GmbH</span>
<div role="group" aria-label="Gewinnverwendung" style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}">{{m.label}}</button>
</sc-for>
</div>
</div>
</div>

<div style="flex: 1.5 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="overflow-x: auto">
<div style="min-width: 560px; display: grid; grid-template-columns: 1.3fr repeat(3, minmax(0, 1fr)); border: 1px solid #dddddd; border-radius: 20px; overflow: hidden">
<span style="padding: 16px; background: #f4f4f4"></span>
<span style="padding: 16px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; background: #f4f4f4">Einzel­unternehmen</span>
<span style="padding: 16px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; background: #f4f4f4">GmbH</span>
<span style="padding: 16px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; background: #141414; color: #ffffff">GmbH + Holding</span>
<sc-for list="{{rows}}" as="rw" hint-placeholder-count="7">
<span style="{{rw.ls}}">{{rw.label}}</span>
<span style="{{rw.cs}}">{{rw.e}}</span>
<span style="{{rw.cs}}">{{rw.k}}</span>
<span style="{{rw.ks}}">{{rw.o}}</span>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5c5c5c">Nach Steuern verfügbar</span>
<sc-for list="{{bars}}" as="b" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: center">
<span style="font-size: 14px; font-weight: 600">{{b.label}}</span>
<div style="background: #f4f4f4; border-radius: 999px; height: 34px; position: relative; overflow: hidden">
<div style="{{b.style}}"></div>
<span style="position: absolute; left: 14px; top: 8px; font-size: 13px; font-weight: 600; color: {{b.textColor}}">{{b.value}}</span>
</div>
</div>
</sc-for>
</div>

<div style="background: #f4f4f4; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.55; color: #3d3d3d">
<span><b>Einzelunternehmen:</b> Der ganze Gewinn wird persönlich versteuert – egal, ob du ihn entnimmst oder im Unternehmen lässt. Die Gewerbesteuer wird bei 400 % Hebesatz weitgehend angerechnet.</span>
<span><b>GmbH:</b> Dein Geschäftsführergehalt mindert den Gewinn. Was in der GmbH bleibt, kostet rund 30 % – liegt aber im Risiko des operativen Geschäfts.</span>
<span><b>GmbH + Holding:</b> Gewinne fließen für rund 1,5 % in die Holding (§ 8b KStG) und sind dort vom operativen Risiko getrennt – bereit für Immobilien, Beteiligungen oder Rücklagen.</span>
<span><b>Ins Private:</b> Erst wenn Gewinne an dich persönlich fließen, kommt Abgeltungsteuer dazu. Der Vorteil entsteht durch das, was in der Struktur arbeitet.</span>
</div>
</div>
</section>

<section style="max-width: 1120px; margin: 0 auto; padding: 48px 24px 72px; display: flex; flex-direction: column; gap: 18px">
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5c5c5c; max-width: 900px">Vereinfachte Beispielrechnung für Deutschland, Stand 2026: Einkommensteuertarif nach § 32a EStG, Solidaritätszuschlag mit Freigrenze, Gewerbesteuer mit Freibetrag 24.500 € (§ 11 GewStG) und Anrechnung nach § 35 EStG, Körperschaftsteuer 15 % (§ 23 KStG), Holding mit mindestens 15 % Beteiligung (§ 8b KStG, § 9 Nr. 2a GewStG), Abgeltungsteuer 25 % (§ 32d EStG). Ohne Kirchensteuer, Sozialversicherung, Vorsorgeaufwendungen und Sonderausgaben; Geschäftsführergehalt mit Arbeitnehmer-Pauschbetrag. Sie ersetzt keine steuerliche Beratung im Einzelfall – die übernimmt dein Steuerberater.</p>
<a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=rechner-rechtsform" style="align-self: flex-start; background: #141414; color: #ffffff; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 600; font-size: 15px">Deine Struktur besprechen →</a>
</section>
</div>

</template>
<div id="app"></div>
<script src="dc-lite.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { gewinn: 400000, gehalt: 120000, hebe: 400, split: true, mode: 'keep' };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    function eur(n) { return Math.round(n).toLocaleString('de-DE') + ' €'; }
    function pct(n) { return (n * 100).toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %'; }
    function est(x) {
      x = Math.floor(x);
      if (x <= 12348) return 0;
      if (x <= 17799) { var y = (x - 12348) / 1e4; return Math.floor((914.51 * y + 1400) * y); }
      if (x <= 69878) { var z = (x - 17799) / 1e4; return Math.floor((173.10 * z + 2397) * z + 1034.87); }
      if (x <= 277825) return Math.floor(0.42 * x - 11135.63);
      return Math.floor(0.45 * x - 19470.38);
    }
    function estV(x) { return st.split ? 2 * est(x / 2) : est(x); }
    function soli(e) { var fg = st.split ? 40700 : 20350; return e <= fg ? 0 : Math.min(0.055 * e, 0.119 * (e - fg)); }
    var G = st.gewinn, S = Math.min(st.gehalt, G), H = st.hebe;
    var mb = Math.max(0, Math.floor((G - 24500) / 100) * 100) * 0.035;
    var gewEU = mb * H / 100;
    var eEU = estV(G), anr = Math.min(4 * mb, gewEU, eEU), eEUn = eEU - anr, sEU = soli(eEUn);
    var euTax = gewEU + eEUn + sEU;
    var P = G - S, kst = P * 0.15 * 1.055, gew = P * 0.035 * H / 100;
    var eS = estV(Math.max(0, S - 1230)), sS = soli(eS);
    var keep = P - kst - gew, abg = keep * 0.25 * 1.055;
    var hr = 0.05 * (0.15 * 1.055 + 0.035 * H / 100);
    var toHold = keep * hr, inHold = keep - toHold;
    var out = st.mode === 'out';
    var abgK = out ? abg : 0, abgH = out ? inHold * 0.25 * 1.055 : 0;
    var cellBase = 'padding: 14px 16px; font-size: 14px; border-top: 1px solid #e4e4e4;';
    function row(label, e, k, o, bold) {
      var fw = bold ? ' font-weight: 700;' : '';
      return { label: label, e: e, k: k, o: o,
        ls: cellBase + ' font-weight: 600;', cs: cellBase + fw, ks: cellBase + ' background: #f7f7f7;' + fw };
    }
    var tE = euTax, tK = kst + gew + eS + sS + abgK, tO = kst + gew + eS + sS + toHold + abgH;
    var rows = [
      row('Gewerbesteuer', eur(gewEU) + (anr > 0 ? ' · ' + eur(anr) + ' auf die ESt angerechnet' : ''), eur(gew), eur(gew)),
      row('Körperschaftsteuer + Soli', '–', eur(kst), eur(kst)),
      row('Einkommensteuer + Soli', eur(eEUn + sEU), eur(eS + sS) + ' aufs Gehalt', eur(eS + sS) + ' aufs Gehalt'),
      row('Steuer auf dem Weg in die Holding', '–', '–', eur(toHold) + ' (' + (hr * 100).toLocaleString('de-DE', { maximumFractionDigits: 2 }) + ' %)'),
      row('Abgeltungsteuer', '–', out ? eur(abgK) : '–', out ? eur(abgH) : '–'),
      row('Steuern gesamt', eur(tE), eur(tK), eur(tO), true),
      row('Steuerquote', pct(tE / G), pct(tK / G), pct(tO / G), true)
    ];
    var privSal = S - eS - sS;
    var avail = out
      ? [['Einzelunternehmen', G - tE, 'alles privat'], ['GmbH', G - tK, 'alles privat'], ['GmbH + Holding', G - tO, 'alles privat']]
      : [['Einzelunternehmen', G - tE, 'alles privat versteuert'], ['GmbH', G - tK, eur(privSal) + ' privat · ' + eur(keep) + ' in der GmbH'], ['GmbH + Holding', G - tO, eur(privSal) + ' privat · ' + eur(inHold) + ' in der Holding']];
    var max = Math.max(avail[0][1], avail[1][1], avail[2][1], 1);
    var bars = avail.map(function (b, i) {
      var w = Math.max(4, b[1] / max * 100);
      return { label: b[0], value: eur(b[1]) + ' · ' + b[2], textColor: i === 2 ? '#ffffff' : '#141414',
        style: 'position: absolute; left: 0; top: 0; bottom: 0; width: ' + w.toFixed(1) + '%; border-radius: 999px; transition: width .4s ease; background: ' + (i === 2 ? '#141414' : i === 1 ? '#8a8a8a' : '#c8c8c8') };
    });
    function slider(id, label, key, min, max, step, shown, hint) {
      return { id: id, label: label, min: min, max: max, step: step, value: st[key], shown: shown, hint: hint,
        change: function (e) { var o = {}; o[key] = Number(e.target.value); self.setState(o); } };
    }
    var sliders = [
      slider('f-gewinn', 'Gewinn vor Geschäftsführergehalt', 'gewinn', 50000, 1500000, 10000, eur(G), 'Jahresgewinn des Unternehmens'),
      slider('f-gehalt', 'Geschäftsführergehalt (GmbH)', 'gehalt', 0, 300000, 5000, eur(S), 'muss angemessen sein und einem Fremdvergleich standhalten'),
      slider('f-hebe', 'Gewerbesteuer-Hebesatz', 'hebe', 200, 900, 5, H + ' %', 'je nach Gemeinde')
    ];
    var btn = function (on) { return 'border: 1px solid #141414; border-radius: 999px; padding: 10px 14px; font-size: 13px; cursor: pointer; min-height: 40px; ' + (on ? 'background: #141414; color: #ffffff; font-weight: 600;' : 'background: #ffffff; color: #141414; font-weight: 500;'); };
    var veranl = [[true, 'Zusammenveranlagung'], [false, 'Einzelveranlagung']].map(function (v) {
      var on = st.split === v[0]; return { label: v[1], on: on, style: btn(on), pick: function () { self.setState({ split: v[0] }); } };
    });
    var modes = [['keep', 'bleiben in der Struktur'], ['out', 'werden privat ausgeschüttet']].map(function (m) {
      var on = st.mode === m[0]; return { label: m[1], on: on, style: btn(on), pick: function () { self.setState({ mode: m[0] }); } };
    });
    return { sliders: sliders, veranl: veranl, modes: modes, rows: rows, bars: bars };
  }
}

dcMount(Component, 'tpl', 'app');
</script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>So arbeiten wir – make it done (Entwurf)</title>
<meta name="description" content="Entwurf: So arbeiten wir – make it done GmbH">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Inter;src:url(/fonts/inter-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(/fonts/inter-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Inter;src:url(/fonts/inter-latin-600-normal.woff2) format("woff2");font-weight:600 700;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}

body{margin:0;background:#ffffff;color:#141414;font-family:Inter,system-ui,sans-serif}
a{color:#141414}a:hover{color:#555555}
button{font-family:inherit}
@keyframes mid-spin{to{transform:rotate(360deg)}}
@keyframes mid-spin-rev{to{transform:rotate(-360deg)}}
@keyframes mid-jam{0%,100%{transform:rotate(0deg)}35%{transform:rotate(6deg)}55%{transform:rotate(-2deg)}70%{transform:rotate(3deg)}}
@keyframes mid-pulse{0%,100%{box-shadow:0 0 0 0 rgba(20,20,20,.28)}50%{box-shadow:0 0 0 10px rgba(20,20,20,0)}}
.mid-pulse{animation:mid-pulse 2.4s ease-in-out infinite}
@keyframes mid-pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.35);opacity:1}100%{transform:scale(1);opacity:1}}
.mid-pop{animation:mid-pop .5s ease-out both}
@keyframes mid-pop-d{0%{transform:rotate(45deg) scale(0);opacity:0}60%{transform:rotate(45deg) scale(1.35);opacity:1}100%{transform:rotate(45deg) scale(1);opacity:1}}
.mid-station{transition:transform .25s ease;cursor:default}
.mid-station .mid-card{transition:background .25s ease,color .25s ease,transform .25s ease,box-shadow .25s ease}
.mid-station .mid-dot{transition:background .25s ease,color .25s ease,transform .25s ease}
.mid-station:hover,.mid-station:focus-visible{transform:translateY(-6px)}
.mid-station:hover .mid-name,.mid-station:focus-visible .mid-name{transform:scale(1.08)}
.mid-station:hover .mid-card,.mid-station:focus-visible .mid-card{background:#ffffff !important;color:#141414 !important;transform:scale(1.05);box-shadow:0 12px 32px rgba(0,0,0,.35)}
.mid-station:hover .mid-dot,.mid-station:focus-visible .mid-dot{background:#ffffff !important;color:#141414 !important;transform:scale(1.15)}
@media (prefers-reduced-motion: reduce){.gear,.mid-pulse,.mid-pop{animation:none !important}.mid-station,.mid-station *{transition:none !important}}
html{scroll-behavior:smooth}

</style>
</head>
<body>
<template id="tpl">

<div style="width: 100%; background: #ffffff; color: #141414; font-family: Inter, system-ui, sans-serif">

<div style="background: #141414; color: #f2f2f2; font-size: 13px; padding: 10px 24px; text-align: center; letter-spacing: 0.02em">Entwurf · nicht verlinkt · Texte und Begriffe in Abstimmung</div>

<header style="max-width: 1120px; margin: 0 auto; padding: 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px">make it done</span>
<nav aria-label="Hauptmenü" style="display: flex; gap: 24px; flex-wrap: wrap; font-size: 15px">
<a href="#leistungen" style="text-decoration: none">Leistungen</a>
<a href="#zahnraeder" style="text-decoration: none">Warum make it done</a>
<a href="#ablauf" style="text-decoration: none; font-weight: 600">So arbeiten wir</a>
<a href="#geschichten" style="text-decoration: none">Ergebnisse</a>
<a href="wissen.html" style="text-decoration: none">Wissen</a>
<a href="#faq" style="text-decoration: none">Fragen</a>
</nav>
</header>

<section style="max-width: 1120px; margin: 0 auto; padding: 72px 24px 88px; display: flex; flex-direction: column; gap: 28px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">So arbeiten wir</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(40px, 6vw, 76px); line-height: 1.02; letter-spacing: -0.02em; max-width: 960px">Entscheidungen vor der Handlung.<br>Nicht erst im Jahres&shy;abschluss.</h1>
<p style="margin: 0; font-size: 20px; line-height: 1.55; color: #3d3d3d; max-width: 720px">Wir begleiten Unternehmer dauerhaft – mit aktuellen Zahlen, einer Struktur, die mitwächst, und einem Netzwerk aus Steuerberatern, Wirtschaftsprüfern und Rechtsanwälten. Wir sprechen mit allen. Und stehen dabei auf Ihrer Seite.</p>
<div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: center">
<a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=so-arbeiten-wir" style="background: #141414; color: #ffffff; text-decoration: none; padding: 16px 28px; border-radius: 999px; font-weight: 600; font-size: 16px">Erstgespräch vereinbaren →</a>
<a href="#situation" style="text-decoration: none; padding: 16px 8px; font-weight: 500; font-size: 16px; color: #3d3d3d">Kennen Sie das? ↓</a>
</div>
</section>

<section id="situation" style="background: #f4f4f4">
<div style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 32px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Kennen Sie das?</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 860px">Sie wollen weiterkommen. Aber irgendetwas greift nicht.</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3d3d3d; max-width: 760px">Die meisten Unternehmer, mit denen wir sprechen, stecken in einer dieser Situationen. Welche kennen Sie?</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
<sc-for list="{{sits}}" as="s" hint-placeholder-count="4">
<button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="{{s.style}}">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: {{s.numColor}}">SITUATION {{s.num}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600; line-height: 1.3">{{s.short}}</span>
</button>
</sc-for>
</div>
<div style="background: #ffffff; border-radius: 20px; padding: 40px; display: flex; flex-direction: column; gap: 22px; border: 1px solid #dddddd">
<p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 3vw, 34px); font-weight: 600; line-height: 1.25; max-width: 860px">{{sitQuote}}</p>
<p style="margin: 0; font-size: 18px; line-height: 1.65; color: #3d3d3d; max-width: 780px">{{sitStory}}</p>
<div style="display: flex; gap: 32px; flex-wrap: wrap; border-top: 1px solid #e4e4e4; padding-top: 22px">
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5c5c5c">Was Sie wahrscheinlich schon versucht haben</span>
<span style="font-size: 17px; line-height: 1.55">{{sitTried}}</span>
</div>
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5c5c5c">Was dabei fehlt</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{sitMissing}}" as="m" hint-placeholder-count="2">
<span style="font-size: 14px; font-weight: 600; border: 1px dashed #5c5c5c; border-radius: 999px; padding: 6px 14px">{{m}}</span>
</sc-for>
</div>
</div>
</div>
<a href="#zahnraeder" onClick="{{showSitGears}}" style="align-self: flex-start; background: #141414; color: #ffffff; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 600; font-size: 15px">Zeigen, wo es hakt ↓</a>
</div>
<p style="margin: 8px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(22px, 2.6vw, 30px); font-weight: 600; line-height: 1.3; max-width: 860px">Das Problem ist selten Ihr Steuerberater, Ihr CFO oder Ihr Konzept. Es ist die Lücke dazwischen.</p>
</div>
</section>

<section id="zahnraeder" style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 28px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Warum es hakt</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 880px">Vier Zahnräder. Erst wenn alle greifen, bewegt sich etwas.</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3d3d3d; max-width: 780px">So sieht es aus, wenn Zahlen, Struktur, Abstimmung und Umsetzung ineinandergreifen. Schauen Sie, was passiert, wenn nur ein CFO-Dienst oder nur eine Strukturberatung im Spiel ist – oder nehmen Sie selbst ein Zahnrad heraus.</p>
<div role="group" aria-label="Variante wählen" style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{presets}}" as="v" hint-placeholder-count="3">
<button type="button" onClick="{{v.pick}}" aria-pressed="{{v.on}}" style="{{v.btnStyle}}">{{v.label}}</button>
</sc-for>
</div>
<div style="display: flex; gap: 32px; flex-wrap: wrap; align-items: center">
<div style="flex: 1.6 1 560px; min-width: 0; overflow-x: auto; background: #f4f4f4; border-radius: 24px; padding: 20px 8px">
<div style="position: relative; width: 640px; height: 390px; margin: 0 auto">
<sc-for list="{{gears}}" as="g" hint-placeholder-count="4">
<button type="button" onClick="{{g.toggle}}" aria-pressed="{{g.present}}" aria-label="{{g.aria}}" style="{{g.boxStyle}}">
<sc-if value="{{g.present}}" hint-placeholder-val="{{ true }}">
<svg class="gear" viewBox="{{g.vb}}" width="{{g.size}}" height="{{g.size}}" aria-hidden="true" style="{{g.svgStyle}}"><path d="{{g.teeth}}" fill="{{g.fill}}"></path><circle cx="{{g.c}}" cy="{{g.c}}" r="{{g.ringR}}" fill="#f4f4f4"></circle><path d="{{g.spokes}}" fill="none" stroke="{{g.fill}}" stroke-width="{{g.spokeW}}" stroke-linecap="round"></path><circle cx="{{g.c}}" cy="{{g.c}}" r="{{g.hubR}}" fill="{{g.fill}}"></circle><circle cx="{{g.c}}" cy="{{g.c}}" r="{{g.holeR}}" fill="#f4f4f4"></circle></svg>
</sc-if>
<sc-if value="{{g.missing}}" hint-placeholder-val="{{ false }}">
<span style="{{g.ghostStyle}}"><span style="font-size: 13px; font-weight: 600; color: #8a8a8a">fehlt</span></span>
</sc-if>
</button>
<span style="{{g.labelStyle}}"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px">{{g.label}}</span><span style="font-size: 12px; color: #5c5c5c">{{g.sub}}</span></span>
</sc-for>
</div>
</div>
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700">{{gearHead}}</span>
<sc-for list="{{gearMsgs}}" as="msg" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid #e4e4e4">
<span style="font-weight: 600; font-size: 16px">{{msg.t}}</span>
<span style="font-size: 16px; line-height: 1.55; color: #3d3d3d">{{msg.x}}</span>
</div>
</sc-for>
</div>
</div>
</section>

<section id="zeitpunkt" style="background: #f4f4f4">
<div style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 32px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Der Zeitpunkt</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 860px">Wer erst im Jahresabschluss hinschaut, kann nur noch Schaden begrenzen.</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3d3d3d; max-width: 760px">Entscheidungen fallen im Alltag: ein Vertrag, eine Gründung, eine Investition. Entscheidend ist, wann jemand mit Fachwissen draufschaut.</p>
<div style="background: #ffffff; border-radius: 24px; padding: 32px; border: 1px solid #dddddd; overflow-x: auto">
<div style="min-width: 820px; display: grid; grid-template-columns: 170px repeat(4, minmax(0, 1fr)); gap: 12px 14px; align-items: stretch">
<span></span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px"><span style="color: #8a8a8a; font-size: 13px; display: block">01</span>Idee &amp; Entscheidung</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px"><span style="color: #8a8a8a; font-size: 13px; display: block">02</span>Handlung</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px"><span style="color: #8a8a8a; font-size: 13px; display: block">03</span>Buchhaltung</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px"><span style="color: #8a8a8a; font-size: 13px; display: block">04</span>Jahresabschluss</span>

<span style="font-size: 14px; font-weight: 600; color: #5c5c5c; align-self: center">So läuft es oft</span>
<span style="background: #f4f4f4; border-radius: 14px; padding: 16px; font-size: 14px; line-height: 1.45; color: #5c5c5c">Sie entscheiden – oft allein und unter Zeitdruck.</span>
<span style="background: #f4f4f4; border-radius: 14px; padding: 16px; font-size: 14px; line-height: 1.45; color: #5c5c5c">Vertrag, Gründung, Investition: Fakten sind geschaffen.</span>
<span style="background: #f4f4f4; border-radius: 14px; padding: 16px; font-size: 14px; line-height: 1.45; color: #5c5c5c">Die BWA kommt Wochen später.</span>
<span class="mid-pulse" style="background: #ffffff; border: 2px dashed #141414; border-radius: 14px; padding: 16px; font-size: 14px; line-height: 1.45; font-weight: 600">Erst hier schaut jemand drauf – oft Monate danach. Es bleibt Schadensbegrenzung.</span>

<span style="font-size: 14px; font-weight: 700; align-self: center">Mit make it done</span>
<span class="mid-pulse" style="background: #141414; color: #ffffff; border-radius: 14px; padding: 16px; font-size: 14px; line-height: 1.45; font-weight: 600">Hier begleiten wir: Varianten, Zahlen und Folgen liegen vorher auf dem Tisch.</span>
<span style="background: #f4f4f4; border-radius: 14px; padding: 16px; font-size: 14px; line-height: 1.45">Abgestimmt mit Steuerberater und Anwalt, sauber umgesetzt.</span>
<span style="background: #f4f4f4; border-radius: 14px; padding: 16px; font-size: 14px; line-height: 1.45">Zahlen just in time statt Warten auf die BWA.</span>
<span style="background: #f4f4f4; border-radius: 14px; padding: 16px; font-size: 14px; line-height: 1.45">Keine Überraschungen: Der Abschluss bestätigt den Plan.</span>

<span style="font-size: 13px; font-weight: 600; color: #5c5c5c; align-self: center">Gestaltungsspielraum</span>
<div style="grid-column: span 4; display: flex; flex-direction: column; gap: 6px; padding-top: 8px">
<div style="height: 12px; border-radius: 999px; background: linear-gradient(90deg, #141414, #e4e4e4)"></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #5c5c5c; font-weight: 500"><span>groß</span><span>keiner mehr</span></div>
</div>
</div>
</div>
<p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(22px, 2.6vw, 30px); font-weight: 600; line-height: 1.3; max-width: 860px">Gestaltet wird vor der Handlung. Danach wird nur noch bestätigt – oder repariert.</p>
</div>
</section>


<section style="background: #141414; color: #f2f2f2">
<div style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; gap: 48px; flex-wrap: wrap; align-items: center">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #b8b8b8">Am Tisch</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 46px); line-height: 1.1">Wir sprechen mit allen.<br>Und sitzen auf Ihrer Seite.</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #d4d4d4">Ihr Steuerberater kann nur so gut bewerten, wie Ihr Sachverhalt aufbereitet ist. Wir machen die Vorarbeit, sprechen seine Sprache – und argumentieren mit Fachwissen in Ihrem Interesse.</p>
<div style="border-top: 1px solid #3a3a3a; padding-top: 24px; display: flex; flex-direction: column; gap: 10px; min-height: 150px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">{{seatTitle}}</span>
<span style="font-size: 17px; line-height: 1.6; color: #d4d4d4">{{seatText}}</span>
</div>
</div>
<div style="flex: 1 1 400px; min-width: 0; display: flex; justify-content: center">
<div style="position: relative; width: 400px; max-width: 100%; height: 380px">
<div aria-hidden="true" style="position: absolute; left: 50px; top: 100px; width: 300px; height: 180px; border-radius: 50%; border: 2px solid #5a5a5a; background: #1f1f1f"></div>
<div aria-hidden="true" style="position: absolute; left: 30px; top: 6px; width: 300px; height: 70px; border: 2px dashed #8a8a8a; border-radius: 18px"></div>
<span aria-hidden="true" style="position: absolute; left: 230px; top: 84px; font-size: 13px; color: #b8b8b8; font-weight: 500">Ihre Seite</span>
<sc-for list="{{seats}}" as="p" hint-placeholder-count="4">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="{{p.style}}">{{p.label}}</button>
</sc-for>
</div>
</div>
</div>
</section>

<section id="ablauf" style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 28px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Der Weg</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(34px, 5vw, 60px); line-height: 1.04; letter-spacing: -0.01em; max-width: 900px">Erst Kurs setzen.<br>Dann Kurs halten.</h2>
<p style="margin: 0; font-size: 19px; line-height: 1.6; color: #3d3d3d; max-width: 780px">Wie in der Navigation: Standort bestimmen, Ziel festlegen, Route planen, Instrumente einbauen – und dann auf Kurs bleiben. Genau so arbeiten wir mit Ihnen.</p>

<div style="background: #141414; color: #ffffff; border-radius: 28px; padding: 44px 40px; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #b8b8b8">Paket 1 · Kurs setzen</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 46px); font-weight: 700; line-height: 1.05">Startklar in 90 Tagen</span>
<span style="font-size: 18px; color: #d4d4d4">Zahlen live, Ziel klar, Route fest. <span style="font-size: 12px; border: 1px dashed #8a8a8a; border-radius: 999px; padding: 3px 10px; margin-left: 6px; color: #b8b8b8">Name in Abstimmung</span></span>
</div>
<span style="font-size: 14px; color: #b8b8b8">Start: Erstgespräch</span>
</div>
<div style="overflow-x: auto">
<div style="position: relative; min-width: 900px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
<div aria-hidden="true" style="position: absolute; left: 22px; right: 0; top: 21px; height: 2px; background: repeating-linear-gradient(90deg, #8a8a8a 0 10px, transparent 10px 18px)"></div>
<sc-for list="{{route}}" as="r" hint-placeholder-count="5">
<div class="mid-station" tabindex="0" style="position: relative; display: flex; flex-direction: column; gap: 10px; border-radius: 16px; padding: 4px; outline: none">
<span class="mid-dot" style="{{r.dotStyle}}">{{r.num}}</span>
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #8a8a8a">{{r.nav}} · {{r.time}}</span>
<span class="mid-name" style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; line-height: 1.15; transform-origin: left center; transition: transform .25s ease">{{r.name}}</span>
<span class="mid-card" style="{{r.textStyle}}">{{r.text}}</span>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px">
<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M5 20V3h11l-2 4 2 4H5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"></path></svg>
<span>Tag 90: Kurs gesetzt</span>
</div>
</div>

<div style="border: 3px solid #141414; border-radius: 28px; padding: 40px; display: flex; flex-direction: column; gap: 22px; background: #ffffff">

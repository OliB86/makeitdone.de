body{margin:0;background:#ffffff;color:#141414;font-family:Inter,system-ui,sans-serif}
a{color:#141414}a:hover{color:#555555}
button{font-family:inherit}
.mid-st{transition:opacity .35s ease, transform .35s ease}

.mid-fill{transition:height .5s ease}

<div style="background: #1f1f1f; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Netzwerk</span><span style="font-size: 15px; color: #d4d4d4">Steuerberater, Wirtschaftsprüfer, Rechtsanwälte, Anlageberater [Versicherungsmakler folgen]</span></div>

<script src="dc-lite.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'ohne', at: 0, faq: 0 };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var mit = st.mode === 'mit';
    var S = [
      { t: 'Die Idee', w: 'Tag 0',
        o: 'GmbH, Investition, neue Stelle: Der Gedanke ist da. Du wägst allein ab – zwischen zwei Kundenterminen.',
        m: 'Wir legen mit dir ein Zielbild für 1, 3 und 10 Jahre fest. Jede Idee wird daran gemessen.',
        to: ['allein', 'ohne Ziel'], tm: ['Zahlen + Struktur in einer Hand', 'Vor der Handlung'], ro: 90, rm: 100 },
      { t: 'Die Entscheidung', w: 'Woche 1',
        o: 'Entschieden wird nach Kontostand und Bauchgefühl. Die letzte BWA ist sechs Wochen alt.',
        m: 'Aktuelle Zahlen und durchgerechnete Varianten liegen auf dem Tisch – Du siehst die Folgen, bevor du handelst.',
        to: ['Bauchgefühl', 'alte Zahlen'], tm: ['Zahlen just in time', 'Steuerrechtlich fundiert'], ro: 70, rm: 100 },
      { t: 'Die Abstimmung', w: 'Woche 2–4',
        o: 'Der Steuerberater fragt nach dem Sachverhalt. Unterlagen fehlen, die Antwort dauert – oder es wird gar nicht gefragt.',
        m: 'Wir bereiten den Sachverhalt auf und sprechen mit Steuerberater und Anwalt auf Augenhöhe – nur dir verpflichtet.',
        to: ['Sachverhalt unklar', 'Wartezeit'], tm: ['Auf deiner Seite am Tisch', 'Netzwerk mit Direktmandat'], ro: 50, rm: 95 },
      { t: 'Die Umsetzung', w: 'Monat 2–3',
        o: 'Das Konzept ist gut. Dann kommt der Alltag – Verträge, Konten, Prozesse bleiben liegen.',
        m: 'Wir setzen um: Verträge, Konten, Prozesse, Fristen. Bis es läuft.',
        to: ['Schublade', 'niemand zuständig'], tm: ['done statt Konzeptpapier'], ro: 35, rm: 90 },
      { t: 'Der laufende Monat', w: 'jeden Monat',
        o: 'Die BWA kommt Wochen später, nach Standard-Kontenrahmen. Ob die Entscheidung richtig war, weiß niemand.',
        m: 'Dein Dashboard zeigt täglich, wo du stehst. Abweichungen siehst du sofort – nicht im nächsten Quartal.',
        to: ['Wochen zu spät', 'keine Steuerung'], tm: ['Zahlen just in time', 'Dauerhaft dabei'], ro: 20, rm: 85 },
      { t: 'Der Jahresabschluss', w: 'Monate später',
        o: 'Jetzt schaut jemand mit Fachwissen drauf. Gestalten lässt sich kaum noch etwas – nur noch reparieren.',
        m: 'Keine Überraschungen. Der Abschluss bestätigt, was du längst wusstest – und das Jahresgespräch plant das nächste.',
        to: ['Nachzahlung', 'Schadensbegrenzung'], tm: ['Selbst gelebt', 'Für Unternehmen unter dem Radar der CFOs'], ro: 5, rm: 80 }
    ];
    var n = S.length;
    var stations = S.map(function (d, i) {
      var reached = i <= st.at;
      var cur = i === st.at;
      var dark = reached && mit;
      return {
        num: String(i + 1), title: d.t, when: d.w, open: cur,
        text: mit ? d.m : d.o,
        tags: mit ? d.tm : d.to,
        aria: 'Station ' + (i + 1) + ': ' + d.t,
        pulse: cur ? 'mid-pulse' : '',
        pick: function () { self.setState({ at: i }); },
        metaColor: dark ? '#b8b8b8' : '#5c5c5c',
        textColor: dark ? '#e4e4e4' : '#3d3d3d',
        wrapStyle: 'position: relative; opacity: ' + (reached ? '1' : '0.45') + '; transform: translateX(' + (cur ? '8px' : '0') + ')',
        nodeStyle: 'position: absolute; left: -84px; top: 18px; width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: Space Grotesk, sans-serif; font-size: 22px; font-weight: 700; cursor: pointer; z-index: 2; ' + (reached ? 'background: #141414; color: #ffffff; border: 4px solid #f4f4f4;' : 'background: #ffffff; color: #8a8a8a; border: 2px dashed #a8a8a8;'),
        cardStyle: 'width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: left; padding: 24px 28px; border-radius: 20px; cursor: pointer; transition: background .3s, color .3s, box-shadow .3s; ' + (dark ? 'background: #141414; color: #ffffff; border: 1px solid #141414;' : 'background: #ffffff; color: #141414; border: 1px solid ' + (cur ? '#141414' : '#dddddd') + ';') + (cur ? ' box-shadow: 0 14px 30px rgba(0,0,0,.12);' : ''),
        tagStyle: mit ? 'font-size: 13px; font-weight: 600; background: #ffffff; color: #141414; border-radius: 999px; padding: 6px 12px' : 'font-size: 13px; font-weight: 600; border: 1px dashed #5c5c5c; color: #3d3d3d; border-radius: 999px; padding: 6px 12px'
      };
    });
    var cur = S[st.at];
    var room = mit ? cur.rm : cur.ro;
    var pct = n > 1 ? (st.at / (n - 1)) * 100 : 0;
    var btn = function (on) { return 'border: 0; border-radius: 999px; padding: 10px 18px; font-size: 15px; font-weight: 600; cursor: pointer; min-height: 44px; transition: background .2s, color .2s; ' + (on ? 'background: #141414; color: #ffffff;' : 'background: transparent; color: #141414;'); };
    var C = [
      ['Laufende, aktuelle Zahlen', 'Rückblick (BWA)', '✓', '–', '✓ just in time'],
      ['Rechtsform, Holding, Nachfolge', 'Würdigung im Einzelfall', '–', '✓ Konzept', '✓ vorbereitet & umgesetzt'],
      ['Steuerliche Würdigung im Einzelfall', '✓', '–', 'über Partner', 'über deinen Steuerberater'],
      ['Dabei, bevor du entscheidest', 'meist danach', '○', 'projektweise', '✓ dauerhaft'],
      ['Umsetzung im Unternehmen', '–', '○', '–', '✓'],
      ['Koordination von Steuerberater & Anwalt', '–', '–', '○', '✓'],
      ['Ohne Provision, nur dir verpflichtet', '✓', 'unterschiedlich', 'unterschiedlich', '✓']
    ];
    var cmp = C.map(function (r) { return { label: r[0], stb: r[1], cfo: r[2], str: r[3], mid: r[4] }; });
    var FAQ = [
      { q: 'Reicht mein Steuerberater nicht aus?', a: 'Dein Steuerberater sieht dein Unternehmen meist im Rückblick: Buchhaltung, Erklärungen, Jahresabschluss. Entscheidungen fallen aber vorher. Wir sind dazwischen dauerhaft dabei – und sorgen dafür, dass er auf einer sauberen Grundlage bewerten kann.' },
      { q: 'Warum nicht ein Fractional CFO?', a: 'Ein CFO-Dienst liefert Zahlen. Rechtsform, Holding, Nachfolge und die Abstimmung mit Steuerberater und Anwalt gehören meist nicht dazu – genauso wenig wie die Umsetzung.' },
      { q: 'Warum nicht eine Strukturberatung?', a: 'Strukturkonzepte brauchen eine aktuelle Zahlenbasis. Fehlt sie, dauern Entscheidungen, und die Umsetzung bleibt beim Steuerberater hängen.' },
      { q: 'Ist das rechtlich sauber?', a: 'Ja. Die Rollen sind klar: Die steuerliche und rechtliche Würdigung übernehmen direkt beauftragte Berufsträger, ohne Provision. Wir bereiten vor, rechnen, koordinieren und setzen um.' },
      { q: 'Arbeitet ihr auch mit meinem bestehenden Steuerberater?', a: 'Gern – das ist der Normalfall. Er bleibt dein Steuerberater und wird besser eingebunden.' }
    ];
    var faqs = FAQ.map(function (d, i) {
      var isOpen = st.faq === i;
      return { q: d.q, a: d.a, open: isOpen, sign: isOpen ? '−' : '+', toggle: function () { self.setState({ faq: isOpen ? -1 : i }); } };
    });
    return {
      stations: stations,
      isOhne: !mit, isMit: mit,
      setOhne: function () { self.setState({ mode: 'ohne' }); },
      setMit: function () { self.setState({ mode: 'mit' }); },
      ohneStyle: btn(!mit), mitStyle: btn(mit),
      roomLabel: room + ' %',
      roomStyle: 'height: 100%; border-radius: 999px; background: #141414; width: ' + room + '%',
      fillStyle: 'position: absolute; left: 31px; top: 24px; width: 4px; border-radius: 4px; background: #141414; height: calc((100% - 48px) * ' + (pct / 100).toFixed(3) + ')',
      prev: function () { self.setState({ at: Math.max(0, st.at - 1) }); },
      next: function () { self.setState({ at: Math.min(n - 1, st.at + 1) }); },
      verdict: mit ? 'Gestaltet wird vor der Handlung – und der Spielraum bleibt.' : 'Ohne Begleitung schrumpft der Spielraum mit jeder Station.',
      cmp: cmp, faqs: faqs
    };
  }
}

dcMount(Component, 'tpl', 'app');
</script>
</body>
</html>

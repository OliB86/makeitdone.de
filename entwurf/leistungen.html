<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { faq: 0 };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var PH = [
      { when: 'Woche 1–2', name: 'Zielbild', text: 'Unternehmensanalyse, Onboarding-Kurs und Zielbild-Workshop: Wo stehst du, wo willst du hin?' },
      { when: 'bis Tag 90', name: 'Fundament', text: 'Struktur-Fahrplan, Zahlen-Cockpit live, Quick Wins erledigt, Umsetzungsplan mit Terminen.' },
      { when: 'laufend', name: 'Steuerung', text: 'Wir begleiten jede Entscheidung, die auf dem Fundament aufbaut – im festen Rhythmus.', hl: true }
    ];
    var phases = PH.map(function (d) {
      return { when: d.when, name: d.name, text: d.text,
        style: 'display: flex; flex-direction: column; gap: 8px; border-radius: 18px; padding: 24px; ' + (d.hl ? 'background: #ffffff; color: #141414;' : 'background: #1f1f1f; color: #ffffff;') };
    });
    var p1 = ['Unternehmensanalyse und Onboarding-Kurs', 'Zielbild für 1, 3 und 10 Jahre', 'Struktur-Fahrplan mit Steuerberater-Agenda', 'Zahlen-Cockpit live: Kontenplan, Automatisierung, Kennzahlen', 'Quick Wins ohne Fristbindung erledigt', 'Umsetzungsplan mit Terminen für alles Weitere'];
    var p2 = ['Neueinstellungen und Verträge', 'Investitionen und größere Ausgaben – auf Basis aktueller Zahlen', 'Umsetzungen mit Fristen, etwa eine Umwandlung', 'Lohnsteuer- und Benefit-Themen', 'Steuerungs- und Meilensteingespräche, Vorab-Check jederzeit'];
    var FAQ = [
      { q: 'Was kostet das?', a: 'Du zahlst für Ergebnisse, nicht für Stunden. Was am Ende stehen soll, legen wir vorher fest – zu einem Festpreis. So ist für dich alles kalkulierbar. Den Rahmen besprechen wir im Strategiegespräch.' },
      { q: 'Wie geht es nach den 90 Tagen weiter?', a: 'Dann steht dein Fundament – und die Entscheidungen beginnen, für die es gebaut ist: Einstellungen, Investitionen, Umsetzungen mit Fristen. Wir steuern mit dir weiter, im festen Rhythmus und mit Meilensteingesprächen. Alles, was in den 90 Tagen entsteht, gehört dir.' },
      { q: 'Kann ich meinen Steuerberater behalten?', a: 'Ja. Er bleibt für Erklärungen und Abschluss zuständig und kann auch die Buchhaltung behalten – den Kontenplan stimmen wir mit ihm ab.' },
      { q: 'Wer erledigt die Umsatzsteuer-Voranmeldung?', a: 'Entweder prüfst du die automatischen Buchungen und übermittelst selbst, oder dein Steuerberater prüft und übermittelt. [Formulierung in rechtlicher Prüfung.]' }
    ];
    var faqs = FAQ.map(function (d, i) {
      var isOpen = st.faq === i;
      return { q: d.q, a: d.a, open: isOpen, sign: isOpen ? '−' : '+', toggle: function () { self.setState({ faq: isOpen ? -1 : i }); } };
    });
    return { phases: phases, p1: p1, p2: p2, faqs: faqs };
  }
}

dcMount(Component, 'tpl', 'app');
</script>

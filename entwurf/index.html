<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Start – make it done (Entwurf)</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Inter;src:url(/fonts/inter-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(/fonts/inter-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Inter;src:url(/fonts/inter-latin-600-normal.woff2) format("woff2");font-weight:600 700;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Instrument Serif";src:url(/fonts/instrument-serif-latin-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}

body{margin:0;background:#ffffff;color:#141414;font-family:Inter,system-ui,sans-serif}
a{color:#141414}a:hover{color:#555555}
button{font-family:inherit}
.mid-card{transition:transform .2s ease, box-shadow .2s ease}
.mid-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.10)}
@keyframes mid-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mid-in{animation:mid-in .35s ease-out both}
@media (prefers-reduced-motion: reduce){.mid-card,.mid-in{transition:none;animation:none}}
@keyframes mid-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.mid-in{animation:mid-in .35s ease-out both}

html{scroll-behavior:smooth;scroll-padding-top:90px}
@media (max-width:760px){header nav{flex-wrap:nowrap !important;overflow-x:auto;max-width:100%;padding-bottom:4px;-webkit-overflow-scrolling:touch}header nav a{white-space:nowrap}header nav a:last-child{order:-1}}
</style>
</head>
<body>
<template id="tpl">


<div style="width: 100%; background: #ffffff; color: #141414; font-family: Inter, system-ui, sans-serif">

<div style="background: #141414; color: #f2f2f2; font-size: 13px; padding: 10px 24px; text-align: center; letter-spacing: 0.02em">Entwurf · nicht verlinkt · Texte und Begriffe in Abstimmung mit Heartbeat</div>

<header style="position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.96); backdrop-filter: blur(8px); border-bottom: 1px solid #ececec">
<div style="max-width: 1120px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
<a href="index.html" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; text-decoration: none">make it done</a>
<nav aria-label="Hauptmenü" style="display: flex; gap: 20px; flex-wrap: wrap; font-size: 15px; align-items: center">
<a href="leistungen.html" style="text-decoration: none">Leistungen</a>
<a href="warum.html" style="text-decoration: none">Warum make it done</a>
<a href="fuer-wen.html" style="text-decoration: none">Für wen</a>
<a href="so-arbeiten-wir.html" style="text-decoration: none">So arbeiten wir</a>
<a href="rechner.html" style="text-decoration: none">Rechner</a>
<a href="ueber-uns.html" style="text-decoration: none">Über uns</a>
<a href="karriere.html" style="text-decoration: none">Karriere</a>
<a href="kontakt.html" style="text-decoration: none">Kontakt</a>
<a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=nav-start" style="text-decoration: none; background: #141414; color: #ffffff; padding: 10px 20px; border-radius: 999px; font-weight: 600">Erstgespräch</a>
</nav>
</div>
</header>

<section style="max-width: 1120px; margin: 0 auto; padding: 64px 24px 80px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Finanz- und Strukturbegleitung &amp; C-Level-Support</span>
<span style="font-size: 12px; font-weight: 600; border: 1px dashed #5c5c5c; border-radius: 999px; padding: 4px 10px; color: #3d3d3d">Überschrift: Arbeitsstand – mit Heartbeat</span>
</div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(42px, 6.4vw, 82px); line-height: 1.0; letter-spacing: -0.02em; max-width: 1000px">Wachstum braucht Struktur.<br>We <span style="font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400">make it done</span>.</h1>
<p style="margin: 0; font-size: 20px; line-height: 1.55; color: #3d3d3d; max-width: 760px">Wir sorgen für Zahlen, mit denen du steuern kannst, eine Struktur, die zu deinen Zielen passt, und setzen beides um – gemeinsam mit deinem Steuerberater und unserem Netzwerk aus Wirtschaftsprüfern und Rechtsanwälten.</p>
<div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: center">
<a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=start" style="background: #141414; color: #ffffff; text-decoration: none; padding: 16px 28px; border-radius: 999px; font-weight: 600; font-size: 16px">Jetzt Erstberatung sichern →</a>
<a href="#schuh" style="text-decoration: none; padding: 16px 8px; font-weight: 500; font-size: 16px; color: #3d3d3d">Wo drückt der Schuh? ↓</a>
</div>
<div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px">
<span style="background: #f4f4f4; border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 500">Erfahrung aus Steuerberatung, Prüfung und Geschäftsführung</span>
<span style="background: #f4f4f4; border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 500">Festpreis für feste Ergebnisse</span>
<span style="background: #f4f4f4; border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 500">Netzwerk: Steuerberater · Wirtschaftsprüfer · Rechtsanwälte</span>
</div>
</section>

<section id="schuh" style="background: #f4f4f4">
<div style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 28px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Wo drückt der Schuh?</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 880px">Welcher Satz könnte von dir sein?</h2>
<div role="group" aria-label="Problem wählen" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px">
<sc-for list="{{pains}}" as="p" hint-placeholder-count="8">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="{{p.style}}">„{{p.quote}}“</button>
</sc-for>
</div>
<div class="mid-in" style="background: #ffffff; border-radius: 24px; border: 1px solid #dddddd; overflow: hidden; display: flex; flex-wrap: wrap">
<div style="flex: 1 1 420px; min-width: 0; padding: 40px; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5c5c5c">Was das kostet</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.8vw, 32px); font-weight: 700; line-height: 1.2">{{painHead}}</span>
<span style="font-size: 17px; line-height: 1.6; color: #3d3d3d">{{painCost}}</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{painFlags}}" as="fl" hint-placeholder-count="3">
<span style="font-size: 14px; font-weight: 600; border: 1px dashed #5c5c5c; border-radius: 999px; padding: 6px 14px">{{fl}}</span>
</sc-for>
</div>
</div>
<div style="flex: 1 1 420px; min-width: 0; padding: 40px; background: #141414; color: #ffffff; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #b8b8b8">Unsere Lösung</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.8vw, 32px); font-weight: 700; line-height: 1.2">{{solHead}}</span>
<span style="font-size: 17px; line-height: 1.6; color: #d4d4d4">{{solText}}</span>
<div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: auto; padding-top: 8px">
<a href="{{solHref}}" style="background: #ffffff; color: #141414; text-decoration: none; padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 15px">{{solCta}}</a>
<a href="{{leistHref}}" style="color: #ffffff; padding: 12px 4px; font-weight: 600; font-size: 15px">{{leistLabel}}</a>
</div>
</div>
</div>
</div>
</section>

<section style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 32px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Der Preis des Abwartens</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 920px">Nicht entscheiden ist auch eine Entscheidung. Meist die teuerste.</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<div style="border-top: 4px solid #141414; padding-top: 20px; display: flex; flex-direction: column; gap: 10px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Jeder Monat in der falschen Struktur</span><span style="font-size: 16px; line-height: 1.6; color: #3d3d3d">… kostet dich Geld, das du nie zurückbekommst. Die Rechnung kommt mit dem nächsten Bescheid – und dann ist das Jahr gelaufen.</span></div>
<div style="border-top: 4px solid #141414; padding-top: 20px; display: flex; flex-direction: column; gap: 10px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Jede Entscheidung ohne Zahlen</span><span style="font-size: 16px; line-height: 1.6; color: #3d3d3d">… ist eine Wette. Einstellen, investieren, entnehmen: Wer nach Kontostand entscheidet, merkt Fehler erst, wenn sie Geld gekostet haben.</span></div>
<div style="border-top: 4px solid #141414; padding-top: 20px; display: flex; flex-direction: column; gap: 10px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Jeder Vertrag, der schon unterschrieben ist</span><span style="font-size: 16px; line-height: 1.6; color: #3d3d3d">… lässt sich kaum noch gestalten. Im Jahresabschluss wird nur noch bestätigt – oder repariert.</span></div>
</div>
<div style="background: #141414; color: #ffffff; border-radius: 24px; padding: 36px 40px; display: flex; gap: 24px; flex-wrap: wrap; align-items: center; justify-content: space-between">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(22px, 2.6vw, 30px); font-weight: 600; line-height: 1.3; max-width: 720px">Das Problem ist selten dein Steuerberater. Es ist die Lücke zwischen Zahlen, Struktur und Umsetzung.</span>
<a href="warum.html" style="background: #ffffff; color: #141414; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 600; font-size: 15px">Wie wir sie schließen →</a>
</div>
</section>

<section style="background: #f4f4f4">
<div style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Leistungen</span>
<span style="font-size: 12px; font-weight: 600; border: 1px dashed #5c5c5c; border-radius: 999px; padding: 4px 10px; color: #3d3d3d">Namen offen – mit Heartbeat</span>
</div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 860px">Ein Gesamtpaket. Drei Bausteine, die ineinandergreifen.</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<a href="leistungen.html" class="mid-card" style="background: #ffffff; text-decoration: none; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">make plans done.</span><span style="font-size: 16px; line-height: 1.55; color: #3d3d3d">Dein Zielbild für 1, 3 und 10 Jahre – Unternehmen, Familie, Vermögen und Exit zusammen gedacht.</span><span style="font-size: 14px; font-weight: 600; margin-top: auto">Mehr →</span></a>
<a href="leistungen.html" class="mid-card" style="background: #ffffff; text-decoration: none; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">make finance done.</span><span style="font-size: 16px; line-height: 1.55; color: #3d3d3d">Dein Zahlen-Cockpit: individueller Kontenplan, automatisierte Buchhaltung, Zahlen just in time.</span><span style="font-size: 14px; font-weight: 600; margin-top: auto">Mehr →</span></a>
<a href="leistungen.html" class="mid-card" style="background: #ffffff; text-decoration: none; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">make structure done.</span><span style="font-size: 16px; line-height: 1.55; color: #3d3d3d">Rechtsform, GmbH, Holding, Exit und Nachfolge – vorbereitet von uns, umgesetzt mit deinen Beratern.</span><span style="font-size: 14px; font-weight: 600; margin-top: auto">Mehr →</span></a>
</div>
<div style="border-top: 1px solid #dcdcdc; padding-top: 28px; display: flex; gap: 24px; flex-wrap: wrap; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #5c5c5c">Der Weg</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">Zielbild → Fundament → Steuerung <span style="font-size: 12px; font-weight: 600; border: 1px dashed #5c5c5c; border-radius: 999px; padding: 3px 10px; color: #3d3d3d; vertical-align: middle">Arbeitstitel</span></span>
<span style="font-size: 16px; color: #3d3d3d">Nach 90 Tagen steht dein Fundament – garantiert. Danach steuern wir gemeinsam weiter.</span>
</div>
<a href="so-arbeiten-wir.html" style="background: #141414; color: #ffffff; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 600; font-size: 15px">So arbeiten wir →</a>
</div>
</div>
</section>

<section id="ergebnisse" style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 28px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Ergebnisse</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 900px">Unternehmer, die vor derselben Frage standen – und was daraus wurde.</h2>
<div style="display: flex; flex-direction: column; gap: 28px">
<div role="group" aria-label="Kundengeschichte wählen" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{caseTabs}}" as="ct" hint-placeholder-count="2">
<button type="button" onClick="{{ct.pick}}" aria-pressed="{{ct.on}}" style="{{ct.style}}">
<span style="display: flex; justify-content: space-between; align-items: center; gap: 12px"><span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: .7">{{ct.label}}</span><span style="{{ct.dot}}"></span></span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.15">{{ct.name}}</span>
<span style="font-size: 14px; opacity: .75">{{ct.sub}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; margin-top: 8px">{{ct.big}}</span>
<span style="font-size: 13px; opacity: .7">{{ct.bigSub}}</span>
</button>
</sc-for>
</div>
<button type="button" onClick="{{caseToggle}}" aria-expanded="{{caseOpen}}" style="align-self: flex-start; background: #141414; color: #ffffff; border: 0; border-radius: 999px; padding: 14px 24px; font-size: 15px; font-weight: 600; cursor: pointer; min-height: 44px">{{caseCloseLabel}}</button>
<sc-if value="{{caseOpen}}" hint-placeholder-val="{{ false }}">
<div class="mid-in" style="display: flex; flex-direction: column; gap: 28px">
<div role="tablist" aria-label="Kapitel" style="display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid #e4e4e4; padding-bottom: 10px">
<sc-for list="{{caseChaps}}" as="ch" hint-placeholder-count="6">
<button type="button" role="tab" onClick="{{ch.pick}}" aria-selected="{{ch.on}}" style="{{ch.style}}"><span style="{{ch.numStyle}}">{{ch.num}}</span>{{ch.label}}</button>
</sc-for>
</div>
<div class="mid-in" style="min-height: 320px; display: flex; flex-direction: column; gap: 18px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 3vw, 34px); font-weight: 700; line-height: 1.2; max-width: 900px">{{caseHead}}</span>
<sc-if value="{{caseIsText}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 20px; line-height: 1.6; color: #3d3d3d; max-width: 860px">{{caseText}}</p>
</sc-if>
<sc-if value="{{caseIsList}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 4px 40px">
<sc-for list="{{caseItems}}" as="it" hint-placeholder-count="5">
<div style="display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid #e4e4e4"><span aria-hidden="true" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; flex-shrink: 0; width: 22px">{{caseMark}}</span><span style="font-size: 16px; line-height: 1.55"><b>{{it.t}}</b> {{it.x}}</span></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{caseIsSteps}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; max-width: 900px">
<sc-for list="{{caseItems}}" as="it" hint-placeholder-count="6">
<div style="display: flex; gap: 18px">
<span style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0"><span style="width: 36px; height: 36px; border-radius: 50%; background: #141414; color: #ffffff; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px">{{it.n}}</span><span style="{{it.line}}"></span></span>
<span style="display: flex; flex-direction: column; gap: 4px; padding: 6px 0 22px"><b style="font-family: 'Space Grotesk', sans-serif; font-size: 19px">{{it.t}}</b><span style="font-size: 16px; line-height: 1.55; color: #3d3d3d">{{it.x}}</span></span>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{caseIsPit}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 0; max-width: 980px">
<sc-for list="{{caseItems}}" as="it" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 24px; padding: 18px 0; border-bottom: 1px solid #e4e4e4">
<span style="display: flex; gap: 12px; align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3l10 18H2z" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="round"></path><path d="M12 10v5M12 18v.5" stroke="#141414" stroke-width="2" stroke-linecap="round"></path></svg><span style="font-size: 16px; line-height: 1.5"><b>{{it.t}}</b><br><span style="color: #5c5c5c; font-size: 14px">{{it.law}}</span></span></span>
<span style="display: flex; gap: 12px; align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="10" fill="#141414"></circle><path d="M7 12.5l3 3 7-7" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="font-size: 16px; line-height: 1.55">{{it.x}}</span></span>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{caseIsEffect}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-start">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<sc-for list="{{caseSliders}}" as="sl" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="{{sl.id}}" style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 600"><span>{{sl.label}}</span><span style="font-family: 'Space Grotesk', sans-serif">{{sl.shown}}</span></label>
<input id="{{sl.id}}" type="range" min="{{sl.min}}" max="{{sl.max}}" step="{{sl.step}}" value="{{sl.value}}" onInput="{{sl.change}}" style="width: 100%; accent-color: #141414">
</div>
</sc-for>
<span style="font-size: 13px; line-height: 1.55; color: #5c5c5c">{{caseNote}}</span>
</div>
<div style="flex: 1.3 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px">

            { t: 'Partnerin im Unternehmen', x: 'vom Minijob in einen regulären Vertrag mit C-Level-Rolle. Während der Schwangerschaft mit Teilzeit so gestaltet, dass das Elterngeld erhalten bleibt – die spätere Rückkehr in Vollzeit hält dem Fremdvergleich stand.' },
            { t: 'Mehr Netto für beide', x: 'Kita-Zuschuss, Sachbezug, Internet, Gesundheit und § 37b EStG in die Verträge aufgenommen.' },
            { t: 'Benefit-Regel fürs ganze Team', x: 'mit dem Anwalt eine klare Regel aufgesetzt, die für alle gilt – ausgerollt über ein Benefit-Tool.' },
            { t: 'Zahlen just in time', x: 'Buchhaltung übernommen, Dashboard gebaut: Umsätze, Kosten und Liquidität jederzeit sichtbar.' },
            { t: 'Marschroute Immobilien', x: 'Bestand langfristig privat, Projekte über eine eigene GmbH unter der Holding – die Liquiditätsplanung zeigt, ab wann das Eigenkapital steht.' } ] },
          { k: 'pit', label: 'Worauf es ankam', head: 'Die Fallstricke – und wie wir sie umgangen haben.', items: [
            { t: 'Sacheinlage in eine UG', law: '§ 5a GmbHG, BGH II ZB 25/10', x: 'Eine UG darf Kapital nur per Sacheinlage erhöhen, wenn sie damit auf 25.000 € kommt – die Einbringung wurde deshalb zugleich der Schritt zur GmbH.' },
            { t: 'Sperrfrist von 7 Jahren', law: '§ 22 UmwStG', x: 'Spätere Umhängungen der Anteile hätten rückwirkend Steuer ausgelöst – die Struktur wurde von Anfang an so gebaut, dass das nicht nötig ist.' },
            { t: 'Darlehen an den Gesellschafter', law: '§ 8 Abs. 3 KStG, §§ 30, 43a GmbHG', x: 'Vertrag, Zins, Tilgung und Sicherheit wie unter Fremden – sonst droht eine verdeckte Gewinnausschüttung.' },
            { t: 'Verträge mit Angehörigen', law: 'Fremdvergleich, § 7a SGB IV', x: 'Inhalt, Gehalt und Durchführung wie unter Fremden, gleicher Stundensatz bei mehr Stunden – plus Statusfeststellung bei der Rentenversicherung.' },
            { t: 'Elterngeld', law: '§ 1 Abs. 6 und 8 BEEG', x: 'Einkommensgrenze des Paares und höchstens 32 Wochenstunden – Gehalt und Stunden wurden darauf abgestimmt.' },
            { t: 'Benefits nur zusätzlich', law: '§ 8 Abs. 4 EStG', x: 'Steuerfrei nur zusätzlich zum geschuldeten Lohn – keine Umwandlung bestehender Gehälter.' } ] },
          { k: 'list', label: 'Ergebnis', mark: '✓', head: 'Vom Feuerlöschen zum Plan.', items: [
            { t: 'Rückstände geregelt', x: 'und die Vorauszahlungen passen wieder zum Gewinn.' },
            { t: 'Zahlen jederzeit im Blick', x: '– statt Wochen auf die BWA zu warten.' },
            { t: 'Mehr Netto', x: 'für die Familie und das ganze Team, bei gleichen Kosten.' },
            { t: 'Der Weg zur Immobilie steht:', x: 'Struktur und Zeitpunkt sind klar.' } ] },
          { k: 'effect', label: 'Der Effekt', head: 'Was Benefits statt Gehaltserhöhung bringen.' } ] }
    ];
    var cs = CASES[st.cs], chs = cs.chaps, cch = Math.min(st.cch, chs.length - 1), cc = chs[cch];
    var caseTabs = CASES.map(function (d, i) {
      var on = st.cs === i;
      return { label: d.label, name: d.name, sub: d.sub, big: d.big, bigSub: d.bigSub, on: on,
        pick: function () { self.setState({ cs: i, cch: 0, copen: true }); },
        dot: 'width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; ' + (on ? 'background: #ffffff; box-shadow: inset 0 0 0 6px #141414, 0 0 0 2px #ffffff;' : 'border: 2px solid #141414;'),
        style: 'display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 28px; border-radius: 24px; cursor: pointer; transition: background .25s, color .25s, transform .2s; ' + (on ? 'background: #141414; color: #ffffff; border: 2px solid #141414; transform: translateY(-2px);' : 'background: #ffffff; color: #141414; border: 2px solid #dddddd;') };
    });
    var caseChaps = chs.map(function (c, i) {
      var on = i === cch, done = i < cch;
      return { label: c.label, num: String(i + 1), on: on, pick: function () { self.setState({ cch: i }); },
        numStyle: 'display: inline-flex; width: 22px; height: 22px; border-radius: 50%; align-items: center; justify-content: center; font-size: 12px; margin-right: 8px; ' + (on ? 'background: #ffffff; color: #141414;' : done ? 'background: #141414; color: #ffffff;' : 'border: 1px solid #8a8a8a; color: #5c5c5c;'),
        style: 'display: inline-flex; align-items: center; border: 0; border-radius: 999px; padding: 10px 16px 10px 10px; font-size: 15px; cursor: pointer; min-height: 44px; transition: background .2s; ' + (on ? 'background: #141414; color: #ffffff; font-weight: 600;' : 'background: transparent; color: #141414; font-weight: 500;') };
    });
    var items = (cc.items || []).map(function (it, i, arr) { return { t: it.t, x: it.x, law: it.law || '', n: String(i + 1), line: i === arr.length - 1 ? 'flex: 1; width: 0' : 'flex: 1; width: 2px; background: #141414; min-height: 16px' }; });
    function eurC(n) { return Math.round(n).toLocaleString('de-DE') + ' €'; }
    var caseSliders = [], caseBars = [], caseDiff = '', caseDiffLabel = '', caseNote = '';
    function sliderC(id, label, key, min, max, step, shown) { return { id: id, label: label, min: min, max: max, step: step, value: st[key], shown: shown, change: function (e) { var o = {}; o[key] = Number(e.target.value); self.setState(o); } }; }
    function bar(label, v, max, dark) { return { label: label, value: eurC(v), style: 'height: 100%; border-radius: 12px; transition: width .4s ease; width: ' + Math.max(2, v / max * 100).toFixed(1) + '%; background: ' + (dark ? '#141414' : '#b8b8b8') }; }
    if (st.cs === 0) {
      var ex = st.cexit, tp = ex * 0.6 * 0.45 * 1.055, th = ex * 0.05 * (0.15 * 1.055 + 0.14);
      caseSliders = [sliderC('c-exit', 'Gewinn aus dem Verkauf einer Beteiligung', 'cexit', 250000, 5000000, 50000, eurC(ex))];
      caseBars = [bar('Steuer, wenn die Anteile privat liegen', tp, tp, false), bar('Steuer über die Holding', th, tp, true)];
      caseDiffLabel = 'Bleibt mehr zum Reinvestieren'; caseDiff = eurC(tp - th);
      caseNote = 'Beispielrechnung, nicht die Zahlen des Kunden: Teileinkünfteverfahren mit 45 % Spitzensteuersatz plus Soli gegenüber § 8b KStG bei 400 % Hebesatz, Stand 2026, ohne Kirchensteuer. Fließt das Geld später privat weiter, fällt Abgeltungsteuer an. Kein Steuerversprechen – die Würdigung im Einzelfall übernimmt dein Steuerberater.';
    } else {
      var bud = st.cbud, n = st.cstaff, benNet = bud * 450 / 463, salNet = bud / 1.21 * 0.37;
      caseSliders = [sliderC('c-bud', 'Budget pro Person und Monat', 'cbud', 100, 1000, 10, eurC(bud)), sliderC('c-staff', 'Personen im Team', 'cstaff', 1, 30, 1, String(n))];
      caseBars = [bar('Netto als Gehaltserhöhung (pro Jahr, ganzes Team)', salNet * 12 * n, benNet * 12 * n, false), bar('Netto als Benefits (pro Jahr, ganzes Team)', benNet * 12 * n, benNet * 12 * n, true)];
      caseDiffLabel = 'Mehr netto im Jahr – bei gleichen Kosten'; caseDiff = eurC((benNet - salNet) * 12 * n);
      caseNote = 'Beispielrechnung, nicht die Zahlen des Kunden: Mischung aus Sachbezug, Kita-Zuschuss, Internet und Gesundheit wie im Fall; Gehaltserhöhung bei 42 % Grenzsteuersatz und rund 21 % Sozialabgaben je Seite. Dazu im Fall: Bei 400.000 € Gewinn blieben in der GmbH rund 39.000 € mehr verfügbar als im Einzelunternehmen.';
    }
    var cBtn = 'border-radius: 999px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; min-height: 44px; ';
    var lastCh = cch === chs.length - 1;
    var caseVals = {
      caseOpen: !!st.copen, caseCloseLabel: st.copen ? 'Geschichte zuklappen ↑' : 'Ganze Geschichte lesen ↓', caseToggle: function () { self.setState({ copen: !st.copen }); },
      caseTabs: caseTabs, caseChaps: caseChaps, caseHead: cc.head, caseText: cc.text || '', caseItems: items, caseMark: cc.mark || '•',
      caseIsText: cc.k === 'text', caseIsList: cc.k === 'list', caseIsSteps: cc.k === 'steps', caseIsPit: cc.k === 'pit', caseIsEffect: cc.k === 'effect',
      caseSliders: caseSliders, caseBars: caseBars, caseDiff: caseDiff, caseDiffLabel: caseDiffLabel, caseNote: caseNote, caseCalcHref: cs.calc, caseQuote: cs.quote,
      caseBack: function () { if (cch > 0) self.setState({ cch: cch - 1 }); },
      caseFwd: function () { if (!lastCh) self.setState({ cch: cch + 1 }); else self.setState({ cs: (st.cs + 1) % CASES.length, cch: 0 }); },
      caseFwdLabel: lastCh ? 'Nächste Geschichte →' : 'Weiter: ' + chs[cch + 1].label + ' →',
      caseBackStyle: cBtn + 'background: #ffffff; color: #141414; border: 1px solid #141414; visibility: ' + (cch === 0 ? 'hidden' : 'visible'),
      caseFwdStyle: cBtn + 'background: #141414; color: #ffffff; border: 1px solid #141414;'
    };
    var FAQ = [
      { q: 'Ersetzt ihr meinen Steuerberater?', a: 'Nein. Dein Steuerberater bleibt und wird besser eingebunden: Er prüft und bewertet steuerlich, wir bereiten vor, rechnen, koordinieren und setzen um.' },
      { q: 'Versprecht ihr mir eine Steuerersparnis?', a: 'Nein – seriös kann das niemand vorab. Wir sorgen dafür, dass deine Struktur zu deinen Zielen passt und du mit aktuellen Zahlen entscheidest. Die steuerliche Würdigung übernimmt dein Steuerberater.' },
      { q: 'Bin ich dafür nicht zu klein?', a: 'Gerade auf dem Weg vom Einzelunternehmen zur GmbH werden die Weichen gestellt. Später umzubauen ist aufwendiger und teurer.' },
      { q: 'Muss ich mich langfristig binden?', a: 'Nein. Du startest mit den ersten 90 Tagen. Ob du danach weitermachst, entscheidest du selbst – Analyse, Dashboard und Roadmap gehören in jedem Fall dir.' },
      { q: 'Was kostet das?', a: 'Du zahlst für Ergebnisse, nicht für Stunden. Was am Ende stehen soll, legen wir vorher fest – zu einem Festpreis. Den Rahmen besprechen wir im Strategiegespräch.' }
    ];
    var faqs = FAQ.map(function (d, i) {
      var isOpen = st.faq === i;
      return { q: d.q, a: d.a, open: isOpen, sign: isOpen ? '−' : '+', toggle: function () { self.setState({ faq: isOpen ? -1 : i }); } };
    });
    return Object.assign({}, caseVals, {
      pains: pains, painHead: c.h, painCost: c.c, painFlags: c.f, solHead: c.sh, solText: c.st, solHref: c.hr, solCta: c.cta, leistHref: c.lh, leistLabel: c.ll,
      faqs: faqs
    });
  }
}

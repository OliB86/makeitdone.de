<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Start – make it done (Entwurf)</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Inter;src:url(/fonts/inter-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(/fonts/inter-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Inter;src:url(/fonts/inter-latin-600-normal.woff2) format("woff2");font-weight:600 700;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}

body{margin:0;background:#ffffff;color:#141414;font-family:Inter,system-ui,sans-serif}
a{color:#141414}a:hover{color:#555555}
button{font-family:inherit}
.mid-card{transition:transform .2s ease, box-shadow .2s ease}
.mid-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.10)}
@keyframes mid-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mid-in{animation:mid-in .35s ease-out both}
@media (prefers-reduced-motion: reduce){.mid-card,.mid-in{transition:none;animation:none}}

html{scroll-behavior:smooth;scroll-padding-top:90px}
@media (max-width:760px){header nav{flex-wrap:nowrap !important;overflow-x:auto;max-width:100%;padding-bottom:4px;-webkit-overflow-scrolling:touch}header nav a{white-space:nowrap}header nav a:last-child{order:-1}}
</style>
</head>
<body>
<template id="tpl">


<div style="width: 100%; background: #ffffff; color: #141414; font-family: Inter, system-ui, sans-serif">

<div style="background: #141414; color: #f2f2f2; font-size: 13px; padding: 10px 24px; text-align: center; letter-spacing: 0.02em">Entwurf · nicht verlinkt · Texte und Begriffe in Abstimmung mit Heartbeat</div>

<header style="position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.96); backdrop-filter: blur(8px); border-bottom: 1px solid #ececec">
<div style="max-width: 1120px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
<a href="index.html" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; text-decoration: none">make it done</a>
<nav aria-label="Hauptmenü" style="display: flex; gap: 20px; flex-wrap: wrap; font-size: 15px; align-items: center">
<a href="leistungen.html" style="text-decoration: none">Leistungen</a>
<a href="warum.html" style="text-decoration: none">Warum make it done</a>
<a href="fuer-wen.html" style="text-decoration: none">Für wen</a>
<a href="so-arbeiten-wir.html" style="text-decoration: none">So arbeiten wir</a>
<a href="rechner.html" style="text-decoration: none">Rechner</a>
<a href="ueber-uns.html" style="text-decoration: none">Über uns</a>
<a href="karriere.html" style="text-decoration: none">Karriere</a>
<a href="kontakt.html" style="text-decoration: none">Kontakt</a>
<a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=nav-start" style="text-decoration: none; background: #141414; color: #ffffff; padding: 10px 20px; border-radius: 999px; font-weight: 600">Erstgespräch</a>
</nav>
</div>
</header>

<section style="max-width: 1120px; margin: 0 auto; padding: 64px 24px 80px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Finanz- und Strukturbegleitung &amp; C-Level-Support</span>
<span style="font-size: 12px; font-weight: 600; border: 1px dashed #5c5c5c; border-radius: 999px; padding: 4px 10px; color: #3d3d3d">Überschrift: Arbeitsstand – mit Heartbeat</span>
</div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(42px, 6.4vw, 82px); line-height: 1.0; letter-spacing: -0.02em; max-width: 1000px">Wachstum braucht Struktur.<br>We <span style="font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400">make it done</span>.</h1>
<p style="margin: 0; font-size: 20px; line-height: 1.55; color: #3d3d3d; max-width: 760px">Wir sorgen für Zahlen, mit denen du steuern kannst, eine Struktur, die zu deinen Zielen passt, und setzen beides um – gemeinsam mit deinem Steuerberater und unserem Netzwerk aus Wirtschaftsprüfern und Rechtsanwälten.</p>
<div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: center">
<a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=start" style="background: #141414; color: #ffffff; text-decoration: none; padding: 16px 28px; border-radius: 999px; font-weight: 600; font-size: 16px">Jetzt Erstberatung sichern →</a>
<a href="#schuh" style="text-decoration: none; padding: 16px 8px; font-weight: 500; font-size: 16px; color: #3d3d3d">Wo drückt der Schuh? ↓</a>
</div>
<div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px">
<span style="background: #f4f4f4; border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 500">Erfahrung aus Steuerberatung, Prüfung und Geschäftsführung</span>
<span style="background: #f4f4f4; border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 500">Festpreis für feste Ergebnisse</span>
<span style="background: #f4f4f4; border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 500">Netzwerk: Steuerberater · Wirtschaftsprüfer · Rechtsanwälte</span>
</div>
</section>

<section id="schuh" style="background: #f4f4f4">
<div style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 28px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Wo drückt der Schuh?</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 880px">Welcher Satz könnte von dir sein?</h2>
<div role="group" aria-label="Problem wählen" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px">
<sc-for list="{{pains}}" as="p" hint-placeholder-count="8">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="{{p.style}}">„{{p.quote}}“</button>
</sc-for>
</div>
<div class="mid-in" style="background: #ffffff; border-radius: 24px; border: 1px solid #dddddd; overflow: hidden; display: flex; flex-wrap: wrap">
<div style="flex: 1 1 420px; min-width: 0; padding: 40px; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5c5c5c">Was das kostet</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.8vw, 32px); font-weight: 700; line-height: 1.2">{{painHead}}</span>
<span style="font-size: 17px; line-height: 1.6; color: #3d3d3d">{{painCost}}</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{painFlags}}" as="fl" hint-placeholder-count="3">
<span style="font-size: 14px; font-weight: 600; border: 1px dashed #5c5c5c; border-radius: 999px; padding: 6px 14px">{{fl}}</span>
</sc-for>
</div>
</div>
<div style="flex: 1 1 420px; min-width: 0; padding: 40px; background: #141414; color: #ffffff; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #b8b8b8">Unsere Lösung</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.8vw, 32px); font-weight: 700; line-height: 1.2">{{solHead}}</span>
<span style="font-size: 17px; line-height: 1.6; color: #d4d4d4">{{solText}}</span>
<div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: auto; padding-top: 8px">
<a href="{{solHref}}" style="background: #ffffff; color: #141414; text-decoration: none; padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 15px">{{solCta}}</a>
<a href="{{leistHref}}" style="color: #ffffff; padding: 12px 4px; font-weight: 600; font-size: 15px">{{leistLabel}}</a>
</div>
</div>
</div>
</div>
</section>

<section style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 32px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Der Preis des Abwartens</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 920px">Nicht entscheiden ist auch eine Entscheidung. Meist die teuerste.</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<div style="border-top: 4px solid #141414; padding-top: 20px; display: flex; flex-direction: column; gap: 10px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Jeder Monat in der falschen Struktur</span><span style="font-size: 16px; line-height: 1.6; color: #3d3d3d">… kostet dich Geld, das du nie zurückbekommst. Die Rechnung kommt mit dem nächsten Bescheid – und dann ist das Jahr gelaufen.</span></div>
<div style="border-top: 4px solid #141414; padding-top: 20px; display: flex; flex-direction: column; gap: 10px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Jede Entscheidung ohne Zahlen</span><span style="font-size: 16px; line-height: 1.6; color: #3d3d3d">… ist eine Wette. Einstellen, investieren, entnehmen: Wer nach Kontostand entscheidet, merkt Fehler erst, wenn sie Geld gekostet haben.</span></div>
<div style="border-top: 4px solid #141414; padding-top: 20px; display: flex; flex-direction: column; gap: 10px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Jeder Vertrag, der schon unterschrieben ist</span><span style="font-size: 16px; line-height: 1.6; color: #3d3d3d">… lässt sich kaum noch gestalten. Im Jahresabschluss wird nur noch bestätigt – oder repariert.</span></div>
</div>
<div style="background: #141414; color: #ffffff; border-radius: 24px; padding: 36px 40px; display: flex; gap: 24px; flex-wrap: wrap; align-items: center; justify-content: space-between">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(22px, 2.6vw, 30px); font-weight: 600; line-height: 1.3; max-width: 720px">Das Problem ist selten dein Steuerberater. Es ist die Lücke zwischen Zahlen, Struktur und Umsetzung.</span>
<a href="warum.html" style="background: #ffffff; color: #141414; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 600; font-size: 15px">Wie wir sie schließen →</a>
</div>
</section>

<section style="background: #f4f4f4">
<div style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Leistungen</span>
<span style="font-size: 12px; font-weight: 600; border: 1px dashed #5c5c5c; border-radius: 999px; padding: 4px 10px; color: #3d3d3d">Namen offen – mit Heartbeat</span>
</div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 860px">Ein Gesamtpaket. Drei Bausteine, die ineinandergreifen.</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<a href="leistungen.html" class="mid-card" style="background: #ffffff; text-decoration: none; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">make plans done.</span><span style="font-size: 16px; line-height: 1.55; color: #3d3d3d">Dein Zielbild für 1, 3 und 10 Jahre – Unternehmen, Familie, Vermögen und Exit zusammen gedacht.</span><span style="font-size: 14px; font-weight: 600; margin-top: auto">Mehr →</span></a>
<a href="leistungen.html" class="mid-card" style="background: #ffffff; text-decoration: none; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">make finance done.</span><span style="font-size: 16px; line-height: 1.55; color: #3d3d3d">Dein Zahlen-Cockpit: individueller Kontenplan, automatisierte Buchhaltung, Zahlen just in time.</span><span style="font-size: 14px; font-weight: 600; margin-top: auto">Mehr →</span></a>
<a href="leistungen.html" class="mid-card" style="background: #ffffff; text-decoration: none; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">make structure done.</span><span style="font-size: 16px; line-height: 1.55; color: #3d3d3d">Rechtsform, GmbH, Holding, Exit und Nachfolge – vorbereitet von uns, umgesetzt mit deinen Beratern.</span><span style="font-size: 14px; font-weight: 600; margin-top: auto">Mehr →</span></a>
</div>
<div style="border-top: 1px solid #dcdcdc; padding-top: 28px; display: flex; gap: 24px; flex-wrap: wrap; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #5c5c5c">Der Weg</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">Zielbild → Fundament → Steuerung <span style="font-size: 12px; font-weight: 600; border: 1px dashed #5c5c5c; border-radius: 999px; padding: 3px 10px; color: #3d3d3d; vertical-align: middle">Arbeitstitel</span></span>
<span style="font-size: 16px; color: #3d3d3d">Nach 90 Tagen steht dein Fundament – garantiert. Danach steuern wir gemeinsam weiter.</span>
</div>
<a href="so-arbeiten-wir.html" style="background: #141414; color: #ffffff; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 600; font-size: 15px">So arbeiten wir →</a>
</div>
</div>
</section>

<section style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Ergebnisse</span>
<span style="font-size: 12px; font-weight: 600; border: 1px dashed #5c5c5c; border-radius: 999px; padding: 4px 10px; color: #3d3d3d">vorerst anonym – Freigaben klären</span>
</div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(28px, 3.5vw, 42px); line-height: 1.12; max-width: 860px">Unternehmer, die vor derselben Frage standen.</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px">
<div style="background: #f4f4f4; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Kunde A · Holding &amp; Exit</span>
<span style="font-size: 16px; line-height: 1.55; color: #3d3d3d">Doppelstöckige Holding, Immobilien- und Investment-Tochter, Vergütung neu aufgestellt. Gewinne und Exit-Erlöse kommen fast vollständig in der Holding an.</span>
<a href="rechner-holding.html" style="font-weight: 600; font-size: 15px; margin-top: auto">Effekt berechnen →</a>
</div>
<div style="background: #f4f4f4; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Kunde B · Beratungsunternehmen</span>
<span style="font-size: 16px; line-height: 1.55; color: #3d3d3d">Rund 1 Mio. € Umsatz als Einzelunternehmen. Heute: GmbH unter Holding, Rückstände geregelt, Zahlen jederzeit im Blick.</span>
<a href="rechner-rechtsform.html" style="font-weight: 600; font-size: 15px; margin-top: auto">Effekt berechnen →</a>
</div>
</div>
</section>

<section style="background: #f4f4f4">
<div style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 28px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Rechner</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(28px, 3.5vw, 42px); line-height: 1.12; max-width: 860px">Erst rechnen. Dann entscheiden.</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
<a href="rechner-rechtsform.html" class="mid-card" style="background: #ffffff; border-radius: 16px; padding: 24px; text-decoration: none; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600; color: #5c5c5c">„Ich wachse schnell“</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600">Einzelunternehmen, GmbH oder Holding?</span></a>
<a href="rechner-holding.html" class="mid-card" style="background: #ffffff; border-radius: 16px; padding: 24px; text-decoration: none; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600; color: #5c5c5c">„Ich verkaufe Anteile“</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600">Exit und Beteiligungen</span></a>
<a href="rechner-netto.html" class="mid-card" style="background: #ffffff; border-radius: 16px; padding: 24px; text-decoration: none; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600; color: #5c5c5c">„Ich will mein Team stärken“</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600">Netto vom Brutto</span></a>
<a href="rechner-immobilien.html" class="mid-card" style="background: #ffffff; border-radius: 16px; padding: 24px; text-decoration: none; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600; color: #5c5c5c">„Ich will investieren“</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600">Immobilien privat oder GmbH</span></a>
</div>
<span style="font-size: 13px; color: #5c5c5c">Vereinfachte Beispielrechnungen, anonym, ohne Empfehlung im Einzelfall.</span>
</div>
</section>

<section style="max-width: 880px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 24px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Häufige Fragen</span>
<h2 style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 44px); line-height: 1.1">Was Unternehmer uns vorher fragen.</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{faqs}}" as="f" hint-placeholder-count="5">
<div style="background: #f4f4f4; border-radius: 14px">
<button type="button" onClick="{{f.toggle}}" aria-expanded="{{f.open}}" style="width: 100%; background: transparent; border: 0; padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; text-align: left; cursor: pointer; font-size: 17px; font-weight: 600; color: #141414; min-height: 44px">
<span>{{f.q}}</span>
<span aria-hidden="true" style="font-size: 22px; font-weight: 400">{{f.sign}}</span>
</button>
<sc-if value="{{f.open}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 0 24px 24px; font-size: 16px; line-height: 1.65; color: #3d3d3d">{{f.a}}</p>
</sc-if>
</div>
</sc-for>
</div>
</section>

<section style="background: #141414; color: #f2f2f2">
<div style="max-width: 1120px; margin: 0 auto; padding: 104px 24px; display: flex; flex-direction: column; gap: 24px; align-items: flex-start">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 4.5vw, 56px); line-height: 1.05; max-width: 820px">Bevor du die nächste Entscheidung triffst: sprich mit uns.</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #d4d4d4; max-width: 640px">15 Minuten Erstgespräch, unverbindlich. Wir schauen, ob wir dir helfen können. Wir arbeiten bewusst nur mit einer begrenzten Zahl an Unternehmen gleichzeitig.</p>
<div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: center">
<a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=start" style="background: #ffffff; color: #141414; text-decoration: none; padding: 16px 28px; border-radius: 999px; font-weight: 600; font-size: 16px">Jetzt Erstberatung sichern →</a>
</div>
</div>
</section>

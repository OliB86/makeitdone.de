<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">

</sc-if>

<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.2">{{t.title}} <span style="font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; color: #5c5c5c">{{t.tag}}</span></span>

</sc-if>

<span style="font-size: 16px; line-height: 1.6; color: #3d3d3d">Rechtsform · ungefährer Umsatz und Gewinn · Anzahl Mitarbeitende · die Frage, die dich gerade am meisten beschäftigt.</span>

<span style="font-size: 17px; line-height: 1.7">make it done GmbH<br>Krefelder Straße 10<br>41812 Erkelenz</span>
<span style="font-size: 14px; color: #b8b8b8">HRB 22388, Amtsgericht Mönchengladbach</span>
</div>
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #b8b8b8">Vorträge, Kooperationen, Presse</span>
<span style="font-size: 17px; line-height: 1.6; color: #d4d4d4">Für Keynotes, Workshops und Kooperationen erreichst du Olga Bertram direkt.</span>
<a href="https://olga-bertram.de" style="color: #ffffff; font-weight: 600; font-size: 16px">olga-bertram.de →</a>

<section style="background: #f4f4f4">

<div id="app"></div>
<script src="dc-lite.js?v=1794923575"></script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { faq: 0, step: 0 };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var TL = [
      { head: 'Im Vorfeld', time: '15 Minuten · online oder Telefon', title: 'Erstgespräch', tag: 'unverbindlich', text: 'Wir lernen uns kennen und schauen, ob wir dir helfen können – und ob du ein gutes Gefühl mit uns hast. Kein Verkaufsgespräch, keine Paketauswahl.' },
      { time: '90 Minuten · per Video', title: 'Strategiegespräch', tag: '', text: 'Wir gehen tief in deine Situation: Zahlen, Struktur, Ziele. Du bekommst eine ehrliche Einschätzung, was möglich ist und wie dein Weg aussehen würde.' },
      { time: 'danach', title: 'Entscheidung', tag: 'auf beiden Seiten', text: 'Passt es für dich und für uns, legen wir den Start fest. Wir arbeiten bewusst nur mit einer begrenzten Zahl an Unternehmen gleichzeitig – deshalb entscheiden wir das gemeinsam.' },
      { head: 'Ab hier geht es los', dark: true, time: 'Woche 1–2', title: 'Onboarding & Unternehmensanalyse', tag: 'make it visible.', text: 'Wir schauen uns alles an: Zahlen, Buchhaltung, Verträge, Rechtsform, Prozesse. Dazu bekommst du einen kurzen Kurs zu deinen Gestaltungsmöglichkeiten – damit du im Workshop mitentscheiden kannst.' },
      { time: 'Woche 2', title: 'Zielbild-Workshop', tag: 'make plans done.', text: 'Persönlich und unternehmerisch, für 1, 3 und 10 Jahre: Familie, Vermögen, Investitionen, Exit. Alles Weitere richtet sich danach aus.' },
      { time: 'bis Tag 14', title: 'Struktur-Fahrplan', tag: 'make structure done.', text: 'Die Struktur, die zu deinem Zielbild passt – mit fertig vorbereiteten Fragen an Steuerberater und Anwalt.' },
      { time: 'Tag 30–90', title: 'Zahlen-Cockpit', tag: 'make finance done.', text: 'Individueller Kontenplan, automatisierte Buchhaltung, Kennzahlen, Cashflow und Liquidität – dein Cockpit ist live, deine Zahlen kommen just in time.' },
      { time: 'Tag 90', title: 'Dein Fundament steht', tag: 'Umsetzungsplan', text: 'Quick Wins sind erledigt, alles Weitere steht mit Terminen im Plan – auch Schritte mit Fristen wie eine Umwandlung.' },
      { time: 'laufend', title: 'Wir steuern gemeinsam', tag: 'make it done.', text: 'Jetzt kommen die Entscheidungen, für die das Fundament gebaut ist: Einstellungen, Investitionen, größere Ausgaben, Umsetzungen mit Fristen. Wir sind dabei – im festen Gesprächsrhythmus, mit Meilensteingesprächen und einem Vorab-Check, wann immer du ihn brauchst.', last: true }
    ];
    var tl = TL.map(function (d, i) {
      var isOn = st.step === i;
      var pre = i < 3;
      return { num: String(i + 1), time: d.time, title: d.title, tag: d.tag, text: d.text, on: isOn,
        hasHead: !!d.head, head: d.head || '',
        headStyle: d.dark ? 'margin: 12px 0 28px; background: #141414; color: #ffffff; border-radius: 14px; padding: 14px 20px; font-family: Space Grotesk, sans-serif; font-size: 20px; font-weight: 700' : 'margin: 0 0 18px; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c',
        pick: function () { self.setState({ step: isOn ? -1 : i }); },
        dot: 'width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: Space Grotesk, sans-serif; font-weight: 700; font-size: 16px; flex-shrink: 0; transition: background .2s, color .2s; ' + (isOn ? 'background: #141414; color: #ffffff; border: 2px solid #141414;' : pre ? 'background: #ffffff; color: #141414; border: 2px dashed #8a8a8a;' : 'background: #ffffff; color: #141414; border: 2px solid #141414;'),
        line: d.last || i === 2 ? 'flex: 1; width: 0' : 'flex: 1; width: 2px; min-height: 24px; ' + (pre ? 'background: repeating-linear-gradient(180deg, #8a8a8a 0 6px, transparent 6px 12px)' : 'background: #141414') };
    });
    var FAQ = [
      { q: 'Kostet das Erstgespräch etwas?', a: 'Nein. Die 15 Minuten sind unverbindlich – wir schauen gemeinsam, ob wir zusammenpassen.' },
      { q: 'Wie finden die Gespräche statt?', a: 'Online – per Video oder Telefon. So geht es schnell, egal wo du sitzt.' },
      { q: 'Muss ich Unterlagen vorbereiten?', a: 'Nein. Ein paar Eckdaten helfen, sind aber kein Muss. Unterlagen brauchen wir erst in der Unternehmensanalyse.' },
      { q: 'Sollte mein Steuerberater dabei sein?', a: 'Für das Erstgespräch nicht nötig. Später binden wir ihn gern ein.' }
    ];
    var faqs = FAQ.map(function (d, i) {
      var isOpen = st.faq === i;
      return { q: d.q, a: d.a, open: isOpen, sign: isOpen ? '−' : '+', toggle: function () { self.setState({ faq: isOpen ? -1 : i }); } };
    });
    return {
      tl: tl,
      faqs: faqs
    };
  }
}

dcMount(Component, 'tpl', 'app');
</script>

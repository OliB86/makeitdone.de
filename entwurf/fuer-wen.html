<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Für wen – make it done (Entwurf)</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Inter;src:url(/fonts/inter-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(/fonts/inter-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Inter;src:url(/fonts/inter-latin-600-normal.woff2) format("woff2");font-weight:600 700;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Instrument Serif";src:url(/fonts/instrument-serif-latin-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}

body{margin:0;background:#ffffff;color:#141414;font-family:Inter,system-ui,sans-serif}
a{color:#141414}a:hover{color:#555555}
button{font-family:inherit}
@keyframes mid-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.mid-in{animation:mid-in .35s ease-out both}

html{scroll-behavior:smooth;scroll-padding-top:90px}
@media (max-width:760px){header nav{flex-wrap:nowrap !important;overflow-x:auto;max-width:100%;padding-bottom:4px;-webkit-overflow-scrolling:touch}header nav a{white-space:nowrap}header nav:not(.hdr-nav) a:last-child{order:-1}}
</style>
</head>
<body>
<template id="tpl">


<div style="width: 100%; background: #ffffff; color: #141414; font-family: Inter, system-ui, sans-serif">

<div style="background: #141414; color: #f2f2f2; font-size: 13px; padding: 10px 24px; text-align: center; letter-spacing: 0.02em">Entwurf · nicht verlinkt · Zielgruppe A oder B in Abstimmung mit Heartbeat</div>

<header style="position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.96); backdrop-filter: blur(8px); border-bottom: 1px solid #ececec">
<div style="max-width: 1120px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
<a href="index.html" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; text-decoration: none">make it done</a>
<nav aria-label="Hauptmenü" style="display: flex; gap: 20px; flex-wrap: wrap; font-size: 15px; align-items: center">
<a href="leistungen.html" style="text-decoration: none">Leistungen</a>
<a href="warum.html" style="text-decoration: none">Warum make it done</a>
<a href="fuer-wen.html" style="text-decoration: none; font-weight: 600">Für wen</a>
<a href="so-arbeiten-wir.html" style="text-decoration: none">So arbeiten wir</a>
<a href="rechner.html" style="text-decoration: none">Rechner</a>
<a href="ueber-uns.html" style="text-decoration: none">Über uns</a>
<a href="karriere.html" style="text-decoration: none">Karriere</a>
<a href="kontakt.html" style="text-decoration: none">Kontakt</a>
<a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=nav-fuer-wen" style="text-decoration: none; background: #141414; color: #ffffff; padding: 10px 20px; border-radius: 999px; font-weight: 600">Erstgespräch</a>
</nav>
</div>
</header>

<section style="max-width: 1120px; margin: 0 auto; padding: 64px 24px 72px; display: flex; flex-direction: column; gap: 28px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Für wen</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(40px, 6vw, 76px); line-height: 1.02; letter-spacing: -0.02em; max-width: 1000px">Für Unternehmer, die wachsen – und es richtig aufstellen wollen.</h1>
<p style="margin: 0; font-size: 20px; line-height: 1.55; color: #3d3d3d; max-width: 780px">Inhabergeführt, vom Einzelunternehmen auf dem Weg zur GmbH bis zur Holding. Zu groß, um Zahlen und Struktur nebenbei zu machen – zu klein für eine eigene Finanzabteilung.</p>
</section>

<section style="background: #f4f4f4">
<div style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 28px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Kurzer Selbstcheck</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 860px">Was trifft auf dich zu?</h2>
<div style="display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start">
<div role="group" aria-label="Aussagen wählen" style="flex: 1.4 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{checks}}" as="c" hint-placeholder-count="8">
<button type="button" onClick="{{c.toggle}}" aria-pressed="{{c.on}}" style="{{c.style}}"><span style="{{c.boxStyle}}">{{c.mark}}</span><span>{{c.text}}</span></button>
</sc-for>
</div>
<div style="flex: 1 1 320px; min-width: 0; background: #141414; color: #ffffff; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #b8b8b8">Dein Ergebnis</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.2">{{resTitle}}</span>
<span style="font-size: 16px; line-height: 1.6; color: #d4d4d4">{{resText}}</span>
<a href="{{resHref}}" style="align-self: flex-start; background: #ffffff; color: #141414; text-decoration: none; padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 15px">{{resCta}}</a>
</div>
</div>
</div>
</section>

<section style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 32px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Drei Lagen</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 860px">Wo du stehst – und was jetzt zählt.</h2>
<sc-for list="{{lagen}}" as="l" hint-placeholder-count="3">
<div id="{{l.id}}" style="border: 1px solid #dddddd; border-radius: 24px; padding: 40px; display: flex; gap: 40px; flex-wrap: wrap">
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #5c5c5c">Lage {{l.num}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.15">„{{l.title}}“</span>
<span style="font-size: 17px; line-height: 1.6; color: #3d3d3d">{{l.story}}</span>
</div>
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5c5c5c">Was wir gemeinsam angehen</span>
<span style="font-size: 16px; line-height: 1.65">{{l.tun}}</span>
<div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px">
<a href="{{l.rechner}}" style="background: #141414; color: #ffffff; text-decoration: none; padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: 14px">{{l.rechnerLabel}}</a>
<a href="#geschichte" onClick="{{l.openCase}}" style="background: #ffffff; color: #141414; border: 2px solid #141414; text-decoration: none; padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px">Geschichte von {{l.fall}} lesen ↓</a>
</div>
</div>
</div>
</sc-for>
</section>

<section id="geschichte" style="max-width: 1120px; margin: 0 auto; padding: 0 24px 88px; display: flex; flex-direction: column; gap: 28px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Aus der Praxis</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(28px, 3.5vw, 42px); line-height: 1.12; max-width: 900px">So sah das bei anderen aus.</h2>
<div style="display: flex; flex-direction: column; gap: 28px">
<div role="group" aria-label="Kundengeschichte wählen" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{caseTabs}}" as="ct" hint-placeholder-count="2">
<button type="button" onClick="{{ct.pick}}" aria-pressed="{{ct.on}}" style="{{ct.style}}">
<span style="display: flex; justify-content: space-between; align-items: center; gap: 12px"><span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: .7">{{ct.label}}</span><span style="{{ct.dot}}"></span></span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.15">{{ct.name}}</span>
<span style="font-size: 14px; opacity: .75">{{ct.sub}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; margin-top: 8px">{{ct.big}}</span>
<span style="font-size: 13px; opacity: .7">{{ct.bigSub}}</span>
</button>
</sc-for>
</div>
<button type="button" onClick="{{caseToggle}}" aria-expanded="{{caseOpen}}" style="align-self: flex-start; background: #141414; color: #ffffff; border: 0; border-radius: 999px; padding: 14px 24px; font-size: 15px; font-weight: 600; cursor: pointer; min-height: 44px">{{caseCloseLabel}}</button>
<sc-if value="{{caseOpen}}" hint-placeholder-val="{{ false }}">
<div class="mid-in" style="display: flex; flex-direction: column; gap: 28px">
<div role="tablist" aria-label="Kapitel" style="display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid #e4e4e4; padding-bottom: 10px">
<sc-for list="{{caseChaps}}" as="ch" hint-placeholder-count="6">
<button type="button" role="tab" onClick="{{ch.pick}}" aria-selected="{{ch.on}}" style="{{ch.style}}"><span style="{{ch.numStyle}}">{{ch.num}}</span>{{ch.label}}</button>
</sc-for>
</div>
<div class="mid-in" style="min-height: 320px; display: flex; flex-direction: column; gap: 18px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 3vw, 34px); font-weight: 700; line-height: 1.2; max-width: 900px">{{caseHead}}</span>
<sc-if value="{{caseIsText}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 20px; line-height: 1.6; color: #3d3d3d; max-width: 860px">{{caseText}}</p>
</sc-if>
<sc-if value="{{caseIsList}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 4px 40px">
<sc-for list="{{caseItems}}" as="it" hint-placeholder-count="5">
<div style="display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid #e4e4e4"><span aria-hidden="true" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; flex-shrink: 0; width: 22px">{{caseMark}}</span><span style="font-size: 16px; line-height: 1.55"><b>{{it.t}}</b> {{it.x}}</span></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{caseIsSteps}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; max-width: 900px">
<sc-for list="{{caseItems}}" as="it" hint-placeholder-count="6">
<div style="display: flex; gap: 18px">
<span style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0"><span style="width: 36px; height: 36px; border-radius: 50%; background: #141414; color: #ffffff; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px">{{it.n}}</span><span style="{{it.line}}"></span></span>
<span style="display: flex; flex-direction: column; gap: 4px; padding: 6px 0 22px"><b style="font-family: 'Space Grotesk', sans-serif; font-size: 19px">{{it.t}}</b><span style="font-size: 16px; line-height: 1.55; color: #3d3d3d">{{it.x}}</span></span>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{caseIsPit}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 0; max-width: 980px">
<sc-for list="{{caseItems}}" as="it" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 24px; padding: 18px 0; border-bottom: 1px solid #e4e4e4">
<span style="display: flex; gap: 12px; align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3l10 18H2z" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="round"></path><path d="M12 10v5M12 18v.5" stroke="#141414" stroke-width="2" stroke-linecap="round"></path></svg><span style="font-size: 16px; line-height: 1.5"><b>{{it.t}}</b><br><span style="color: #5c5c5c; font-size: 14px">{{it.law}}</span></span></span>
<span style="display: flex; gap: 12px; align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="10" fill="#141414"></circle><path d="M7 12.5l3 3 7-7" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="font-size: 16px; line-height: 1.55">{{it.x}}</span></span>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{caseIsEffect}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-start">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<sc-for list="{{caseSliders}}" as="sl" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="{{sl.id}}" style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 600"><span>{{sl.label}}</span><span style="font-family: 'Space Grotesk', sans-serif">{{sl.shown}}</span></label>
<input id="{{sl.id}}" type="range" min="{{sl.min}}" max="{{sl.max}}" step="{{sl.step}}" value="{{sl.value}}" onInput="{{sl.change}}" style="width: 100%; accent-color: #141414">
</div>
</sc-for>
<span style="font-size: 13px; line-height: 1.55; color: #5c5c5c">{{caseNote}}</span>
</div>
<div style="flex: 1.3 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{caseBars}}" as="b" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 600"><span>{{b.label}}</span><span style="font-family: 'Space Grotesk', sans-serif">{{b.value}}</span></span>
<div style="height: 40px; border-radius: 12px; background: #f4f4f4; overflow: hidden"><div style="{{b.style}}"></div></div>
</div>
</sc-for>
<div style="background: #141414; color: #ffffff; border-radius: 18px; padding: 22px 24px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #b8b8b8">{{caseDiffLabel}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 4vw, 48px); font-weight: 700">{{caseDiff}}</span>
</div>
<a href="{{caseCalcHref}}" style="align-self: flex-start; background: #ffffff; color: #141414; border: 2px solid #141414; text-decoration: none; padding: 14px 22px; border-radius: 999px; font-weight: 600; font-size: 15px">Willst du die Berechnung für dich machen? Zum Rechner →</a>
</div>
</div>
</sc-if>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; border-top: 1px solid #e4e4e4; padding-top: 20px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; color: #5c5c5c; max-width: 640px">{{caseQuote}}</span>
<div style="display: flex; gap: 10px">
<button type="button" onClick="{{caseBack}}" style="{{caseBackStyle}}">← Zurück</button>
<button type="button" onClick="{{caseFwd}}" style="{{caseFwdStyle}}">{{caseFwdLabel}}</button>
</div>
</div>
<span style="align-self: flex-start; font-size: 12px; font-weight: 600; border: 1px dashed #5c5c5c; border-radius: 999px; padding: 5px 12px; color: #3d3d3d">Anonymisiert · Zitate nach Freigabe · Darstellung wird anwaltlich geprüft</span>
</div>
</sc-if>
</div>
</section>

<section style="background: #f4f4f4">
<div style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Ehrlich gesagt</span>
<span style="font-size: 12px; font-weight: 600; border: 1px dashed #5c5c5c; border-radius: 999px; padding: 4px 10px; color: #3d3d3d">Zielgruppe offen – mit Heartbeat</span>
</div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 860px">Wann wir gut passen – und wann nicht.</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px">
<div style="background: #ffffff; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Wir passen gut, wenn …</span>
<ul style="margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.8; color: #3d3d3d"><li>du dein Unternehmen selbst führst</li><li>Entscheidungen zu Rechtsform, Gehalt, Investitionen anstehen</li><li>du Zahlen willst, mit denen du steuern kannst</li><li>du willst, dass es umgesetzt wird – nicht nur geplant</li></ul>
</div>
<div style="background: #ffffff; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Wir passen weniger, wenn …</span>
<ul style="margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.8; color: #3d3d3d"><li>du nur eine Steuererklärung oder den Jahresabschluss suchst – das macht dein Steuerberater</li><li>du ein schnelles Steuerspar-Modell von der Stange willst</li><li>du bereits eine eigene Finanzabteilung mit CFO hast</li><li>du Entscheidungen lieber allein und ohne Zahlen triffst</li></ul>
</div>
</div>
</div>
</section>

<section style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; gap: 40px; flex-wrap: wrap">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Typische Kunden</span>
<span style="font-size: 12px; font-weight: 600; border: 1px dashed #5c5c5c; border-radius: 999px; padding: 4px 10px; color: #3d3d3d">Werbesegment offen</span>
</div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(26px, 3vw, 36px); line-height: 1.15">Schnell gewachsen – oft online.</h2>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="border: 1px solid #141414; border-radius: 999px; padding: 10px 16px; font-size: 15px; font-weight: 500">Online-Unternehmer</span>
<span style="border: 1px solid #141414; border-radius: 999px; padding: 10px 16px; font-size: 15px; font-weight: 500">Beratung &amp; Coaching</span>
<span style="border: 1px solid #141414; border-radius: 999px; padding: 10px 16px; font-size: 15px; font-weight: 500">Agenturen</span>
<span style="border: 1px solid #141414; border-radius: 999px; padding: 10px 16px; font-size: 15px; font-weight: 500">Dienstleister</span>
<span style="border: 1px solid #141414; border-radius: 999px; padding: 10px 16px; font-size: 15px; font-weight: 500">Start-ups ab der ersten Finanzierung</span>
</div>
</div>
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Wo</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(26px, 3vw, 36px); line-height: 1.15">Aus Erkelenz – digital für ganz Deutschland.</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3d3d3d">Wir arbeiten komplett digital – mit Zahlen-Cockpit, Video-Calls und kurzen Wegen. Deshalb ist es egal, wo dein Unternehmen sitzt.</p>
</div>
</section>

<section style="background: #f4f4f4">
<div style="max-width: 880px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 24px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Häufige Fragen</span>
<h2 style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 44px); line-height: 1.1">Passt das zu mir?</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{faqs}}" as="f" hint-placeholder-count="4">
<div style="background: #ffffff; border-radius: 14px">

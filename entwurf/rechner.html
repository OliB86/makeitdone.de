<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rechner – make it done (Entwurf)</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Inter;src:url(/fonts/inter-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(/fonts/inter-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Inter;src:url(/fonts/inter-latin-600-normal.woff2) format("woff2");font-weight:600 700;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Instrument Serif";src:url(/fonts/instrument-serif-latin-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}

body{margin:0;background:#ffffff;color:#141414;font-family:Inter,system-ui,sans-serif}
a{color:#141414}a:hover{color:#555555}
button,input,select{font-family:inherit}
input[type=range]{width:100%;accent-color:#141414}
.wcard:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.12)}

html{scroll-behavior:smooth;scroll-padding-top:90px}
@media (max-width:760px){header nav{flex-wrap:nowrap !important;overflow-x:auto;max-width:100%;padding-bottom:4px;-webkit-overflow-scrolling:touch}header nav a{white-space:nowrap}header nav a:last-child{order:-1}}
</style>
</head>
<body>
<template id="tpl">


<div style="width: 100%; background: #ffffff; color: #141414; font-family: Inter, system-ui, sans-serif">
<div style="background: #141414; color: #f2f2f2; font-size: 13px; padding: 10px 24px; text-align: center">Entwurf · Rechner · nicht verlinkt</div>
<header style="position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.96); backdrop-filter: blur(8px); border-bottom: 1px solid #ececec">
<div style="max-width: 1120px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
<a href="index.html" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; text-decoration: none">make it done</a>
<nav aria-label="Hauptmenü" style="display: flex; gap: 20px; flex-wrap: wrap; font-size: 15px; align-items: center">
<a href="leistungen.html" style="text-decoration: none">Leistungen</a>
<a href="warum.html" style="text-decoration: none">Warum make it done</a>
<a href="fuer-wen.html" style="text-decoration: none">Für wen</a>
<a href="so-arbeiten-wir.html" style="text-decoration: none">So arbeiten wir</a>
<a href="rechner.html" style="text-decoration: none; font-weight: 600">Rechner</a>
<a href="ueber-uns.html" style="text-decoration: none">Über uns</a>
<a href="karriere.html" style="text-decoration: none">Karriere</a>
<a href="kontakt.html" style="text-decoration: none">Kontakt</a>
<a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=nav-rechner" style="text-decoration: none; background: #141414; color: #ffffff; padding: 10px 20px; border-radius: 999px; font-weight: 600">Erstgespräch</a>
</nav>
</div>
</header>

<section style="max-width: 1120px; margin: 0 auto; padding: 64px 24px 32px; display: flex; flex-direction: column; gap: 18px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Rechner</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(34px, 5vw, 60px); line-height: 1.05; max-width: 900px">Erst rechnen. Dann entscheiden.</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3d3d3d; max-width: 760px">Welche Frage steht bei dir gerade an? Wähl deine Situation – jeder Rechner zeigt in wenigen Sekunden, was in welcher Struktur bleibt. Anonym, ohne Anmeldung.</p>
</section>

<section style="max-width: 1120px; margin: 0 auto; padding: 0 24px 56px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
<a href="{{c.href}}" class="wcard" style="{{c.style}}">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: .65">{{c.situation}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.15">{{c.title}}</span>
<span style="font-size: 15px; line-height: 1.55; opacity: .85">{{c.text}}</span>
<span style="font-size: 13px; opacity: .7">{{c.praxis}}</span>
<span style="margin-top: auto; font-weight: 600; font-size: 15px">{{c.cta}}</span>
</a>
</sc-for>
</section>

<section style="background: #f4f4f4">
<div style="max-width: 1120px; margin: 0 auto; padding: 56px 24px 72px; display: flex; flex-direction: column; gap: 18px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Bald: Artikel</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(26px, 3.5vw, 38px); line-height: 1.15; max-width: 820px">Unternehmen, Familie und Vermögen zusammen denken.</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3d3d3d; max-width: 760px">Zu diesen Themen folgen Artikel – jeweils mit Praxisbeispiel und dem passenden Rechner.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{topics}}" as="t" hint-placeholder-count="10">
<span style="background: #ffffff; border: 1px solid #d4d4d4; border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 500">{{t}}</span>
</sc-for>
</div>
<a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=wissen" style="align-self: flex-start; margin-top: 12px; background: #141414; color: #ffffff; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 600; font-size: 15px">Deine Situation besprechen →</a>
</div>
</section>
</div>

</template>
<div id="app"></div>
<script src="dc-lite.js?v=1794919299"></script>
<script>

class Component extends DCLogic {
  renderVals() {
    var C = [
      { situation: 'Ich wachse schnell', title: 'Einzelunternehmen, GmbH oder Holding?', text: 'Ab wann sich die GmbH lohnt – und was die Holding obendrauf bringt.', praxis: 'Aus der Praxis: Kunde B', href: 'rechner-rechtsform.html', dark: true },
      { situation: 'Ich verkaufe Anteile', title: 'Exit und Beteiligungen', text: 'Was von Ausschüttungen und Verkaufserlösen privat, in der GmbH oder in der Holding bleibt.', praxis: 'Aus der Praxis: Kunde A', href: 'rechner-holding.html' },
      { situation: 'Ich will mein Team stärken', title: 'Netto vom Brutto', text: 'Benefits statt Gehaltserhöhung: gleiches Budget, deutlich mehr Netto – für Team und Familie.', praxis: 'Kita-Zuschuss, Sachbezug, Gesundheit, Jobticket', href: 'rechner-netto.html' },
      { situation: 'Ich will investieren', title: 'Immobilien privat oder GmbH?', text: 'Vermieten und halten oder Projekte – wo Mieten und Verkauf am wenigsten kosten.', praxis: 'Mit Spekulationsfrist und erweiterter Kürzung', href: 'rechner-immobilien.html' }
    ];
    var cards = C.map(function (c) {
      var base = 'display: flex; flex-direction: column; gap: 12px; min-height: 260px; padding: 28px; border-radius: 24px; text-decoration: none; transition: transform .2s ease, box-shadow .2s ease; ';
      var look = c.soon ? 'background: #ffffff; color: #8a8a8a; border: 1px dashed #c8c8c8; pointer-events: none;' : c.dark ? 'background: #141414; color: #ffffff;' : 'background: #f4f4f4; color: #141414;';
      return { situation: c.situation, title: c.title, text: c.text, praxis: c.praxis, href: c.href || '#', cta: c.soon ? 'Bald verfügbar' : 'Jetzt rechnen →', style: base + look };
    });
    var topics = ['Rechtsform & Holding', 'Familienplanung & Elternzeit', 'Familie im Unternehmen', 'Vermögensplanung', 'Investmentplanung', 'Immobilien & Vermögensverwaltung', 'Exit & Unternehmensverkauf', 'Nachfolge', 'Vergütung & Benefits', 'Liquidität & Steuerrücklagen'];
    return { cards: cards, topics: topics };
  }
}

dcMount(Component, 'tpl', 'app');
</script>
</body>
</html>

<style>
@font-face{font-family:Inter;src:url(/fonts/inter-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}

body{margin:0;background:#ffffff;color:#141414;font-family:Inter,system-ui,sans-serif}
a{color:#141414}a:hover{color:#555555}
button{font-family:inherit}
@keyframes mid-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.mid-in{animation:mid-in .35s ease-out both}
.mk{display:inline-block;background:#F1D734;color:#141414;border-radius:.24em;padding:0 .2em .04em;margin:0 .06em;line-height:1.15;transform:rotate(-2deg);box-shadow:0 .08em 0 #141414}
.flapwrap{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(44px,5vw,76px);line-height:1.05;letter-spacing:-0.03em;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-start;gap:.08em}
.mk-flap{height:1.2em;overflow:hidden;text-align:left;margin-left:-.1em}
.flap-track{display:flex;flex-direction:column}.flap-track>span{height:1.2em;line-height:1.2em}
.fx .flap-track,.flap-track{animation:flap 10s cubic-bezier(.7,0,.2,1) infinite}
@keyframes flap{0%,20%{transform:translateY(0)}25%,45%{transform:translateY(-1.2em)}50%,70%{transform:translateY(-2.4em)}75%,95%{transform:translateY(-3.6em)}100%{transform:translateY(-4.8em)}}

.flap-sub .flap-track{animation-name:flapsub}
@keyframes flapsub{0%,20%{transform:translateY(0)}25%,45%{transform:translateY(-1.5em)}50%,70%{transform:translateY(-3em)}75%,95%{transform:translateY(-4.5em)}100%{transform:translateY(-6em)}}
@media (prefers-reduced-motion: reduce){.flap-track{animation:none !important}}
@media (max-width: 760px){.flapwrap{font-size:clamp(34px,11.5vw,56px)}}
:root{--sp:96px}@media (max-width: 760px){:root{--sp:60px}}
@media (max-width: 860px){.hdr{display:grid !important;grid-template-columns:1fr auto;row-gap:10px !important;padding:12px 18px !important}.hdr-nav{grid-column:1 / -1;grid-row:2;margin-left:0 !important;overflow-x:auto;white-space:nowrap;padding-bottom:4px;-webkit-overflow-scrolling:touch;gap:18px !important}.hdr-cta{grid-column:2;grid-row:1;padding:8px 16px !important;font-size:14px}}

html{scroll-behavior:smooth;scroll-padding-top:90px}
@media (max-width:760px){header nav{flex-wrap:nowrap !important;overflow-x:auto;max-width:100%;padding-bottom:4px;-webkit-overflow-scrolling:touch}header nav a{white-space:nowrap}header nav:not(.hdr-nav) a:last-child{order:-1}}

:root{color-scheme:light}
html,body{overflow-x:clip}
h1,h2,h3{text-wrap:balance}
table,[data-count]{font-variant-numeric:tabular-nums}
section p{max-width:min(100%,70ch)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #F1D734;outline-offset:3px;border-radius:6px}
.fx .rv{opacity:1 !important}
.fx .sy:not(.hz) .sy-step:not(.seen):not(.act){opacity:.45 !important;transform:none !important}
html.show-b #story-a,html:not(.show-b) #story-b{display:none}
.mk{background:linear-gradient(transparent 62%,#F1D734 62%,#F1D734 92%,transparent 92%) !important;border-radius:0 !important;padding:0 .08em !important;margin:0 !important;transform:none !important;box-shadow:none !important;font-family:'Instrument Serif',Georgia,serif !important;font-weight:400 !important;font-style:italic !important;letter-spacing:0 !important}
</style>

<body>
<template id="tpl">


<div style="width: 100%; background: #fafafa; color: #141414; font-family: Inter, system-ui, sans-serif">


<header style="position: sticky; top: 0; z-index: 50; background: #fafafa; border-bottom: 1px solid #ececec">
<div class="hdr" style="max-width: 1180px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px">
<a href="../c/index.html" class="hdr-logo" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; text-decoration: none">make it done</a>
<nav aria-label="Hauptmenü" class="hdr-nav" style="display: flex; gap: 22px; font-size: 15px; align-items: center; margin-left: auto">
<a href="../c/leistungen.html" style="text-decoration: none">Leistungen</a>
<a href="../c/so-arbeiten-wir.html" style="text-decoration: none">So arbeiten wir</a>
<a href="../c/fuer-wen.html" style="text-decoration: none">Für wen</a>
<a href="../c/rechner.html" style="text-decoration: none">Rechner</a>
<a href="../c/ueber-uns.html" style="text-decoration: none; font-weight: 600">Über uns</a>

</nav>
<a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=nav-ueberuns-c" class="hdr-cta" style="text-decoration: none; background: #141414; color: #ffffff; padding: 10px 20px; border-radius: 999px; font-weight: 600; white-space: nowrap">Erstgespräch</a>
</div>
</header>

<section style="max-width: 1180px; margin: 0 auto; padding: var(--sp) 24px; display: flex; flex-direction: column; gap: 28px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ffffff; color: #3d3d3d; box-shadow: 0 2px 10px rgba(0,0,0,.08)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Über uns</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(40px, 6vw, 80px); line-height: 1.0; letter-spacing: -0.02em; max-width: 1000px">Wir machen Dinge <em style="font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: 0; background: linear-gradient(transparent 62%, #F1D734 62%, #F1D734 92%, transparent 92%); padding: 0 .08em">fertig.</em></h1>
<p style="margin: 0; font-size: 20px; line-height: 1.55; color: #3d3d3d; max-width: 780px">make it done ist aus einer einfachen Beobachtung entstanden: Unternehmer haben gute Berater – und trotzdem bleibt das Wichtigste liegen. Weil niemand Zahlen, Struktur und Umsetzung zusammenbringt. Genau das machen wir.</p>
</section>

<section style="background: #141414; color: #f2f2f2">
<div style="max-width: 1180px; margin: 0 auto; padding: var(--sp) 24px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #222222; color: #e8e8e8; border: 1px solid #3a3a3a"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Warum es uns gibt</span>
<span style="font-size: 12px; font-weight: 600; border: 1px dashed #8a8a8a; border-radius: 999px; padding: 4px 10px; color: #d4d4d4">Firmenphilosophie – Entwurf, mit Olga schärfen</span>
</div>
<p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4.4vw, 56px); font-weight: 700; line-height: 1.12; max-width: 1000px">Unternehmer haben gute Berater – und entscheiden trotzdem allein. Wir sitzen mit am Tisch, bevor entschieden wird.</p>
</div>
</section>

<section style="max-width: 1180px; margin: 0 auto; padding: var(--sp) 24px; display: flex; flex-direction: column; gap: 32px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ffffff; color: #3d3d3d; box-shadow: 0 2px 10px rgba(0,0,0,.08)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Woran wir glauben</span>
<div style="display: flex; gap: 48px; flex-wrap: wrap; align-items: flex-start">
<div role="group" aria-label="Überzeugung wählen" style="flex: 1.2 1 460px; min-width: 0; display: flex; flex-direction: column">
<sc-for list="{{beliefs}}" as="v" hint-placeholder-count="3">
<button type="button" onClick="{{v.pick}}" aria-pressed="{{v.on}}" style="{{v.style}}">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; color: {{v.numColor}}; width: 32px; flex-shrink: 0">{{v.num}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(22px, 2.6vw, 32px); font-weight: 700; line-height: 1.2">{{v.title}}</span>
</button>
</sc-for>
</div>
<div class="mid-in" style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 14px; border-left: 3px solid #141414; padding-left: 28px; position: sticky; top: 110px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5c5c5c">Was das für dich heißt</span>
<span style="font-size: 20px; line-height: 1.6">{{beliefText}}</span>
<span style="font-size: 16px; line-height: 1.6; color: #5c5c5c">{{beliefDaily}}</span>
</div>
</div>
</section>

<section>
<div style="max-width: 1180px; margin: 0 auto; padding: var(--sp) 24px; display: flex; flex-direction: column; gap: 36px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ffffff; color: #3d3d3d; box-shadow: 0 2px 10px rgba(0,0,0,.08)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Was wir dir versprechen</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 900px">Wir sind die Vertrauten deines Unternehmens.</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 8px 56px">
<div style="display: flex; gap: 22px; align-items: flex-start; padding: 24px 0; border-top: 1px solid #d4d4d4"><span style="width: 60px; height: 60px; border-radius: 50%; background: #141414; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg></span><span style="display: flex; flex-direction: column; gap: 6px"><b style="font-family: 'Space Grotesk', sans-serif; font-size: 22px">Dauerhaft an deiner Seite</b><span style="font-size: 16px; line-height: 1.6; color: #3d3d3d">Wir sind keine Projektberatung, die nach dem Abschlussbericht geht. Wir bleiben im Unternehmen – wie jemand aus dem eigenen Team.</span></span></div>
<div style="display: flex; gap: 22px; align-items: flex-start; padding: 24px 0; border-top: 1px solid #d4d4d4"><span style="width: 60px; height: 60px; border-radius: 50%; background: #141414; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M3 11l4-4 4 2 3-2 4 1 3 3"></path><path d="M7 7v6l5 5 2-2M14 9l4 4-4 4"></path></svg></span><span style="display: flex; flex-direction: column; gap: 6px"><b style="font-family: 'Space Grotesk', sans-serif; font-size: 22px">Auf Augenhöhe mit allen</b><span style="font-size: 16px; line-height: 1.6; color: #3d3d3d">Wir sprechen die Sprache von Steuerberatern, Wirtschaftsprüfern und Anwälten – und sorgen dafür, dass alle am selben Ziel arbeiten: deinem.</span></span></div>
<div style="display: flex; gap: 22px; align-items: flex-start; padding: 24px 0; border-top: 1px solid #d4d4d4"><span style="width: 60px; height: 60px; border-radius: 50%; background: #141414; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></span><span style="display: flex; flex-direction: column; gap: 6px"><b style="font-family: 'Space Grotesk', sans-serif; font-size: 22px">Ehrlich, auch wenn es unbequem ist</b><span style="font-size: 16px; line-height: 1.6; color: #3d3d3d">Wenn sich etwas nicht lohnt, sagen wir es. Zahlen statt Bauchgefühl, Klartext statt Verkaufsversprechen.</span></span></div>
<div style="display: flex; gap: 22px; align-items: flex-start; padding: 24px 0; border-top: 1px solid #d4d4d4"><span style="width: 60px; height: 60px; border-radius: 50%; background: #141414; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M8.5 12l2.5 2.5 4.5-5"></path></svg></span><span style="display: flex; flex-direction: column; gap: 6px"><b style="font-family: 'Space Grotesk', sans-serif; font-size: 22px">Nur dir verpflichtet</b><span style="font-size: 16px; line-height: 1.6; color: #3d3d3d">Keine Provisionen von deinen Beratern, keine eigenen Produkte im Hintergrund. Wir argumentieren in deinem Interesse.</span></span></div>
</div>
</div>
</section>

<section style="max-width: 1180px; margin: 0 auto; padding: var(--sp) 24px; display: flex; gap: 48px; flex-wrap: wrap; align-items: flex-start">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ffffff; color: #3d3d3d; box-shadow: 0 2px 10px rgba(0,0,0,.08)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Was wir nicht tun</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1">Genauso wichtig: wofür wir nicht stehen.</h2>
</div>
<div style="flex: 1.4 1 460px; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; gap: 18px; align-items: center; padding: 20px 0; border-bottom: 1px solid #e4e4e4"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M9 9l6 6M15 9l-6 6"></path></svg><span style="font-size: 19px; line-height: 1.45"><b>Keine Stunden schreiben.</b> Wir verkaufen Ergebnisse zum Festpreis.</span></div>
<div style="display: flex; gap: 18px; align-items: center; padding: 20px 0; border-bottom: 1px solid #e4e4e4"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M9 9l6 6M15 9l-6 6"></path></svg><span style="font-size: 19px; line-height: 1.45"><b>Keine Konzepte für die Schublade.</b> Wir setzen um, bis es läuft.</span></div>
<div style="display: flex; gap: 18px; align-items: center; padding: 20px 0; border-bottom: 1px solid #e4e4e4"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M9 9l6 6M15 9l-6 6"></path></svg><span style="font-size: 19px; line-height: 1.45"><b>Keine Steuerversprechen.</b> Was niemand seriös versprechen kann, versprechen wir auch nicht.</span></div>
<div style="display: flex; gap: 18px; align-items: center; padding: 20px 0; border-bottom: 1px solid #e4e4e4"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M9 9l6 6M15 9l-6 6"></path></svg><span style="font-size: 19px; line-height: 1.45"><b>Kein Fachchinesisch.</b> Du sollst jede Entscheidung verstehen.</span></div>
</div>
</section>

<section style="max-width: 1180px; margin: 0 auto; padding: var(--sp) 24px; display: flex; gap: 48px; flex-wrap: wrap; align-items: flex-start">
<div style="flex: 0 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<img src="../img/olga-sw.webp" alt="Olga Bertram, Gründerin der make it done GmbH" style="width: 100%; height: auto; display: block">
</div>
<div style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ffffff; color: #3d3d3d; box-shadow: 0 2px 10px rgba(0,0,0,.08)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Die Gründerin</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1">Olga Bertram</h2>
<span style="font-size: 17px; font-weight: 600">Gründerin und Geschäftsführerin der make it done GmbH</span>
<p style="margin: 0; font-size: 18px; line-height: 1.65; color: #3d3d3d">Olga kennt beide Seiten des Tisches: die der Berater aus Wirtschaftsprüfung und Steuerberatung – und die der Geschäftsführung als CFO/COO. Seit 2010 unterrichtet sie Steuern und Rechnungswesen. Heute bringt sie für ihre Kunden zusammen, was sonst nebeneinander herläuft.</p>
<div style="display: flex; flex-direction: column">
<sc-for list="{{stations}}" as="s" hint-placeholder-count="6">
<div style="display: flex; gap: 20px; padding: 16px 0; border-bottom: 1px solid #e4e4e4">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; width: 150px; flex-shrink: 0">{{s.k}}</span>
<span style="font-size: 16px; line-height: 1.5; color: #3d3d3d">{{s.v}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="background: #f4f4f4; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500">Steuern &amp; Wirtschaftsprüfung (Studium)</span>
<span style="background: #f4f4f4; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500">Ausbilderin nach AdA</span>
<span style="background: #f4f4f4; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500">DATEV</span>
<span style="background: #f4f4f4; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500">Finanzierung &amp; Prozesse</span>
</div>
</div>
</section>

<section style="background: #141414; color: #f2f2f2">
<div style="max-width: 1180px; margin: 0 auto; padding: var(--sp) 24px; display: flex; flex-direction: column; gap: 28px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #222222; color: #e8e8e8; border: 1px solid #3a3a3a"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Unser Netzwerk</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 46px); line-height: 1.1; max-width: 860px">Für jede Frage der richtige Profi am Tisch.</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #d4d4d4; max-width: 780px">Wir arbeiten mit einem festen Netzwerk zusammen – auf Wunsch auch mit deinen bestehenden Beratern. Du beauftragst direkt, wir erhalten keine Provision.</p>

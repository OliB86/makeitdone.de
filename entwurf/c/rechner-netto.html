<script>

class Component extends DCLogic {

      { k: 'sach', label: 'Sachbezug, z. B. Gutscheinkarte', law: '§ 8 Abs. 2 S. 11 EStG', m: 50, tax: 'steuer- und abgabenfrei bis 600 € im Jahr (50 € je Monat)' },
      { k: 'kita', label: 'Kita-Zuschuss', law: '§ 3 Nr. 33 EStG · nicht schulpflichtige Kinder', m: st.kita, tax: 'steuer- und abgabenfrei, ohne Obergrenze' },
      { k: 'essen', label: 'Essenszuschuss', law: '§ 8 Abs. 2 S. 6 EStG, § 40 Abs. 2 S. 1 Nr. 1 EStG', m: essenWert, p: essenSBW * 0.25 * SOLI, tax: '15 Tage à 7,67 € im Monat; 25 % pauschal nur auf den Sachbezugswert' },
      { k: 'net', label: 'Internetzuschuss', law: '§ 40 Abs. 2 S. 1 Nr. 5 EStG', m: 50, p: 50 * 0.25 * SOLI, tax: 'bis 600 € im Jahr; 25 % Pauschalsteuer, abgabenfrei' },
      { k: 'ges', label: 'Gesundheitsförderung', law: '§ 3 Nr. 34 EStG', m: 50, tax: 'steuer- und abgabenfrei bis 600 € im Jahr' },
      { k: 'job', label: 'Jobticket', law: '§ 3 Nr. 15 EStG', m: 63, tax: 'steuer- und abgabenfrei' },
      { k: 'rad', label: 'Jobrad', law: '§ 3 Nr. 37 EStG · zusätzlich zum Lohn überlassen', m: st.rad, gm: st.gRad, tax: 'steuer- und abgabenfrei' },
      { k: 'erh', label: 'Erholungsbeihilfe', law: '§ 40 Abs. 2 S. 1 Nr. 3 EStG · Beispiel: verheiratet, 2 Kinder', m: 364 / 12, p: 364 / 12 * 0.25 * SOLI, tax: 'bis 364 € im Jahr, 25 % pauschal, abgabenfrei' },
      { k: 'bav', label: 'Betriebliche Altersvorsorge', law: '§ 3 Nr. 63 EStG · Betriebsausgabe', m: st.bav, gm: st.gBav, bav: true, tax: 'steuerfrei bis 8.112 € im Jahr, im Team abgabenfrei bis 4.056 €; Rente später versteuert' },

    ];
    function calc(who) {
      var sel = who === 'team' ? st.team : st.gf;

      var rate = (who === 'team' ? st.tRate : st.gRate) / 100;
      B.forEach(function (b) {
        if (!sel[b.k]) return;
        if (who === 'team' && b.gfOnly) return;
        var m = (who === 'gf' && b.gm != null) ? b.gm : b.m;

        if (b.k === 'kita') { kitaCost += c; kitaNet += n; } else { cost += c; net += n; }

      if (st.gf[b.k]) { sG += (b.gm != null ? b.gm : b.m) * 12; pG += (b.p || 0) * 12; }
    });
    var rows = B.map(function (b) {
      var tOn = !!st.team[b.k] && !b.gfOnly, gOn = !!st.gf[b.k];
      var yr = function (m) { return eur(m * 12) + (b.p ? ' + ' + eur(b.p * 12) + ' Pauschalsteuer' : ''); };
      var amount = b.gm != null ? 'Team ' + eur(b.m * 12) + '\nGF ' + eur(b.gm * 12) : yr(b.m);
      var monthly = '';
      return { label: b.label, law: b.law, amount: amount, monthly: monthly, tax: b.tax,
        tOn: tOn, gOn: gOn, tDisabled: !!b.gfOnly, gDisabled: false,
        tLabel: b.gfOnly ? 'nur GF' : (tOn ? '✓ Team' : 'Team'), gLabel: gOn ? '✓ GF' : 'GF',
        tStyle: pill + (b.gfOnly ? dis : tOn ? on : off), gStyle: pill + (gOn ? on : off),
        tToggle: function () { if (b.gfOnly) return; var n = Object.assign({}, st.team); n[b.k] = !tOn; self.setState({ team: n }); },
        gToggle: function () { var n = Object.assign({}, st.gf); n[b.k] = !gOn; self.setState({ gf: n }); } };
    });
    function slider(id, label, key, min, max, step, shown, hint) {

    }
    var tSliders = [
      slider('t-staff', 'Mitarbeitende', 'staff', 1, 100, 1, String(st.staff), 'ohne Geschäftsführung'),
      slider('t-kids', 'davon mit Kita-Kind', 'kidsN', 0, 50, 1, String(Math.min(st.kidsN, st.staff)), 'nur sie bekommen den Kita-Zuschuss'),

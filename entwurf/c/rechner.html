<script>

class Component extends DCLogic {
  renderVals() {
    var C = [
      { situation: 'Ich wachse schnell', title: 'Einzelunternehmen, GmbH oder Holding?', text: 'Ab wann sich die GmbH lohnt – und was die Holding obendrauf bringt.', praxis: 'Aus der Praxis: Kunde B', href: '../c/rechner-rechtsform.html', dark: true },
      { situation: 'Ich verkaufe Anteile', title: 'Exit und Beteiligungen', text: 'Was von Ausschüttungen und Verkaufserlösen privat, in der GmbH oder in der Holding bleibt.', praxis: 'Aus der Praxis: Kunde A', href: '../c/rechner-holding.html' },
      { situation: 'Ich will mein Team stärken', title: 'Netto vom Brutto', text: 'Benefits statt Gehaltserhöhung: gleiches Budget, deutlich mehr Netto – für Team und Familie.', praxis: 'Kita-Zuschuss, Sachbezug, Gesundheit, Jobticket', href: '../c/rechner-netto.html' },

    ];
    var cards = C.map(function (c) {
      var base = 'display: flex; flex-direction: column; gap: 12px; min-height: 260px; padding: 28px; border-radius: 24px; text-decoration: none; transition: transform .2s ease, box-shadow .2s ease; ';
      var look = c.soon ? 'background: #ffffff; color: #8a8a8a; border: 1px dashed #c8c8c8; pointer-events: none;' : c.dark ? 'background: #141414; color: #ffffff;' : 'background: #f4f4f4; color: #141414;';
      return { situation: c.situation, title: c.title, text: c.text, praxis: c.praxis, href: c.href || '#', cta: c.soon ? 'Bald verfügbar' : 'Jetzt rechnen →', style: base + look };
    });
    var topics = ['Rechtsform & Holding', 'Familienplanung & Elternzeit', 'Familie im Unternehmen', 'Vermögensplanung', 'Investmentplanung', 'Immobilien & Vermögensverwaltung', 'Exit & Unternehmensverkauf', 'Nachfolge', 'Vergütung & Benefits', 'Liquidität & Steuerrücklagen'];
    return { cards: cards, topics: topics };
  }
}

dcMount(Component, 'tpl', 'app');
</script>

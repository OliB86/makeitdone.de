<h2 class="rv" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 4.6vw, 58px); line-height: 1.05; letter-spacing: -0.02em">Was Unternehmer uns <em style="font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: 0; background: linear-gradient(transparent 62%, #F1D734 62%, #F1D734 92%, transparent 92%); padding: 0 .08em">vorher</em> fragen.</h2>
<div class="faqw" id="faq-k" data-start="5" style="display: flex; flex-direction: column; gap: 22px">
<div role="tablist" aria-label="Rubriken" style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" class="faqw-tab" role="tab" data-r="0">Zusammenarbeit</button><button type="button" class="faqw-tab" role="tab" data-r="1">Kosten</button><button type="button" class="faqw-tab" role="tab" data-r="2">Steuerberater und Netzwerk</button><button type="button" class="faqw-tab" role="tab" data-r="3">Zahlen-Cockpit</button><button type="button" class="faqw-tab" role="tab" data-r="4">Struktur</button><button type="button" class="faqw-tab" role="tab" data-r="5">Erstgespräch</button></div>
<div style="border-top: 1px solid #141414; padding-top: 24px; max-width: 860px"><div class="faqw-q" data-r="0" data-k="0" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Wie läuft die Zusammenarbeit ab?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Nach dem Erstgespräch und einem Strategiegespräch legen wir gemeinsam den Start fest. Im Onboarding planen wir, was beruflich und privat ansteht. In 90 Tagen steht dein Fundament: Zielbild, Struktur-Fahrplan und, wenn du willst, das Zahlen-Cockpit.</span>
<a href="../c/so-arbeiten-wir.html#ablauf" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Weg →</a></div><div class="faqw-q" data-r="0" data-k="1" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Wie geht es nach den 90 Tagen weiter?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Dann beginnen die Entscheidungen, für die das Fundament gebaut ist. Mindestens einmal im Monat sprechen wir über die Entwicklung und alles, was ansteht, und fragen Gestaltungsmöglichkeiten vorab ab. Alles, was in den 90 Tagen entsteht, gehört dir.</span>
<a href="../c/leistungen.html#ablauf" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zur Phase Steuerung →</a></div><div class="faqw-q" data-r="0" data-k="2" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Was bedeutet die Ergebnisgarantie?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Was nach 90 Tagen stehen soll, legen wir vorher fest. [Garantiefall und Frist in Abstimmung.]</span>
<a href="../c/leistungen.html#garantie" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zur Ergebnisgarantie →</a></div><div class="faqw-q" data-r="0" data-k="3" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Für welche Unternehmen seid ihr da?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Für Unternehmer, die mit Wissen, Reichweite oder Vertrauen verdienen: Personenmarken, Berater, Agenturen, Vermittler, Menschen im Vermögensaufbau und Gründer mit Plan. Andere Bereiche gern auf Anfrage.</span>
<a href="../c/fuer-wen.html" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zu Für wen →</a></div><div class="faqw-q" data-r="0" data-k="4" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Bin ich dafür nicht zu klein?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Gerade auf dem Weg vom Einzelunternehmen zur GmbH werden die Weichen gestellt. Später umzubauen ist aufwendiger und teurer.</span>
<a href="../c/fuer-wen.html" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zu Für wen →</a></div><div class="faqw-q" data-r="0" data-k="5" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Ich habe keine Zeit für noch ein Projekt.</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Genau dafür heißt es „done“: Wir übernehmen Vorarbeit, Abstimmung und Umsetzung. Du entscheidest.</span>
<a href="../c/leistungen.html#baustein-0" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zu den Bausteinen →</a></div><div class="faqw-q" data-r="1" data-k="0" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Was kostet das?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Du zahlst für Ergebnisse, nicht für Stunden. Was am Ende stehen soll, legen wir vorher fest, zu einem Festpreis. Den Rahmen besprechen wir im Strategiegespräch.</span>
<a href="../c/leistungen.html#preis" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Preis →</a></div><div class="faqw-q" data-r="1" data-k="1" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Wer bezahlt Steuerberater, Anwalt und Notar?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Du beauftragst und bezahlst sie direkt. Wir erhalten keine Provision und können deshalb frei in deinem Interesse argumentieren.</span>
<a href="../c/leistungen.html#netzwerk" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Netzwerk →</a></div><div class="faqw-q" data-r="2" data-k="0" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Ersetzt ihr meinen Steuerberater?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Nein. Er bleibt für Erklärungen und Abschluss zuständig und wird besser eingebunden. Er würdigt steuerlich, wir bereiten vor, rechnen, koordinieren und setzen um.</span>
<a href="../c/so-arbeiten-wir.html#wer-bewertet" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zur Grafik „Wer bewertet was“ →</a></div><div class="faqw-q" data-r="2" data-k="1" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Reicht mein Steuerberater dafür nicht aus?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Dein Steuerberater sieht dein Unternehmen meist im Rückblick. Entscheidungen fallen aber vorher. Wir sind dazwischen dauerhaft dabei, damit er auf einer sauberen Grundlage bewerten kann.</span>
<a href="../c/so-arbeiten-wir.html#wer-bewertet" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zur Grafik „Wer bewertet was“ →</a></div><div class="faqw-q" data-r="2" data-k="2" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Kann ich mit meinem eigenen Steuerberater und Anwalt weiterarbeiten?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Ja. Wir stimmen uns mit deinen Beratern ab. Wenn dir für ein Thema jemand fehlt, bringen wir Fachleute aus unserem Netzwerk dazu.</span>
<a href="../c/leistungen.html#netzwerk" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Netzwerk →</a></div><div class="faqw-q" data-r="2" data-k="3" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Beratet ihr steuerlich?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Die steuerliche und rechtliche Würdigung im Einzelfall übernehmen Steuerberater und Rechtsanwälte, die du direkt beauftragst. In unserem Know-how stecken Dozenten für Steuerrecht und Rechnungswesen und Erfahrung aus Wirtschaftsprüfung und Steuerberatung. Deshalb bereiten wir auf Seite deines Unternehmens alles vor, was für eine saubere Würdigung nötig ist: Sachverhalt, Varianten, Zahlen.</span>
<a href="../c/so-arbeiten-wir.html#vergleich" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Vergleich →</a></div><div class="faqw-q" data-r="2" data-k="4" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Ich habe schon einen CFO. Brauche ich euch dann?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Ein CFO sorgt für die Zahlen im Unternehmen. Wir gehen weiter: Rechtsform, Holding, Nachfolge, deine persönlichen Ziele und die Abstimmung mit Steuerberater, Anwalt und Notar. Dein CFO kann die Zahlen gern behalten.</span>
<a href="../c/so-arbeiten-wir.html#vergleich" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Vergleich →</a></div><div class="faqw-q" data-r="2" data-k="5" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Und warum nicht eine Strukturberatung?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Strukturkonzepte brauchen eine aktuelle Zahlenbasis. Fehlt sie, dauern Entscheidungen, und die Umsetzung bleibt hängen. Wir bringen beides zusammen.</span>
<a href="../c/so-arbeiten-wir.html#vergleich" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Vergleich →</a></div><div class="faqw-q" data-r="3" data-k="0" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Muss ich das Zahlen-Cockpit buchen?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Buchen musst du es nicht. Ob du es brauchst, ist eine andere Frage: Es liefert aktuelle Zahlen und damit die Grundlage für deine Entscheidungen. Ohne Cockpit schauen wir gemeinsam auf langfristige Planung und Struktur.</span>
<a href="../c/leistungen.html#cockpit" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Zahlen-Cockpit →</a></div><div class="faqw-q" data-r="3" data-k="1" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Was ist das Zahlen-Cockpit?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Deine Belege und Konten fließen automatisch zusammen, gegliedert nach deinen KPIs. Daraus entstehen Umsatz, Kosten, Cashflow und Liquidität, aktuell statt Wochen später. Eine parallele Kosten- und Leistungsrechnung brauchst du nicht: Alles lässt sich direkt aus den Zahlen ermitteln.</span>
<a href="../c/leistungen.html#cockpit" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Zahlen-Cockpit →</a></div><div class="faqw-q" data-r="3" data-k="2" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Was heißt Kontenplan nach deinen KPIs?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Wir gliedern deine Konten im Rahmen des DATEV-Kontenrahmens nach deinem Geschäft. So lesen sich Marge, Deckungsbeitrag und Liquidität direkt ab, ohne parallele Kosten- und Leistungsrechnung. Bilanz und GuV bleiben wie gesetzlich vorgeschrieben.</span>
<a href="../c/leistungen.html#kontenplan" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Kontenplan →</a></div><div class="faqw-q" data-r="3" data-k="3" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Wer erledigt die Umsatzsteuer-Voranmeldung?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Entweder erstellst und übermittelst du sie selbst, etwa per Knopfdruck aus deinem Buchhaltungsprogramm, oder dein Steuerberater übernimmt sie.</span>
<a href="../c/leistungen.html#cockpit" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Zahlen-Cockpit →</a></div><div class="faqw-q" data-r="4" data-k="0" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Wann lohnt sich eine GmbH?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Das hängt von Gewinn, Gehalt und davon ab, wie viel im Unternehmen bleibt. Der Vorteil entsteht vor allem, solange Gewinne in der GmbH bleiben. Rechne eine Beispielrechnung, die Würdigung im Einzelfall übernimmt dein Steuerberater.</span>
<a href="../c/rechner-rechtsform.html" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Rechtsform-Rechner →</a></div><div class="faqw-q" data-r="4" data-k="1" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Was bringt eine Holding?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Eine Holding trennt das operative Geschäft von dem, was bleiben soll. Gewinne und Verkaufserlöse lassen sich so im Unternehmensverbund halten und reinvestieren.</span>
<a href="../c/so-arbeiten-wir.html#kunde-a-0" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zur Geschichte von Kunde A →</a></div><div class="faqw-q" data-r="4" data-k="2" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Wie früh sollte ich einen Exit vorbereiten?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Möglichst früh. Manche Strukturen brauchen Zeit, bevor ein Verkauf ansteht, und Käufer wollen saubere Zahlen sehen.</span>
<a href="../c/rechner-holding.html" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Exit-Rechner →</a></div><div class="faqw-q" data-r="4" data-k="3" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Wie kommt bei meinem Team mehr Netto vom Brutto an?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Mit Benefits und Sachbezügen, die anders behandelt werden als eine Gehaltserhöhung. Welche passen, prüfen wir gemeinsam mit deinem Steuerberater.</span>
<a href="../c/rechner-netto.html" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Netto-Rechner →</a></div><div class="faqw-q" data-r="4" data-k="4" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Sollte ich privat oder über eine GmbH investieren?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Das hängt davon ab, was du investierst und wofür du das Geld später brauchst. Wir rechnen beide Wege für dich durch.</span>
<a href="../c/rechner-immobilien.html" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Immobilien-Rechner →</a></div><div class="faqw-q" data-r="5" data-k="0" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Was passiert im Erstgespräch?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Wir lernen uns kennen und schauen gemeinsam, ob wir zusammenpassen und wie wir dir helfen können.</span>
<a href="../c/kontakt.html" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Kontakt →</a></div><div class="faqw-q" data-r="5" data-k="1" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Wie finden die Gespräche statt?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Online, per Video oder Telefon. So geht es schnell, egal wo du sitzt.</span>
<a href="../c/kontakt.html" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Kontakt →</a></div><div class="faqw-q" data-r="5" data-k="2" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Muss ich Unterlagen vorbereiten?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Nein. Ein paar Eckdaten helfen, sind aber kein Muss. Unterlagen brauchen wir erst in der Unternehmensanalyse.</span>
<a href="../c/kontakt.html" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Kontakt →</a></div><div class="faqw-q" data-r="5" data-k="3" style="flex-direction: column; gap: 12px; min-height: 190px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Sollte mein Steuerberater dabei sein?</span>
<span style="font-size: 17px; line-height: 1.65; color: #3d3d3d">Für das Erstgespräch nicht nötig. Später binden wir ihn gern ein.</span>
<a href="../c/kontakt.html" style="font-weight: 600; font-size: 15px; color: #141414">Mehr dazu: Zum Kontakt →</a></div></div>

<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(34px, 5vw, 56px); line-height: 1.05; max-width: 900px">Immobilien privat oder in der GmbH?</h1>
<p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(19px, 2.2vw, 24px); font-weight: 500; line-height: 1.3; color: #141414; max-width: 900px">Vermieten oder Projekte – privat, Immobilien-GmbH oder unter der Holding. Rechne selbst.</p>
<p class="kurzantwort" style="margin: 0; font-size: 18px; line-height: 1.6; color: #141414; max-width: 820px; border-left: 3px solid #F1D734; padding: 4px 0 4px 18px"><b>Kurz gesagt:</b> Privat zahlst du auf Mieten deinen persönlichen Steuersatz, ein Verkauf nach zehn Jahren ist aber steuerfrei. In einer vermögensverwaltenden GmbH mit erweiterter Kürzung kosten Mieten nur rund 15,8 %, Verkäufe sind dafür immer steuerpflichtig. Wer Mieten langfristig reinvestiert, fährt oft mit der GmbH besser, wer bald verkaufen will, oft privat.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3d3d3d; max-width: 780px">Privat ist der Verkauf nach zehn Jahren steuerfrei – dafür kosten die Mieten deinen persönlichen Steuersatz. In der GmbH ist es umgekehrt. Welche Seite gewinnt, hängt von Haltedauer, Mieten und Plänen ab.</p>

<div style="overflow-x: auto"><table style="min-width: 660px; width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.45; border: 1px solid #dddddd"><thead><tr><th scope="col" style="text-align: left; padding: 12px 14px; font-family: 'Space Grotesk', sans-serif; background: #f4f4f4"></th><th scope="col" style="text-align: left; padding: 12px 14px; font-family: 'Space Grotesk', sans-serif; background: #f4f4f4">Privat</th><th scope="col" style="text-align: left; padding: 12px 14px; font-family: 'Space Grotesk', sans-serif; background: #f4f4f4">Immobilien-GmbH</th><th scope="col" style="text-align: left; padding: 12px 14px; font-family: 'Space Grotesk', sans-serif; background: #f4f4f4">GmbH unter Holding</th></tr></thead><tbody><tr><th scope="row" style="text-align: left; padding: 12px 14px; border-top: 1px solid #e4e4e4; font-weight: 600">Steuer auf Mieten</th><td style="padding: 12px 14px; border-top: 1px solid #e4e4e4">persönlicher Satz, bis rund 47,5 %</td><td style="padding: 12px 14px; border-top: 1px solid #e4e4e4">rund 15,8 % mit erweiterter Kürzung</td><td style="padding: 12px 14px; border-top: 1px solid #e4e4e4">rund 15,8 % mit erweiterter Kürzung</td></tr><tr><th scope="row" style="text-align: left; padding: 12px 14px; border-top: 1px solid #e4e4e4; font-weight: 600">Verkauf der Immobilie</th><td style="padding: 12px 14px; border-top: 1px solid #e4e4e4">nach 10 Jahren steuerfrei</td><td style="padding: 12px 14px; border-top: 1px solid #e4e4e4">immer steuerpflichtig</td><td style="padding: 12px 14px; border-top: 1px solid #e4e4e4">immer steuerpflichtig</td></tr><tr><th scope="row" style="text-align: left; padding: 12px 14px; border-top: 1px solid #e4e4e4; font-weight: 600">Verkauf der Gesellschaft</th><td style="padding: 12px 14px; border-top: 1px solid #e4e4e4">–</td><td style="padding: 12px 14px; border-top: 1px solid #e4e4e4">Anteile privat: 60 % steuerpflichtig</td><td style="padding: 12px 14px; border-top: 1px solid #e4e4e4">Anteile in der Holding: 95 % steuerfrei</td></tr><tr><th scope="row" style="text-align: left; padding: 12px 14px; border-top: 1px solid #e4e4e4; font-weight: 600">Geld privat nutzen</th><td style="padding: 12px 14px; border-top: 1px solid #e4e4e4">frei</td><td style="padding: 12px 14px; border-top: 1px solid #e4e4e4">Ausschüttung: 25 % plus Soli</td><td style="padding: 12px 14px; border-top: 1px solid #e4e4e4">Ausschüttung: 25 % plus Soli</td></tr><tr><th scope="row" style="text-align: left; padding: 12px 14px; border-top: 1px solid #e4e4e4; font-weight: 600">Projekte und Handel</th><td style="padding: 12px 14px; border-top: 1px solid #e4e4e4">ab drei Objekten in fünf Jahren oft gewerblich</td><td style="padding: 12px 14px; border-top: 1px solid #e4e4e4">keine erweiterte Kürzung, rund 30 %</td><td style="padding: 12px 14px; border-top: 1px solid #e4e4e4">keine erweiterte Kürzung, rund 30 %</td></tr></tbody></table></div>
<p style="margin: 0; font-size: 12px; color: #5c5c5c">Rechtsgrundlagen: § 23 EStG, § 9 Nr. 1 Satz 2 GewStG, § 8b KStG, § 17 EStG. Sätze gerundet, ohne Kirchensteuer.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #5c5c5c">Von <a href="../c/ueber-uns.html">Olga Bertram</a>, Gründerin der make it done GmbH und seit 2010 Dozentin für Steuerrecht und Rechnungswesen · Stand: November 2026 · Vereinfachte Darstellung, keine Beratung im Einzelfall.</p>

<div style="border-top: 1px solid #141414; padding-top: 24px; max-width: 860px"><div class="faqw-q" data-r="0" data-k="0" style="flex-direction: column; gap: 12px; min-height: 190px">
<h3 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Was sind die Vorteile einer Immobilien-GmbH?</h3>
<p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d">Greift die erweiterte Kürzung, werden Mieteinnahmen mit rund 15,8 % besteuert statt mit deinem persönlichen Steuersatz. Das Geld bleibt zum Reinvestieren in der GmbH. Nachteile: Verkäufe sind nie steuerfrei, und Geld privat zu entnehmen kostet erneut Steuern.</p></div><div class="faqw-q" data-r="0" data-k="1" style="flex-direction: column; gap: 12px; min-height: 190px">
<h3 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Was ist die erweiterte Kürzung?</h3>
<p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d">Eine GmbH, die ausschließlich eigenen Grundbesitz verwaltet, kann sich von der Gewerbesteuer befreien lassen (§ 9 Nr. 1 Satz 2 GewStG). Die Voraussetzungen sind streng: Schon kleine Nebentätigkeiten können sie kippen.</p></div><div class="faqw-q" data-r="0" data-k="2" style="flex-direction: column; gap: 12px; min-height: 190px">
<h3 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">Kann ich eine Immobilie in meine GmbH einbringen?</h3>
<p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d">Ja, steuerlich gilt das aber meist als Verkauf: Innerhalb der Spekulationsfrist von zehn Jahren kann Einkommensteuer anfallen, Grunderwerbsteuer kommt in der Regel dazu. Deshalb vorher rechnen.</p></div></div>

<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { art: 'miete', mode: 'keep', miete: 40000, jahre: 12, verkauf: 400000, rate: 44, hebe: 400, start: 2026 };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    function eur(n) { return Math.round(n).toLocaleString('de-DE') + ' €'; }
    function kstR(y) { return y <= 2027 ? 0.15 : Math.max(0.10, 0.15 - 0.01 * (y - 2027)); }
    function pc(x) { return Math.round(x * 100) + ' %'; }
    var n = st.jahre, sumK = 0; for (var yy = 0; yy < n; yy++) sumK += kstR(st.start + yy);
    var KL = sumK / n * 1.055, KV = kstR(st.start + n - 1) * 1.055, K = KV, gw = 0.035 * st.hebe / 100;
    var r = st.rate / 100, L = st.miete * n, V = st.verkauf;
    var proj = st.art === 'projekt', out = st.mode === 'out';
    var pL, pV, gRate;
    if (proj) {
      var extra = 0.035 * Math.max(0, st.hebe - 400) / 100;
      pL = L * (r + extra); pV = V * (r + extra); gRate = K + gw; var gRateL = KL + gw;
    } else {
      pL = L * r; pV = n >= 10 ? 0 : V * r; gRate = K; var gRateL = KL;
    }
    var gL = L * gRateL, gV = V * gRate, gAfter = L + V - gL - gV;
    var hr = 0.05 * (K + gw);
    var toHold = gAfter * hr, inHold = gAfter - toHold;
    var abgG = out ? gAfter * 0.25 * 1.055 : 0, abgH = out ? inHold * 0.25 * 1.055 : 0;
    var tP = pL + pV, tG = gL + gV + abgG, tH = gL + gV + toHold + abgH;
    var base = 'padding: 14px 16px; font-size: 14px; border-top: 1px solid #e4e4e4;';
    function row(label, p, g, h, bold) {
      var fw = bold ? ' font-weight: 700;' : '';
      return { label: label, p: p, g: g, h: h, ls: base + ' font-weight: 600;', cs: base + fw, ks: base + ' background: #f7f7f7;' + fw };
    }
    var total = L + V;
    var rows = [
      row('Steuer auf die Überschüsse (' + n + ' Jahre)', eur(pL), eur(gL), eur(gL)),
      row('Steuer auf den Verkauf', (!proj && n >= 10) ? '0 € · nach 10 Jahren steuerfrei' : eur(pV), eur(gV), eur(gV)),
      row('Steuer auf dem Weg in die Holding', '–', '–', eur(toHold)),
      row('Abgeltungsteuer bei Ausschüttung', '–', out ? eur(abgG) : '–', out ? eur(abgH) : '–'),
      row('Steuern gesamt', eur(tP), eur(tG), eur(tH), true),
      row('Steuerquote', (tP / total * 100).toFixed(1).replace('.', ',') + ' %', (tG / total * 100).toFixed(1).replace('.', ',') + ' %', (tH / total * 100).toFixed(1).replace('.', ',') + ' %', true)
    ];
    var av = [['Privat', total - tP, 'privat'], ['Immobilien-GmbH', total - tG, out ? 'privat' : 'in der GmbH'], ['GmbH unter Holding', total - tH, out ? 'privat' : 'in der Holding']];
    var max = Math.max(av[0][1], av[1][1], av[2][1], 1);
    var bars = av.map(function (b, i) {
      var w = Math.max(4, b[1] / max * 100);
      return { label: b[0], value: eur(b[1]) + ' · ' + b[2], textColor: i === 2 ? '#ffffff' : '#141414',
        style: 'position: absolute; left: 0; top: 0; bottom: 0; width: ' + w.toFixed(1) + '%; border-radius: 999px; transition: width .4s ease; background: ' + (i === 2 ? '#141414' : i === 1 ? '#8a8a8a' : '#c8c8c8') };
    });
    var btn = function (on) { return 'border: 1px solid #141414; border-radius: 999px; padding: 10px 14px; font-size: 13px; cursor: pointer; min-height: 40px; ' + (on ? 'background: #141414; color: #ffffff; font-weight: 600;' : 'background: #ffffff; color: #141414; font-weight: 500;'); };
    function group(label, key, opts) {
      return { label: label, opts: opts.map(function (o) { var on = st[key] === o[0]; return { label: o[1], on: on, style: btn(on), pick: function () { var x = {}; x[key] = o[0]; self.setState(x); } }; }) };
    }
    var groups = [
      group('Was hast du vor?', 'art', [['miete', 'Vermieten und halten'], ['projekt', 'Projekte: bauen, sanieren, verkaufen']]),
      group('Gewinne der GmbH', 'mode', [['keep', 'werden reinvestiert'], ['out', 'werden privat ausgeschüttet']])
    ];
    function slider(id, label, key, min, max, step, shown, hint) {
      return { id: id, label: label, min: min, max: max, step: step, value: st[key], shown: shown, hint: hint,
        change: function (e) { var o = {}; o[key] = Number(e.target.value); self.setState(o); } };
    }
    var sliders = [
      slider('i-start', 'Startjahr', 'start', 2026, 2032, 1, st.start + ' · Körperschaftsteuer ' + pc(kstR(st.start)), 'Körperschaftsteuer sinkt ab 2028 jedes Jahr um einen Prozentpunkt bis 10 % ab 2032 – je Jahr der Haltedauer eingerechnet'),
      slider('i-miete', 'Überschuss pro Jahr', 'miete', 0, 300000, 5000, eur(st.miete), 'Mieten minus Zinsen, Kosten und Abschreibung'),
      slider('i-jahre', 'Haltedauer', 'jahre', 1, 30, 1, n + ' Jahre', proj ? 'bei Projekten meist kurz' : 'privat ab 10 Jahren steuerfreier Verkauf'),
      slider('i-verkauf', 'Gewinn beim Verkauf', 'verkauf', 0, 3000000, 25000, eur(V), 'Verkaufspreis minus Buchwert'),
      slider('i-rate', 'Dein persönlicher Steuersatz', 'rate', 14, 48, 1, st.rate + ' %', 'Grenzsteuersatz, Soli eingerechnet'),
      slider('i-hebe', 'Gewerbesteuer-Hebesatz', 'hebe', 280, 900, 5, st.hebe + ' %', 'je nach Gemeinde, ab 2027 mindestens 280 %')
    ];
    var notes = proj ? [
      { t: 'Projekte privat:', x: 'Wer innerhalb von fünf Jahren mehr als drei Objekte verkauft, wird schnell zum gewerblichen Grundstückshändler – mit Gewerbesteuer und ohne steuerfreien Verkauf.' },
      { t: 'Projekte in der GmbH:', x: 'Keine erweiterte Kürzung, dafür klare Trennung vom Bestand und von deinem Privatvermögen.' },
      { t: 'Unter der Holding:', x: 'Gewinne fließen für rund 1,5 % in die Holding und stehen dort für das nächste Projekt bereit.' }
    ] : [
      { t: 'Privat:', x: 'Mieten kosten deinen persönlichen Steuersatz. Nach zehn Jahren ist der Verkauf steuerfrei.' },
      { t: 'Immobilien-GmbH:', x: 'Bei reiner Vermietung fällt dank erweiterter Kürzung keine Gewerbesteuer an – bis 2027 rund 15,8 %, ab 2032 rund 10,6 % auf Mieten und Verkauf. Mehr Geld für Tilgung und nächste Objekte.' },
      { t: 'Unter der Holding:', x: 'Gewinne lassen sich für rund 1,5 % in die Holding holen und dort in neue Projekte oder Beteiligungen stecken.' }
    ];
    return { groups: groups, sliders: sliders, rows: rows, bars: bars, notes: notes,
      barTitle: out ? 'Nach Steuern bei dir privat' : 'Nach Steuern verfügbar für das nächste Objekt' };
  }
}

dcMount(Component, 'tpl', 'app');
</script>

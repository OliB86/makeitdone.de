<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Karriere – make it done (Entwurf)</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Inter;src:url(/fonts/inter-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(/fonts/inter-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Inter;src:url(/fonts/inter-latin-600-normal.woff2) format("woff2");font-weight:600 700;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Instrument Serif";src:url(/fonts/instrument-serif-latin-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}

body{margin:0;background:#ffffff;color:#141414;font-family:Inter,system-ui,sans-serif}
a{color:#141414}a:hover{color:#555555}
button,input,textarea{font-family:inherit}
@keyframes mid-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mid-in{animation:mid-in .35s ease-out both}
.mid-bar{transition:width .4s ease}
@media (prefers-reduced-motion: reduce){.mid-in,.mid-bar{animation:none;transition:none}}

html{scroll-behavior:smooth;scroll-padding-top:90px}
@media (max-width:760px){header nav{flex-wrap:nowrap !important;overflow-x:auto;max-width:100%;padding-bottom:4px;-webkit-overflow-scrolling:touch}header nav a{white-space:nowrap}header nav a:last-child{order:-1}}
</style>
</head>
<body>
<template id="tpl">


<div style="width: 100%; background: #ffffff; color: #141414; font-family: Inter, system-ui, sans-serif">

<div style="background: #141414; color: #f2f2f2; font-size: 13px; padding: 10px 24px; text-align: center; letter-spacing: 0.02em">Entwurf · nicht verlinkt · Benefits und Fragen gemeinsam schärfen</div>

<header style="position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.96); backdrop-filter: blur(8px); border-bottom: 1px solid #ececec">
<div style="max-width: 1120px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
<a href="index.html" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; text-decoration: none">make it done</a>
<nav aria-label="Hauptmenü" style="display: flex; gap: 20px; flex-wrap: wrap; font-size: 15px; align-items: center">
<a href="leistungen.html" style="text-decoration: none">Leistungen</a>
<a href="warum.html" style="text-decoration: none">Warum make it done</a>
<a href="fuer-wen.html" style="text-decoration: none">Für wen</a>
<a href="so-arbeiten-wir.html" style="text-decoration: none">So arbeiten wir</a>
<a href="rechner.html" style="text-decoration: none">Rechner</a>
<a href="ueber-uns.html" style="text-decoration: none">Über uns</a>
<a href="karriere.html" style="text-decoration: none; font-weight: 600">Karriere</a>
<a href="kontakt.html" style="text-decoration: none">Kontakt</a>
<a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=nav-karriere" style="text-decoration: none; background: #141414; color: #ffffff; padding: 10px 20px; border-radius: 999px; font-weight: 600">Erstgespräch</a>
</nav>
</div>
</header>

<section style="max-width: 1120px; margin: 0 auto; padding: 64px 24px 72px; display: flex; flex-direction: column; gap: 28px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Karriere</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(40px, 6vw, 80px); line-height: 1.0; letter-spacing: -0.02em; max-width: 1000px">Wir bauen auf deinen Stärken auf – nicht auf deinem Lebenslauf.</h1>
<p style="margin: 0; font-size: 20px; line-height: 1.55; color: #3d3d3d; max-width: 780px">Kein Anschreiben, keine Zeugnisse. Wir sind kein klassisches Unternehmen – also stellen wir auch nicht klassisch ein. Uns interessiert, was du kannst und wie du tickst, nicht wie dein Lebenslauf aussieht. Bewirb dich in zehn Minuten: ein paar Klicks und ein kurzes Video.</p>
<div style="display: flex; gap: 16px; flex-wrap: wrap">
<a href="#check" style="background: #141414; color: #ffffff; text-decoration: none; padding: 16px 28px; border-radius: 999px; font-weight: 600; font-size: 16px">Jetzt bewerben ↓</a>
<a href="#stellen" style="padding: 16px 8px; font-weight: 500; font-size: 16px; color: #3d3d3d">Offene Stellen ansehen</a>
</div>
</section>

<section style="background: #141414; color: #f2f2f2">
<div style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 28px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #b8b8b8">Warum wir anders einstellen</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 880px">Wir fördern Stärken. Darum fragen wir nach ihnen.</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
<div style="background: #1f1f1f; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Stärken statt Lücken</span><span style="font-size: 15px; line-height: 1.5; color: #d4d4d4">Niemand kann alles. Wir bauen Aufgaben um das, was du richtig gut kannst.</span></div>
<div style="background: #1f1f1f; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Mut statt Papier</span><span style="font-size: 15px; line-height: 1.5; color: #d4d4d4">Zeugnisse sagen wenig. Ein Video, in dem du zeigst, wer du bist, sagt viel.</span></div>
<div style="background: #1f1f1f; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Machen statt reden</span><span style="font-size: 15px; line-height: 1.5; color: #d4d4d4">Wir heißen make it done. Wer gern Dinge fertig macht, ist bei uns richtig.</span></div>
<div style="background: #1f1f1f; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Schnell statt Warteschleife</span><span style="font-size: 15px; line-height: 1.5; color: #d4d4d4">Kurzer Prozess, klare Rückmeldung – versprochen.</span></div>
</div>
</div>
</section>

<section style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 28px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Was wir von dir erwarten</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 860px">Wir geben viel Freiheit. Dafür erwarten wir einiges.</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
<div style="border: 1px solid #dddddd; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Klar und direkt</span><span style="font-size: 15px; line-height: 1.5; color: #3d3d3d">Du sagst, was du denkst – freundlich, ehrlich und ohne Umwege. Und du hörst genauso gut zu.</span></div>
<div style="border: 1px solid #dddddd; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Fehler offen ansprechen</span><span style="font-size: 15px; line-height: 1.5; color: #3d3d3d">Fehler passieren. Wir reden darüber, lernen daraus und machen weiter. Verstecken ist das Einzige, was nicht geht.</span></div>
<div style="border: 1px solid #dddddd; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Selbstständig arbeiten</span><span style="font-size: 15px; line-height: 1.5; color: #3d3d3d">Du übernimmst Verantwortung für deine Themen und wartest nicht auf die nächste Anweisung.</span></div>
<div style="border: 1px solid #dddddd; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Dinge bewegen wollen</span><span style="font-size: 15px; line-height: 1.5; color: #3d3d3d">Du bringst Ideen ein, packst an und bleibst dran, bis es läuft. Lösungen statt Ausreden.</span></div>
</div>
<div style="background: #f4f4f4; border-radius: 20px; padding: 32px 36px; display: flex; flex-direction: column; gap: 14px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Ehrlich gesagt: Wir passen nicht zu dir, wenn …</span>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px 24px">
<span style="display: flex; gap: 10px; font-size: 16px; line-height: 1.5"><span aria-hidden="true" style="font-weight: 700">✕</span>du acht Stunden am Tag einfach absitzen willst</span>
<span style="display: flex; gap: 10px; font-size: 16px; line-height: 1.5"><span aria-hidden="true" style="font-weight: 700">✕</span>du lieber allein arbeitest als im Team</span>
<span style="display: flex; gap: 10px; font-size: 16px; line-height: 1.5"><span aria-hidden="true" style="font-weight: 700">✕</span>du Probleme lieber meldest als löst</span>
<span style="display: flex; gap: 10px; font-size: 16px; line-height: 1.5"><span aria-hidden="true" style="font-weight: 700">✕</span>du mit New Work, Remote und flexiblen Strukturen nichts anfangen kannst</span>
<span style="display: flex; gap: 10px; font-size: 16px; line-height: 1.5"><span aria-hidden="true" style="font-weight: 700">✕</span>dich KI und neue Tools eher abschrecken als neugierig machen</span>
</div>
<span style="font-size: 15px; color: #3d3d3d">Wenn du dich in keinem Punkt wiederfindest: Dann freuen wir uns auf dich.</span>
</div>
</section>

<section id="stellen" style="max-width: 1120px; margin: 0 auto; padding: 0 24px 88px; display: flex; flex-direction: column; gap: 24px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Offene Stellen</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1">Wen wir suchen.</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3d3d3d; max-width: 780px">Alle Stellen: remote oder in unserem Headquarter in Erkelenz – wie es für dich am besten passt.</p>
<div role="group" aria-label="Bereich filtern" style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{filters}}" as="fi" hint-placeholder-count="4">
<button type="button" onClick="{{fi.pick}}" aria-pressed="{{fi.on}}" style="{{fi.style}}">{{fi.label}}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{jobs}}" as="j" hint-placeholder-count="4">
<div style="{{j.boxStyle}}">
<button type="button" onClick="{{j.toggle}}" aria-expanded="{{j.open}}" style="width: 100%; background: transparent; border: 0; padding: 28px 32px; display: flex; justify-content: space-between; align-items: center; gap: 20px; text-align: left; cursor: pointer; color: inherit; min-height: 44px; flex-wrap: wrap">
<span style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">{{j.title}}</span>
<span style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{j.chips}}" as="c" hint-placeholder-count="3">
<span style="{{j.chipStyle}}">{{c}}</span>
</sc-for>
</span>
</span>
<span aria-hidden="true" style="font-size: 26px; font-weight: 400">{{j.sign}}</span>
</button>
<sc-if value="{{j.open}}" hint-placeholder-val="{{ false }}">
<div style="padding: 0 32px 32px; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-size: 17px; line-height: 1.6; max-width: 860px; color: #e4e4e4">{{j.intro}}</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #b8b8b8">Was du bei uns machst</span>
<sc-for list="{{j.tasks}}" as="t" hint-placeholder-count="4"><span style="font-size: 15px; line-height: 1.5; padding: 8px 0; border-bottom: 1px solid #3a3a3a">{{t}}</span></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #b8b8b8">Was dich stark macht</span>
<sc-for list="{{j.profile}}" as="p" hint-placeholder-count="4"><span style="font-size: 15px; line-height: 1.5; padding: 8px 0; border-bottom: 1px solid #3a3a3a">{{p}}</span></sc-for>
</div>
</div>
<a href="#check" onClick="{{j.apply}}" style="align-self: flex-start; background: #ffffff; color: #141414; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 600; font-size: 15px">Für diese Stelle bewerben ↓</a>
</div>
</sc-if>
</div>
</sc-for>
</div>
</section>

<section style="background: #f4f4f4">
<div style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Warum du bei uns arbeiten solltest</span>
<span style="font-size: 12px; font-weight: 600; border: 1px dashed #5c5c5c; border-radius: 999px; padding: 4px 10px; color: #3d3d3d">Vorschlag – gemeinsam schärfen</span>
</div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 860px">Fünf Dinge, die du von uns bekommst.</h2>
<div role="group" aria-label="Benefit wählen" style="display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 8px; overflow-x: auto">
<button type="button" onClick="{{ben0Pick}}" aria-pressed="{{ben0On}}" style="display: flex; flex-direction: column; align-items: center; gap: 12px; background: transparent; border: 0; cursor: pointer; padding: 8px 4px 16px; border-bottom: {{ben0Line}}; color: #141414">
<span style="{{ben0Circle}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; text-align: center; line-height: 1.25">{{ben0Title}}</span>
</button>
<button type="button" onClick="{{ben1Pick}}" aria-pressed="{{ben1On}}" style="display: flex; flex-direction: column; align-items: center; gap: 12px; background: transparent; border: 0; cursor: pointer; padding: 8px 4px 16px; border-bottom: {{ben1Line}}; color: #141414">
<span style="{{ben1Circle}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 21V11"></path><path d="M12 11c0-4 3-7 8-7 0 5-3 7-8 7z"></path><path d="M12 14c0-3-2-5-7-5 0 4 2 5 7 5z"></path></svg></span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; text-align: center; line-height: 1.25">{{ben1Title}}</span>
</button>
<button type="button" onClick="{{ben2Pick}}" aria-pressed="{{ben2On}}" style="display: flex; flex-direction: column; align-items: center; gap: 12px; background: transparent; border: 0; cursor: pointer; padding: 8px 4px 16px; border-bottom: {{ben2Line}}; color: #141414">
<span style="{{ben2Circle}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 17l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"></path></svg></span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; text-align: center; line-height: 1.25">{{ben2Title}}</span>
</button>
<button type="button" onClick="{{ben3Pick}}" aria-pressed="{{ben3On}}" style="display: flex; flex-direction: column; align-items: center; gap: 12px; background: transparent; border: 0; cursor: pointer; padding: 8px 4px 16px; border-bottom: {{ben3Line}}; color: #141414">
<span style="{{ben3Circle}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="9" cy="8" r="3"></circle><path d="M3 20a6 6 0 0 1 12 0"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M15.5 14.2A5 5 0 0 1 21 19"></path></svg></span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; text-align: center; line-height: 1.25">{{ben3Title}}</span>
</button>
<button type="button" onClick="{{ben4Pick}}" aria-pressed="{{ben4On}}" style="display: flex; flex-direction: column; align-items: center; gap: 12px; background: transparent; border: 0; cursor: pointer; padding: 8px 4px 16px; border-bottom: {{ben4Line}}; color: #141414">
<span style="{{ben4Circle}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><ellipse cx="9" cy="7" rx="6" ry="3"></ellipse><path d="M3 7v4c0 1.7 2.7 3 6 3s6-1.3 6-3V7"></path><path d="M9 14v3c0 1.7 2.7 3 6 3s6-1.3 6-3v-4c0-1.6-2.4-2.9-5.5-3"></path></svg></span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; text-align: center; line-height: 1.25">{{ben4Title}}</span>
</button>
</div>
<div class="mid-in" style="display: flex; gap: 48px; flex-wrap: wrap; align-items: flex-start; padding-top: 12px">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 46px); font-weight: 700; line-height: 1.08">{{benTitle}}</span>
<span style="font-size: 18px; color: #3d3d3d">{{benSub}}</span>
</div>
<div style="flex: 1.4 1 420px; min-width: 0; display: flex; flex-direction: column">
<sc-for list="{{benefitItems}}" as="bi" hint-placeholder-count="3">
<div style="display: flex; gap: 14px; align-items: flex-start; padding: 16px 0; border-bottom: 1px solid #d4d4d4"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l3 3 5-6"></path></svg><span style="font-size: 17px; line-height: 1.5">{{bi}}</span></div>
</sc-for>
</div>
</div>
</div>
</section>

<section style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 28px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">So läuft es</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 860px">Vier Schritte. Keine Warteschleife.</h2>

      benVals['ben' + i + 'Circle'] = 'width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background .2s, color .2s, transform .2s; ' + (on ? 'background: #141414; color: #ffffff; transform: scale(1.06);' : 'background: #ffffff; color: #141414; border: 1.5px solid #c8c8c8;');
    });
    var NAMES = ['Stelle', 'Arbeitsweise', 'Erfahrung', 'Superkräfte', 'Praxisfrage', 'Video', 'Kontakt', 'Absenden'];
    var total = NAMES.length;
    var roleList = J.map(function (d) { return d.title; }).concat(['Initiativ – ich habe eine eigene Idee']);
    var roleOpts = roleList.map(function (l, i) { return { label: l, on: st.role === i, pick: function () { self.setState({ role: i, scen: -1 }); }, style: row(st.role === i) }; });
    var placeOpts = ['Remote', 'Headquarter Erkelenz', 'Beides'].map(function (l) { return { label: l, on: st.place === l, pick: function () { self.setState({ place: l }); }, style: pill(st.place === l) }; });
    var timeOpts = ['Vollzeit', 'Teilzeit', 'Projektweise / freiberuflich', 'Noch offen'].map(function (l) { return { label: l, on: st.time === l, pick: function () { self.setState({ time: l }); }, style: pill(st.time === l) }; });
    var expOpts = ['Einstieg / Quereinstieg', '1–3 Jahre', '3–5 Jahre', 'mehr als 5 Jahre'].map(function (l) { return { label: l, on: st.exp === l, pick: function () { self.setState({ exp: l }); }, style: pill(st.exp === l) }; });
    var POW = ['Ich mache Dinge fertig', 'Ich bin ein Zahlenmensch', 'Ich überzeuge Menschen', 'Ich automatisiere alles', 'Ich erkläre Komplexes einfach', 'Ich behalte den Überblick', 'Ich lerne extrem schnell', 'Ich bleibe ruhig, wenn es brennt'];
    var powerOpts = POW.map(function (l) {
      var on = st.powers.indexOf(l) >= 0;
      return { label: l, on: on, style: pill(on), pick: function () {
        var next = on ? st.powers.filter(function (x) { return x !== l; }) : (st.powers.length < 3 ? st.powers.concat([l]) : st.powers);
        self.setState({ powers: next });
      } };
    });
    var rj = st.role >= 0 && st.role < J.length ? J[st.role] : null;
    var scenQ = rj ? rj.scenQ : 'Du siehst bei uns etwas, das besser laufen könnte. Was machst du?';
    var scenList = rj ? rj.scen : ['Ich spreche es direkt an – mit einem Vorschlag', 'Ich probiere es einfach aus und zeige das Ergebnis', 'Ich sammle erst Infos und Zahlen'];
    var scenOpts = scenList.map(function (l, i) { return { label: l, on: st.scen === i, pick: function () { self.setState({ scen: i }); }, style: row(st.scen === i) }; });
    var VQ = ['Wer bist du – in drei Sätzen?', 'Was kannst du richtig gut? Erzähl ein konkretes Beispiel.', 'Wann hast du zuletzt etwas fertig gemacht, das andere liegen gelassen hätten?', 'Warum make it done – und warum genau diese Stelle?', 'Wie willst du arbeiten und ab wann kannst du starten?'];
    var videoQs = VQ.map(function (q, i) { return { n: String(i + 1), q: q }; });
    var roleLabel = st.role >= 0 ? roleList[st.role] : '–';
    var summary = [
      { k: 'Stelle', v: roleLabel }, { k: 'Arbeitsweise', v: (st.place || '–') + ' · ' + (st.time || '–') },
      { k: 'Erfahrung', v: (st.exp || '–') + [st.st1, st.st2, st.st3].filter(function (x) { return x; }).map(function (x) { return ' | ' + x; }).join('') + (st.proud ? ' | Stolz auf: ' + st.proud : '') },
      { k: 'Superkräfte', v: st.powers.length ? st.powers.join(', ') : '–' }, { k: 'Praxisfrage', v: st.scen >= 0 ? scenList[st.scen] : '–' },
      { k: 'Video', v: st.video || '–' }, { k: 'Kontakt', v: (st.name || '–') + ' · ' + (st.mail || '–') + (st.phone ? ' · ' + st.phone : '') }
    ];
    var body = summary.map(function (s) { return s.k + ': ' + s.v; }).join('\n');
    var mailHref = 'mailto:karriere@makeitdone.de?subject=' + encodeURIComponent('Bewerbung: ' + roleLabel) + '&body=' + encodeURIComponent(body);
    var stepBtn = 'border-radius: 999px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; min-height: 44px; ';
    return Object.assign(benVals, {
      filters: filters, jobs: jobs, benefitItems: B[st.ben].i, benTitle: B[st.ben].t, benSub: B[st.ben].s,
      stepNum: st.step + 1, stepTotal: total, stepName: NAMES[st.step],
      barStyle: 'height: 100%; border-radius: 999px; background: #141414; width: ' + Math.round(((st.step + 1) / total) * 100) + '%',
      s0: st.step === 0, s1: st.step === 1, s2: st.step === 2, s3: st.step === 3, s4: st.step === 4, s5: st.step === 5, s6: st.step === 6, s7: st.step === 7,
      expOpts: expOpts, st1: st.st1, st2: st.st2, st3: st.st3, proud: st.proud,
      setSt1: function (e) { self.setState({ st1: e.target.value }); },

      setSt3: function (e) { self.setState({ st3: e.target.value }); },

      roleOpts: roleOpts, placeOpts: placeOpts, timeOpts: timeOpts, powerOpts: powerOpts, scenQ: scenQ, scenOpts: scenOpts, videoQs: videoQs,
      video: st.video, name: st.name, mail: st.mail, phone: st.phone,

      setName: function (e) { self.setState({ name: e.target.value }); },
      setMail: function (e) { self.setState({ mail: e.target.value }); },
      setPhone: function (e) { self.setState({ phone: e.target.value }); },
      summary: summary, mailHref: mailHref,
      notLast: st.step < total - 1,
      back: function () { self.setState({ step: Math.max(0, st.step - 1) }); },
      fwd: function () { self.setState({ step: Math.min(total - 1, st.step + 1) }); },
      backStyle: stepBtn + 'background: #ffffff; color: #141414; border: 1px solid #141414; visibility: ' + (st.step === 0 ? 'hidden' : 'visible'),
      fwdStyle: stepBtn + 'background: #141414; color: #ffffff; border: 1px solid #141414;'
    });

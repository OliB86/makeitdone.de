<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Über uns</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(40px, 6vw, 80px); line-height: 1.0; letter-spacing: -0.02em; max-width: 1000px">Wir machen Dinge fertig.</h1>
<p style="margin: 0; font-size: 20px; line-height: 1.55; color: #3d3d3d; max-width: 780px">make it done ist aus einer einfachen Beobachtung entstanden: Unternehmer haben gute Berater – und trotzdem bleibt das Wichtigste liegen. Weil niemand Zahlen, Struktur und Umsetzung zusammenbringt. Genau das machen wir.</p>
</section>

<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1">Olga Bertram</h2>
<span style="font-size: 17px; font-weight: 600">Gründerin und Geschäftsführerin der make it done GmbH</span>
<p style="margin: 0; font-size: 18px; line-height: 1.65; color: #3d3d3d">Olga kennt beide Seiten des Tisches: die der Berater aus Wirtschaftsprüfung und Steuerberatung – und die der Geschäftsführung als CFO/COO. Seit 2010 unterrichtet sie Steuern und Rechnungswesen. Heute bringt sie für ihre Kunden zusammen, was sonst nebeneinander herläuft.</p>

<span style="background: #f4f4f4; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500">Ausbilderin nach AdA</span>

<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #d4d4d4; max-width: 780px">Wir arbeiten mit einem festen Netzwerk zusammen – auf Wunsch auch mit deinen bestehenden Beratern. Du beauftragst direkt, wir erhalten keine Provision.</p>

<div style="background: #1f1f1f; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Wirtschaftsprüfer</span><span style="font-size: 15px; color: #d4d4d4">Prüfung und Bewertung</span></div>
<div style="background: #1f1f1f; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Rechtsanwälte</span><span style="font-size: 15px; color: #d4d4d4">Verträge und Gesellschaftsrecht</span></div>

<section style="max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; gap: 40px; flex-wrap: wrap; align-items: center">

<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5c5c">Team</span>

<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3d3d3d">Hinter make it done steht ein kleines Team mit kurzen Wegen. Als IHK-Ausbildungsbetrieb bilden wir auch selbst aus.</p>

<div id="app"></div>
<script src="dc-lite.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { v: 0 };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var V = [
      { t: 'Vor der Handlung', x: 'Gestaltet wird, bevor etwas unterschrieben, gegründet oder investiert ist. Danach kann man nur noch bestätigen oder reparieren.', d: 'Wir sind dabei, wenn du entscheidest – nicht erst im Jahresabschluss.' },
      { t: 'Auf deiner Seite', x: 'Wir sind nur unseren Kunden verpflichtet. Keine Provisionen, keine eigenen Produkte im Hintergrund.', d: 'Wir argumentieren mit Fachwissen in deinem Interesse – auch gegenüber deinen Beratern.' },
      { t: 'Klartext', x: 'Zahlen statt Bauchgefühl, ehrliche Einschätzungen statt Verkaufsversprechen. Auch wenn die Antwort einmal „lohnt sich nicht“ lautet.', d: 'Du bekommst Varianten mit Zahlen – und eine klare Meinung dazu.' },
      { t: 'done', x: 'Ein Konzept ist erst etwas wert, wenn es umgesetzt ist. Darum hört unsere Arbeit nicht bei der Präsentation auf.', d: 'Wir bleiben dran, bis Verträge, Konten und Prozesse laufen.' }
    ];
    var values = V.map(function (d, i) {
      var isOn = st.v === i;
      return { num: '0' + (i + 1), title: d.t, on: isOn, pick: function () { self.setState({ v: i }); },
        style: 'display: flex; flex-direction: column; gap: 14px; text-align: left; padding: 24px; border-radius: 16px; cursor: pointer; min-height: 150px; transition: background .25s, color .25s; ' + (isOn ? 'background: #141414; color: #ffffff; border: 1px solid #141414;' : 'background: #ffffff; color: #141414; border: 1px solid #dddddd;') };
    });
    var cv = V[st.v];
    var stations = [
      { k: 'Prüfung & Beratung', v: 'Wirtschaftsprüfung und Steuerberatung – für Gründer, größere Unternehmen und Konzerne.' },
      { k: 'Hochschule', v: 'Hochschule Niederrhein: wissenschaftliche Mitarbeit, Präsidium, Studiengangsentwicklung.' },
      { k: 'Lehre', v: 'Seit 2010 Dozentin für Steuern, Rechnungswesen, Jahresabschluss, Finanzmathematik und DATEV.' },
      { k: 'Unternehmen', v: 'CFO/COO der Felix Thönnessen GmbH: Holdingstruktur aufgebaut, Investments betreut, Start-ups beraten.' },
      { k: 'Selbstständig', v: 'Seit 2017 – seit 2023 mit eigener GmbH und Holdingstruktur.' },
      { k: 'make it done', v: 'Gründerin und Geschäftsführerin – gewachsen über Empfehlungen.' }
    ];
    return { values: values, valueText: cv.x, valueDaily: cv.d, stations: stations };
  }
}

dcMount(Component, 'tpl', 'app');
</script>

<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { exit: 2000000 };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    function eur(n) { return Math.round(n).toLocaleString('de-DE') + ' €'; }
    var gain = st.exit * (0.6 * 0.45 * 1.055 - 0.05 * (0.15 * 1.055 + 0.14));
    return { exit: st.exit, exitShown: eur(st.exit), exitGain: eur(gain), setExit: function (e) { self.setState({ exit: Number(e.target.value) }); } };
  }
}

dcMount(Component, 'tpl', 'app');
</script>

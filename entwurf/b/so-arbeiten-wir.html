<div class="sy-step" id="situation-0"><span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5c5c5c">Situation 1 von 5 · Struktur ohne Zahlen</span><p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 3.4vw, 44px); font-weight: 600; line-height: 1.12; letter-spacing: -0.02em">„Ich will meine Struktur anpassen – aber meine Zahlen hinken hinterher.“</p><p style="margin: 0; font-size: 18px; line-height: 1.65; color: #3d3d3d; max-width: 600px">Das Unternehmen wächst. GmbH, vielleicht eine Holding – die Idee ist da. Aber die aktuellen Zahlen? Die BWA ist Wochen alt, die Planung steht im Kopf. Also wird die Entscheidung vertagt. Oder aus dem Bauch getroffen.</p><p style="margin: 0; font-size: 16px; color: #3d3d3d"><b>Was fehlt:</b> Zahlen · Umsetzung</p><div style="display: flex; gap: 28px; flex-wrap: wrap; font-weight: 600; font-size: 16px"><a href="#zahnraeder" class="tlink">Zeigen, wo es hakt ↓</a><a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=situation-1" class="tlink">Genau das – lass uns sprechen →</a></div></div>
<div class="sy-step" id="situation-1"><span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5c5c5c">Situation 2 von 5 · Zahlen ohne Richtung</span><p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 3.4vw, 44px); font-weight: 600; line-height: 1.12; letter-spacing: -0.02em">„Ich habe meine Zahlen im Griff – aber was mache ich jetzt daraus?“</p><p style="margin: 0; font-size: 18px; line-height: 1.65; color: #3d3d3d; max-width: 600px">Dashboard, Liquiditätsplan, vielleicht sogar ein CFO-Dienst. Du siehst genau, was passiert. Nur: Passt deine Rechtsform noch? Wie kommt der Gewinn sinnvoll bei dir an? Wer stellt die Weichen?</p><p style="margin: 0; font-size: 16px; color: #3d3d3d"><b>Was fehlt:</b> Struktur · Abstimmung</p><div style="display: flex; gap: 28px; flex-wrap: wrap; font-weight: 600; font-size: 16px"><a href="#zahnraeder" class="tlink">Zeigen, wo es hakt ↓</a><a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=situation-2" class="tlink">Genau das – lass uns sprechen →</a></div></div>
<div class="sy-step" id="situation-2"><span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5c5c5c">Situation 3 von 5 · Konzept in der Schublade</span><p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 3.4vw, 44px); font-weight: 600; line-height: 1.12; letter-spacing: -0.02em">„Das Konzept liegt in der Schublade.“</p><p style="margin: 0; font-size: 18px; line-height: 1.65; color: #3d3d3d; max-width: 600px">Die Beratung war gut, die Präsentation auch. Dann kam der Alltag: Verträge, Konten, Prozesse – niemand hat es angepackt. Ein halbes Jahr später ist alles wie vorher.</p><p style="margin: 0; font-size: 16px; color: #3d3d3d"><b>Was fehlt:</b> Umsetzung</p><div style="display: flex; gap: 28px; flex-wrap: wrap; font-weight: 600; font-size: 16px"><a href="#zahnraeder" class="tlink">Zeigen, wo es hakt ↓</a><a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=situation-3" class="tlink">Genau das – lass uns sprechen →</a></div></div>
<div class="sy-step" id="situation-3"><span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5c5c5c">Situation 4 von 5 · Der Sachverhalt fehlt</span><p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 3.4vw, 44px); font-weight: 600; line-height: 1.12; letter-spacing: -0.02em">„Mein Steuerberater fragt nach dem Sachverhalt – und ich weiß nicht, wo ich anfangen soll.“</p><p style="margin: 0; font-size: 18px; line-height: 1.65; color: #3d3d3d; max-width: 600px">Du spürst, dass etwas geregelt werden muss. Dein Steuerberater braucht dafür einen klaren Sachverhalt, Unterlagen, Zahlen. Zwischen Tagesgeschäft und Kunden bleibt das liegen – und die Antwort kommt, wenn längst gehandelt wurde.</p><p style="margin: 0; font-size: 16px; color: #3d3d3d"><b>Was fehlt:</b> Abstimmung auf Augenhöhe · Struktur</p><div style="display: flex; gap: 28px; flex-wrap: wrap; font-weight: 600; font-size: 16px"><a href="#zahnraeder" class="tlink">Zeigen, wo es hakt ↓</a><a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=situation-4" class="tlink">Genau das – lass uns sprechen →</a></div></div>
<div class="sy-step" id="situation-4"><span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5c5c5c">Situation 5 von 5 · Zahlen kommen zu spät</span><p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 3.4vw, 44px); font-weight: 600; line-height: 1.12; letter-spacing: -0.02em">„Ich weiß erst Mitte Februar, was der Dezember gebracht hat.“</p><p style="margin: 0; font-size: 18px; line-height: 1.65; color: #3d3d3d; max-width: 600px">Du willst investieren, jemanden einstellen oder Geld entnehmen. Aber die letzte Auswertung ist sechs Wochen alt. Also entscheidest du nach Kontostand – oder schiebst es auf. Und vor der nächsten Steuerzahlung bleibt dieses mulmige Gefühl.</p><p style="margin: 0; font-size: 16px; color: #3d3d3d"><b>Was fehlt:</b> Zahlen just in time · ein Zahlen-Cockpit, das Entscheidungen liefert</p><div style="display: flex; gap: 28px; flex-wrap: wrap; font-weight: 600; font-size: 16px"><a href="#zahnraeder" class="tlink">Zeigen, wo es hakt ↓</a><a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=situation-5" class="tlink">Genau das – lass uns sprechen →</a></div></div>

<div style="margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5c5c5c">Im Vorfeld</div>
<div class="sy-step sm" id="weg-0"><div style="flex: 1; display: flex; gap: 22px; align-items: stretch"><span style="display: flex; flex-direction: column; align-items: center; width: 52px; flex-shrink: 0"><span class="tl-dot" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; flex-shrink: 0; background: #ffffff; color: #141414; border: 2px dashed #8a8a8a">1</span><span style="flex: 1; width: 2px; min-height: 24px; background: repeating-linear-gradient(180deg, #8a8a8a 0 6px, transparent 6px 12px)"></span></span><span style="display: flex; flex-direction: column; gap: 8px; padding: 6px 0 26px; min-width: 0"><span style="font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5c5c5c">15 Minuten · online oder Telefon</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.6vw, 30px); font-weight: 700; line-height: 1.15">Kennenlernen <span style="font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; color: #5c5c5c">kostenlos</span></span><span style="font-size: 17px; line-height: 1.6; color: #3d3d3d; max-width: 560px">Wir lernen uns kennen und schauen, ob wir dir helfen können – und ob du ein gutes Gefühl mit uns hast. Kein Verkaufsgespräch, keine Paketauswahl.</span></span></div></div>
<div class="sy-step sm" id="weg-1"><div style="flex: 1; display: flex; gap: 22px; align-items: stretch"><span style="display: flex; flex-direction: column; align-items: center; width: 52px; flex-shrink: 0"><span class="tl-dot" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; flex-shrink: 0; background: #ffffff; color: #141414; border: 2px dashed #8a8a8a">2</span><span style="flex: 1; width: 2px; min-height: 24px; background: repeating-linear-gradient(180deg, #8a8a8a 0 6px, transparent 6px 12px)"></span></span><span style="display: flex; flex-direction: column; gap: 8px; padding: 6px 0 26px; min-width: 0"><span style="font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5c5c5c">90 Minuten · per Video</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.6vw, 30px); font-weight: 700; line-height: 1.15">Strategiegespräch</span><span style="font-size: 17px; line-height: 1.6; color: #3d3d3d; max-width: 560px">Wir gehen tief in deine Situation: Zahlen, Struktur, Ziele. Du bekommst eine ehrliche Einschätzung, was möglich ist und wie dein Weg aussehen würde.</span></span></div></div>
<div class="sy-step sm" id="weg-2"><div style="flex: 1; display: flex; gap: 22px; align-items: stretch"><span style="display: flex; flex-direction: column; align-items: center; width: 52px; flex-shrink: 0"><span class="tl-dot" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; flex-shrink: 0; background: #ffffff; color: #141414; border: 2px dashed #8a8a8a">3</span><span style="flex: 1; width: 0"></span></span><span style="display: flex; flex-direction: column; gap: 8px; padding: 6px 0 26px; min-width: 0"><span style="font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5c5c5c">danach</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.6vw, 30px); font-weight: 700; line-height: 1.15">Entscheidung <span style="font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; color: #5c5c5c">auf beiden Seiten</span></span><span style="font-size: 17px; line-height: 1.6; color: #3d3d3d; max-width: 560px">Passt es für dich und für uns, legen wir den Start fest. Wir arbeiten bewusst nur mit einer begrenzten Zahl an Unternehmen gleichzeitig – deshalb entscheiden wir das gemeinsam.</span></span></div></div>
<div style="margin: 14px 0 18px; display: flex; gap: 16px; align-items: center; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700"><span style="background: linear-gradient(transparent 62%, #F1D734 62%, #F1D734 92%, transparent 92%)">Ab hier geht es los ↓</span><span style="flex: 1; height: 1.5px; background: #141414"></span></div>
<div class="sy-step sm" id="weg-3"><div style="flex: 1; display: flex; gap: 22px; align-items: stretch"><span style="display: flex; flex-direction: column; align-items: center; width: 52px; flex-shrink: 0"><span class="tl-dot" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; flex-shrink: 0; background: #ffffff; color: #141414; border: 2px solid #141414">4</span><span style="flex: 1; width: 2px; min-height: 24px; background: #141414"></span></span><span style="display: flex; flex-direction: column; gap: 8px; padding: 6px 0 26px; min-width: 0"><span style="font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5c5c5c">Woche 1–2</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.6vw, 30px); font-weight: 700; line-height: 1.15">Onboarding & Unternehmensanalyse <span style="font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; color: #5c5c5c">make it visible.</span></span><span style="font-size: 17px; line-height: 1.6; color: #3d3d3d; max-width: 560px">Wir schauen uns alles an: Zahlen, Buchhaltung, Verträge, Rechtsform, Prozesse. Dazu bekommst du einen kurzen Kurs zu deinen Gestaltungsmöglichkeiten – damit du im Workshop mitentscheiden kannst.</span></span></div></div>

<p class="bk-intro" style="margin: 0 0 8px; font-size: 14px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5c5c5c">Die Geschichte von Kunde A · scroll, links wächst die Struktur mit</p>
<div class="sy-step" id="kunde-a-0"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3"><span class="hl">Eine erfolgreiche GmbH – aber ohne Struktur dahinter.</span></span><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>Keine Holding:</b> Über der operativen GmbH gab es nichts.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>Volle private Besteuerung:</b> Gewinne und Verkaufserlöse liefen komplett in die Einkommensteuer.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>Beteiligungen verstreut,</b> teils privat, teils in der GmbH – alle Risiken in einem Topf.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d">Die Aufgabe: Gewinne und Exit-Erlöse sollen weiterarbeiten – nicht im Finanzamt landen.</p></div>
<div class="sy-step" id="kunde-a-1"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3"><span class="hl">Die Holding schiebt sich dazwischen.</span></span><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d">Gewinne fließen nicht mehr direkt ins Private, sondern in die Holding – mit rund 1,5 % Steuerlast nach § 8b KStG. Dort werden sie reinvestiert. Privat versteuert wird erst, wenn du Geld wirklich entnimmst.</p></div>
<div class="sy-step" id="kunde-a-2"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3"><span class="hl">Jedes Risiko bekommt seine eigene Gesellschaft.</span></span><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>Immobilien-GmbH</b> unter der Holding – vom operativen Risiko getrennt.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>Investment-GmbH</b> für neue Beteiligungen – von Anfang an richtig angebunden.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>Umgesetzt im Netzwerk:</b> mit Steuerberatern, Anwälten und Notar – von uns vorbereitet und koordiniert.</p></div>
<div class="sy-step" id="kunde-a-3"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3"><span class="hl">Mehr Netto vom Brutto – bei gleichen Kosten.</span></span><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d">Geschäftsführer- und Arbeitsverträge neu aufgestellt: steuerfreie Sachbezüge, Pauschalierung nach § 37b EStG und eine Absicherung der Gehälter bei Krankheit.</p></div>
<div class="sy-step" id="kunde-a-4"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3"><span class="hl">Vier Fallstricke – und wie wir sie umgangen haben.</span></span><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>① Mindestbeteiligung</b> (§ 8b Abs. 4 KStG): begünstigt erst ab 10 % – Quoten entsprechend gesetzt.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>② Sperrfrist 7 Jahre</b> (§ 22 UmwStG): neue Beteiligungen direkt über die Holding erworben.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>③ Verluste</b> (§ 8b Abs. 3 KStG): laufende Verluste über eine Organschaft verrechenbar.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>④ Erweiterte Kürzung</b> (§ 9 Nr. 1 GewStG): die Immobilien-GmbH bleibt reine Vermietung.</p></div>
<div class="sy-step" id="kunde-a-5"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3"><span class="hl">Was das bei einem Exit bedeutet.</span></span>
<div style="display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-start">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 22px">

<p class="bk-intro" style="margin: 0 0 8px; font-size: 14px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5c5c5c">Die Geschichte von Kunde B · scroll, links wächst die Struktur mit</p>
<div class="sy-step" id="kunde-b-0"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3"><span class="hl">Schnell gewachsen – und alles hinkte hinterher.</span></span><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>Einzelunternehmen</b> mit rund 1 Mio. € Umsatz: jeder Euro Gewinn zum Spitzensteuersatz.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>UG und Holding</b> gab es schon – genutzt wurden sie nicht.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>Rückstände:</b> Abschlüsse offen, Vorauszahlungen passten nicht, Nachzahlungen liefen auf.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d">Die Aufgabe: erst die Rückstände, dann das Eigenkapital für Immobilien.</p></div>
<div class="sy-step" id="kunde-b-1"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3"><span class="hl">Aus dem Einzelunternehmen wird eine GmbH – rund 39.000 € mehr im Jahr verfügbar.</span></span><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d">Bei 400.000 € Gewinn bleiben in der GmbH rund 39.000 € mehr verfügbar als im Einzelunternehmen – Geld für Rücklagen und die Immobilien. Das Einzelunternehmen wurde zu Buchwerten in die UG eingebracht und beim Notar mit der Kapitalerhöhung zur GmbH gemacht. Die Rückstände wurden über ein fremdübliches Darlehen bezahlt, die Vorauszahlungen an den echten Gewinn angepasst.</p></div>
<div class="sy-step" id="kunde-b-2"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3"><span class="hl">Mehr Netto für dich als Geschäftsführer.</span></span><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>Geschäftsführervertrag:</b> angemessenes Gehalt als Betriebsausgabe der GmbH – was in der GmbH bleibt, kostet rund 30 % statt Spitzensteuersatz.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>Benefits für dich:</b> Sachbezug, Internet, Gesundheit und Kita-Zuschuss steuerfrei oder pauschal statt voll versteuertem Gehalt.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>Partnerin:</b> vom Minijob in eine C-Level-Rolle – in Teilzeit so gestaltet, dass das Elterngeld erhalten bleibt.</p></div>
<div class="sy-step" id="kunde-b-3"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3"><span class="hl">Mehr Netto für alle – bei gleichen Kosten.</span></span><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d">Kita-Zuschuss, Sachbezug, Internet und Gesundheit – mit dem Anwalt als klare Regel für das ganze Team aufgesetzt und über ein Benefit-Tool ausgerollt.</p></div>
<div class="sy-step" id="kunde-b-4"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3"><span class="hl">Das Cockpit ist live.</span></span><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d">Zahlen-Cockpit aufgebaut: Umsätze, Kosten und Liquidität jederzeit sichtbar – statt Wochen auf die BWA zu warten.</p></div>
<div class="sy-step" id="kunde-b-5"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3"><span class="hl">Der Weg zur Immobilie steht.</span></span><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d">Bestand langfristig privat, Projekte über eine eigene GmbH unter der Holding. Die Liquiditätsplanung zeigt, ab wann das Eigenkapital steht.</p></div>
<div class="sy-step" id="kunde-b-6"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3"><span class="hl">Die wichtigsten Fallstricke.</span></span><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>① Sacheinlage in die UG</b> (§ 5a GmbHG): nur zusammen mit dem Schritt zur GmbH.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>② Sperrfrist 7 Jahre</b> (§ 22 UmwStG): Struktur so gebaut, dass keine Umhängung nötig ist.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>③ Darlehen</b> (§ 8 Abs. 3 KStG): Vertrag, Zins und Sicherheit wie unter Fremden.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3d3d3d"><b>④ Verträge mit Angehörigen</b> (Fremdvergleich, BEEG): Gehalt und Stunden passend zum Elterngeld.</p></div>
<div class="sy-step" id="kunde-b-7"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3"><span class="hl">Was die GmbH im Jahr bringt.</span></span>

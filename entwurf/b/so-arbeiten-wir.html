<div class="sy hz" data-sy="situation" style="--n: 5"><div class="hz-wrap"><div class="hz-pin">
<div class="sy-side"><span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ffffff; color: #3d3d3d; box-shadow: 0 2px 10px rgba(0,0,0,.08)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Kennst du das?</span><h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 4.6vw, 58px); line-height: 1.05; letter-spacing: -0.02em">Du willst weiterkommen. Aber irgendetwas <em style="font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: 0; background: linear-gradient(transparent 62%, #F1D734 62%, #F1D734 92%, transparent 92%); padding: 0 .08em">greift nicht</em>.</h2><nav class="sy-nav" aria-label="Schritte"><a href="#situation-0"><span class="sy-n">1</span><span>Struktur ohne Zahlen</span></a><a href="#situation-1"><span class="sy-n">2</span><span>Zahlen ohne Richtung</span></a><a href="#situation-2"><span class="sy-n">3</span><span>Konzept in der Schublade</span></a><a href="#situation-3"><span class="sy-n">4</span><span>Der Sachverhalt fehlt</span></a><a href="#situation-4"><span class="sy-n">5</span><span>Zahlen kommen zu spät</span></a></nav><span class="sy-hint hide-m"><b>↓</b>Scroll weiter – erkennst du dich wieder?</span><span class="hz-count hide-m"><span class="sy-cur">1</span> / 5</span></div>
<div class="sy-steps hz-stage">
<div class="sy-step" id="situation-0"><span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5c5c5c">Situation 1 von 5</span><p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(28px, 3.4vw, 42px); font-weight: 600; line-height: 1.18; letter-spacing: -0.015em">„Ich will meine Struktur anpassen – aber meine Zahlen hinken hinterher.“</p><p style="margin: 0; font-size: 18px; line-height: 1.65; color: #3d3d3d">Das Unternehmen wächst. GmbH, vielleicht eine Holding – die Idee ist da. Aber die aktuellen Zahlen? Die BWA ist Wochen alt, die Planung steht im Kopf. Also wird die Entscheidung vertagt. Oder aus dem Bauch getroffen.</p><div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center"><span style="font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #5c5c5c; margin-right: 6px">Was fehlt</span><span style="font-size: 14px; font-weight: 600; background: #F1D734; border-radius: 999px; padding: 6px 14px">Zahlen</span><span style="font-size: 14px; font-weight: 600; background: #F1D734; border-radius: 999px; padding: 6px 14px">Umsetzung</span></div><a href="#zahnraeder" onClick="{{sitG0}}" style="align-self: flex-start; background: #141414; color: #ffffff; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 600; font-size: 15px">Zeigen, wo es hakt ↓</a></div>
<div class="sy-step" id="situation-1"><span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5c5c5c">Situation 2 von 5</span><p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(28px, 3.4vw, 42px); font-weight: 600; line-height: 1.18; letter-spacing: -0.015em">„Ich habe meine Zahlen im Griff – aber was mache ich jetzt daraus?“</p><p style="margin: 0; font-size: 18px; line-height: 1.65; color: #3d3d3d">Dashboard, Liquiditätsplan, vielleicht sogar ein CFO-Dienst. Du siehst genau, was passiert. Nur: Passt deine Rechtsform noch? Wie kommt der Gewinn sinnvoll bei dir an? Wer stellt die Weichen?</p><div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center"><span style="font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #5c5c5c; margin-right: 6px">Was fehlt</span><span style="font-size: 14px; font-weight: 600; background: #F1D734; border-radius: 999px; padding: 6px 14px">Struktur</span><span style="font-size: 14px; font-weight: 600; background: #F1D734; border-radius: 999px; padding: 6px 14px">Abstimmung</span></div><a href="#zahnraeder" onClick="{{sitG1}}" style="align-self: flex-start; background: #141414; color: #ffffff; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 600; font-size: 15px">Zeigen, wo es hakt ↓</a></div>
<div class="sy-step" id="situation-2"><span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5c5c5c">Situation 3 von 5</span><p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(28px, 3.4vw, 42px); font-weight: 600; line-height: 1.18; letter-spacing: -0.015em">„Das Konzept liegt in der Schublade.“</p><p style="margin: 0; font-size: 18px; line-height: 1.65; color: #3d3d3d">Die Beratung war gut, die Präsentation auch. Dann kam der Alltag: Verträge, Konten, Prozesse – niemand hat es angepackt. Ein halbes Jahr später ist alles wie vorher.</p><div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center"><span style="font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #5c5c5c; margin-right: 6px">Was fehlt</span><span style="font-size: 14px; font-weight: 600; background: #F1D734; border-radius: 999px; padding: 6px 14px">Umsetzung</span></div><a href="#zahnraeder" onClick="{{sitG2}}" style="align-self: flex-start; background: #141414; color: #ffffff; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 600; font-size: 15px">Zeigen, wo es hakt ↓</a></div>
<div class="sy-step" id="situation-3"><span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5c5c5c">Situation 4 von 5</span><p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(28px, 3.4vw, 42px); font-weight: 600; line-height: 1.18; letter-spacing: -0.015em">„Mein Steuerberater fragt nach dem Sachverhalt – und ich weiß nicht, wo ich anfangen soll.“</p><p style="margin: 0; font-size: 18px; line-height: 1.65; color: #3d3d3d">Du spürst, dass etwas geregelt werden muss. Dein Steuerberater braucht dafür einen klaren Sachverhalt, Unterlagen, Zahlen. Zwischen Tagesgeschäft und Kunden bleibt das liegen – und die Antwort kommt, wenn längst gehandelt wurde.</p><div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center"><span style="font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #5c5c5c; margin-right: 6px">Was fehlt</span><span style="font-size: 14px; font-weight: 600; background: #F1D734; border-radius: 999px; padding: 6px 14px">Abstimmung auf Augenhöhe</span><span style="font-size: 14px; font-weight: 600; background: #F1D734; border-radius: 999px; padding: 6px 14px">Struktur</span></div><a href="#zahnraeder" onClick="{{sitG3}}" style="align-self: flex-start; background: #141414; color: #ffffff; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 600; font-size: 15px">Zeigen, wo es hakt ↓</a></div>
<div class="sy-step" id="situation-4"><span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5c5c5c">Situation 5 von 5</span><p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(28px, 3.4vw, 42px); font-weight: 600; line-height: 1.18; letter-spacing: -0.015em">„Ich weiß erst Mitte Februar, was der Dezember gebracht hat.“</p><p style="margin: 0; font-size: 18px; line-height: 1.65; color: #3d3d3d">Du willst investieren, jemanden einstellen oder Geld entnehmen. Aber die letzte Auswertung ist sechs Wochen alt. Also entscheidest du nach Kontostand – oder schiebst es auf. Und vor der nächsten Steuerzahlung bleibt dieses mulmige Gefühl.</p><div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center"><span style="font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #5c5c5c; margin-right: 6px">Was fehlt</span><span style="font-size: 14px; font-weight: 600; background: #F1D734; border-radius: 999px; padding: 6px 14px">Zahlen just in time</span><span style="font-size: 14px; font-weight: 600; background: #F1D734; border-radius: 999px; padding: 6px 14px">Buchhaltung, die Entscheidungen liefert</span></div><a href="#zahnraeder" onClick="{{sitG4}}" style="align-self: flex-start; background: #141414; color: #ffffff; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 600; font-size: 15px">Zeigen, wo es hakt ↓</a></div>

<div class="sy-side"><span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ffffff; color: #3d3d3d; box-shadow: 0 2px 10px rgba(0,0,0,.08)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Der Weg</span><h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 4.6vw, 58px); line-height: 1.05; letter-spacing: -0.02em">Vom Erstgespräch zum <em style="font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: 0; background: linear-gradient(transparent 62%, #F1D734 62%, #F1D734 92%, transparent 92%); padding: 0 .08em">Fundament</em>. Und weiter.</h2><span style="display: inline-flex; gap: 12px; align-items: center; align-self: flex-start; padding: 14px 20px; border-radius: 18px; background: #141414; color: #ffffff; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F1D734" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M8.5 12l2.5 2.5 4.5-5"></path></svg>Ergebnisgarantie</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600">Schritt <span class="sy-cur">1</span> von 9</span><div class="sy-bar" aria-hidden="true"><i></i></div></div>
<div class="sy-steps">
<div style="margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5c5c5c">Im Vorfeld</div>
<div class="sy-step sm" id="weg-0"><div style="flex: 1; display: flex; gap: 22px; align-items: stretch"><span style="display: flex; flex-direction: column; align-items: center; width: 52px; flex-shrink: 0"><span class="tl-dot" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; flex-shrink: 0; background: #ffffff; color: #141414; border: 2px dashed #8a8a8a">1</span><span style="flex: 1; width: 2px; min-height: 24px; background: repeating-linear-gradient(180deg, #8a8a8a 0 6px, transparent 6px 12px)"></span></span><span style="display: flex; flex-direction: column; gap: 8px; padding: 8px 0 32px; min-width: 0"><span style="font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5c5c5c">15 Minuten · online oder Telefon</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.6vw, 30px); font-weight: 700; line-height: 1.15">Kennenlernen <span style="font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; color: #5c5c5c">kostenlos</span></span><span style="font-size: 17px; line-height: 1.6; color: #3d3d3d; max-width: 560px">Wir lernen uns kennen und schauen, ob wir dir helfen können – und ob du ein gutes Gefühl mit uns hast. Kein Verkaufsgespräch, keine Paketauswahl.</span></span></div></div>
<div class="sy-step sm" id="weg-1"><div style="flex: 1; display: flex; gap: 22px; align-items: stretch"><span style="display: flex; flex-direction: column; align-items: center; width: 52px; flex-shrink: 0"><span class="tl-dot" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; flex-shrink: 0; background: #ffffff; color: #141414; border: 2px dashed #8a8a8a">2</span><span style="flex: 1; width: 2px; min-height: 24px; background: repeating-linear-gradient(180deg, #8a8a8a 0 6px, transparent 6px 12px)"></span></span><span style="display: flex; flex-direction: column; gap: 8px; padding: 8px 0 32px; min-width: 0"><span style="font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5c5c5c">90 Minuten · per Video</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.6vw, 30px); font-weight: 700; line-height: 1.15">Strategiegespräch</span><span style="font-size: 17px; line-height: 1.6; color: #3d3d3d; max-width: 560px">Wir gehen tief in deine Situation: Zahlen, Struktur, Ziele. Du bekommst eine ehrliche Einschätzung, was möglich ist und wie dein Weg aussehen würde.</span></span></div></div>
<div class="sy-step sm" id="weg-2"><div style="flex: 1; display: flex; gap: 22px; align-items: stretch"><span style="display: flex; flex-direction: column; align-items: center; width: 52px; flex-shrink: 0"><span class="tl-dot" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; flex-shrink: 0; background: #ffffff; color: #141414; border: 2px dashed #8a8a8a">3</span><span style="flex: 1; width: 0"></span></span><span style="display: flex; flex-direction: column; gap: 8px; padding: 8px 0 32px; min-width: 0"><span style="font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5c5c5c">danach</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.6vw, 30px); font-weight: 700; line-height: 1.15">Entscheidung <span style="font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; color: #5c5c5c">auf beiden Seiten</span></span><span style="font-size: 17px; line-height: 1.6; color: #3d3d3d; max-width: 560px">Passt es für dich und für uns, legen wir den Start fest. Wir arbeiten bewusst nur mit einer begrenzten Zahl an Unternehmen gleichzeitig – deshalb entscheiden wir das gemeinsam.</span></span></div></div>
<div style="margin: 18px 0 18px; background: #141414; color: #ffffff; border-radius: 16px; padding: 16px 22px; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Ab hier geht es los ↓</div>
<div class="sy-step sm" id="weg-3"><div style="flex: 1; display: flex; gap: 22px; align-items: stretch"><span style="display: flex; flex-direction: column; align-items: center; width: 52px; flex-shrink: 0"><span class="tl-dot" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; flex-shrink: 0; background: #ffffff; color: #141414; border: 2px solid #141414">4</span><span style="flex: 1; width: 2px; min-height: 24px; background: #141414"></span></span><span style="display: flex; flex-direction: column; gap: 8px; padding: 8px 0 32px; min-width: 0"><span style="font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5c5c5c">Woche 1–2</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.6vw, 30px); font-weight: 700; line-height: 1.15">Onboarding & Unternehmensanalyse <span style="font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; color: #5c5c5c">make it visible.</span></span><span style="font-size: 17px; line-height: 1.6; color: #3d3d3d; max-width: 560px">Wir schauen uns alles an: Zahlen, Buchhaltung, Verträge, Rechtsform, Prozesse. Dazu bekommst du einen kurzen Kurs zu deinen Gestaltungsmöglichkeiten – damit du im Workshop mitentscheiden kannst.</span></span></div></div>
<div class="sy-step sm" id="weg-4"><div style="flex: 1; display: flex; gap: 22px; align-items: stretch"><span style="display: flex; flex-direction: column; align-items: center; width: 52px; flex-shrink: 0"><span class="tl-dot" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; flex-shrink: 0; background: #ffffff; color: #141414; border: 2px solid #141414">5</span><span style="flex: 1; width: 2px; min-height: 24px; background: #141414"></span></span><span style="display: flex; flex-direction: column; gap: 8px; padding: 8px 0 32px; min-width: 0"><span style="font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5c5c5c">Woche 2</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.6vw, 30px); font-weight: 700; line-height: 1.15">Zielbild-Workshop <span style="font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; color: #5c5c5c">make plans done.</span></span><span style="font-size: 17px; line-height: 1.6; color: #3d3d3d; max-width: 560px">Persönlich und unternehmerisch, für 1, 3 und 10 Jahre: Familie, Vermögen, Investitionen, Exit. Alles Weitere richtet sich danach aus.</span></span></div></div>
<div class="sy-step sm" id="weg-5"><div style="flex: 1; display: flex; gap: 22px; align-items: stretch"><span style="display: flex; flex-direction: column; align-items: center; width: 52px; flex-shrink: 0"><span class="tl-dot" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; flex-shrink: 0; background: #ffffff; color: #141414; border: 2px solid #141414">6</span><span style="flex: 1; width: 2px; min-height: 24px; background: #141414"></span></span><span style="display: flex; flex-direction: column; gap: 8px; padding: 8px 0 32px; min-width: 0"><span style="font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5c5c5c">bis Tag 14</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.6vw, 30px); font-weight: 700; line-height: 1.15">Struktur-Fahrplan <span style="font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; color: #5c5c5c">make structure done.</span></span><span style="font-size: 17px; line-height: 1.6; color: #3d3d3d; max-width: 560px">Die Struktur, die zu deinem Zielbild passt – mit fertig vorbereiteten Fragen an Steuerberater, Anwalt und Notar.</span></span></div></div>
<div class="sy-step sm" id="weg-6"><div style="flex: 1; display: flex; gap: 22px; align-items: stretch"><span style="display: flex; flex-direction: column; align-items: center; width: 52px; flex-shrink: 0"><span class="tl-dot" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; flex-shrink: 0; background: #ffffff; color: #141414; border: 2px solid #141414">7</span><span style="flex: 1; width: 2px; min-height: 24px; background: #141414"></span></span><span style="display: flex; flex-direction: column; gap: 8px; padding: 8px 0 32px; min-width: 0"><span style="font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5c5c5c">Tag 30–90</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.6vw, 30px); font-weight: 700; line-height: 1.15">Zahlen-Cockpit <span style="font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; color: #5c5c5c">make finance done.</span></span><span style="font-size: 17px; line-height: 1.6; color: #3d3d3d; max-width: 560px">Individueller Kontenplan, automatisierte Buchhaltung, Kennzahlen, Cashflow und Liquidität – dein Cockpit ist live, deine Zahlen kommen just in time.</span></span></div></div>
<div class="sy-step sm" id="weg-7"><div style="flex: 1; display: flex; gap: 22px; align-items: stretch"><span style="display: flex; flex-direction: column; align-items: center; width: 52px; flex-shrink: 0"><span class="tl-dot" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; flex-shrink: 0; background: #ffffff; color: #141414; border: 2px solid #141414">8</span><span style="flex: 1; width: 2px; min-height: 24px; background: #141414"></span></span><span style="display: flex; flex-direction: column; gap: 8px; padding: 8px 0 32px; min-width: 0"><span style="font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5c5c5c">Tag 90</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.6vw, 30px); font-weight: 700; line-height: 1.15">Dein Fundament steht <span style="font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; color: #5c5c5c">Umsetzungsplan</span></span><span style="font-size: 17px; line-height: 1.6; color: #3d3d3d; max-width: 560px">Quick Wins sind erledigt, alles Weitere steht mit Terminen im Plan – auch Schritte mit Fristen wie eine Umwandlung.</span></span></div></div>
<div class="sy-step sm" id="weg-8"><div style="flex: 1; display: flex; gap: 22px; align-items: stretch"><span style="display: flex; flex-direction: column; align-items: center; width: 52px; flex-shrink: 0"><span class="tl-dot" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; flex-shrink: 0; background: #ffffff; color: #141414; border: 2px solid #141414">9</span><span style="flex: 1; width: 0"></span></span><span style="display: flex; flex-direction: column; gap: 8px; padding: 8px 0 32px; min-width: 0"><span style="font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5c5c5c">laufend</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 2.6vw, 30px); font-weight: 700; line-height: 1.15">Wir steuern gemeinsam <span style="font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; color: #5c5c5c">make it done.</span></span><span style="font-size: 17px; line-height: 1.6; color: #3d3d3d; max-width: 560px">Jetzt kommen die Entscheidungen, für die das Fundament gebaut ist: Einstellungen, Investitionen, größere Ausgaben, Umsetzungen mit Fristen. Wir sind dabei – im festen Gesprächsrhythmus, mit Meilensteingesprächen und einem Vorab-Check, wann immer du ihn brauchst.</span></span></div></div>
</div>
</div>
</div>
</section>

<section id="geschichten" style="max-width: 1180px; margin: 0 auto; padding: 120px 24px 60px; display: flex; flex-direction: column; gap: 32px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ffffff; color: #3d3d3d; box-shadow: 0 2px 10px rgba(0,0,0,.08)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Ergebnisse</span>
<h2 class="rv" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 4.6vw, 58px); line-height: 1.05; letter-spacing: -0.02em; max-width: 980px">Zwei Unternehmer. Zwei Geschichten. Bis zum <em style="font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: 0; background: linear-gradient(transparent 62%, #F1D734 62%, #F1D734 92%, transparent 92%); padding: 0 .08em">Effekt in Euro</em>.</h2>
<div style="display: flex; flex-direction: column; gap: 28px">
<div role="group" aria-label="Kundengeschichte wählen" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{caseTabs}}" as="ct" hint-placeholder-count="2">
<button type="button" onClick="{{ct.pick}}" aria-pressed="{{ct.on}}" style="{{ct.style}}">
<span style="display: flex; justify-content: space-between; align-items: center; gap: 12px"><span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: .7">{{ct.label}}</span><span style="{{ct.dot}}"></span></span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.15">{{ct.name}}</span>
<span style="font-size: 14px; opacity: .75">{{ct.sub}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; margin-top: 8px">{{ct.big}}</span>
<span style="font-size: 13px; opacity: .7">{{ct.bigSub}}</span>
</button>
</sc-for>
</div>
<div class="sy" data-sy="kapitel" style="margin-top: 24px">
<div class="sy-side">
<span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5c5c5c">Die Geschichte von</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(28px, 3vw, 38px); font-weight: 700; line-height: 1.1">{{caseName}}</span>
<nav class="sy-nav" aria-label="Kapitel"><sc-for list="{{caseAll}}" as="c" hint-placeholder-count="6"><a href="#kapitel-{{c.idx}}"><span class="sy-n">{{c.num}}</span><span>{{c.label}}</span></a></sc-for></nav>
<div class="sy-bar" aria-hidden="true"><i></i></div><span class="sy-hint hide-m"><b>↓</b>Scroll durch die Geschichte – bis zum Effekt</span>
</div>
<div class="sy-steps">
<sc-for list="{{caseAll}}" as="c" hint-placeholder-count="6">
<div class="sy-step" id="kapitel-{{c.idx}}">
<span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5c5c5c">Kapitel {{c.num}} · {{c.label}}</span>
<div style="display: flex; flex-direction: column; gap: 18px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 3vw, 34px); font-weight: 700; line-height: 1.2; max-width: 900px">{{c.head}}</span>
<sc-if value="{{c.isText}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 20px; line-height: 1.6; color: #3d3d3d; max-width: 860px">{{c.text}}</p>
</sc-if>
<sc-if value="{{c.isList}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 4px 40px">
<sc-for list="{{c.items}}" as="it" hint-placeholder-count="5">
<div style="display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid #e4e4e4"><span aria-hidden="true" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; flex-shrink: 0; width: 22px">{{c.mark}}</span><span style="font-size: 16px; line-height: 1.55"><b>{{it.t}}</b> {{it.x}}</span></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{c.isSteps}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; max-width: 900px">
<sc-for list="{{c.items}}" as="it" hint-placeholder-count="6">
<div style="display: flex; gap: 18px">
<span style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0"><span style="width: 36px; height: 36px; border-radius: 50%; background: #141414; color: #ffffff; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px">{{it.n}}</span><span style="{{it.line}}"></span></span>
<span style="display: flex; flex-direction: column; gap: 4px; padding: 6px 0 22px"><b style="font-family: 'Space Grotesk', sans-serif; font-size: 19px">{{it.t}}</b><span style="font-size: 16px; line-height: 1.55; color: #3d3d3d">{{it.x}}</span></span>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{c.isPit}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 0; max-width: 980px">
<sc-for list="{{c.items}}" as="it" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 24px; padding: 18px 0; border-bottom: 1px solid #e4e4e4">
<span style="display: flex; gap: 12px; align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3l10 18H2z" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="round"></path><path d="M12 10v5M12 18v.5" stroke="#141414" stroke-width="2" stroke-linecap="round"></path></svg><span style="font-size: 16px; line-height: 1.5"><b>{{it.t}}</b><br><span style="color: #5c5c5c; font-size: 14px">{{it.law}}</span></span></span>
<span style="display: flex; gap: 12px; align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="10" fill="#141414"></circle><path d="M7 12.5l3 3 7-7" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="font-size: 16px; line-height: 1.55">{{it.x}}</span></span>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{c.isEffect}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-start">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<sc-for list="{{caseSliders}}" as="sl" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="{{sl.id}}" style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 600"><span>{{sl.label}}</span><span style="font-family: 'Space Grotesk', sans-serif">{{sl.shown}}</span></label>
<input id="{{sl.id}}" type="range" min="{{sl.min}}" max="{{sl.max}}" step="{{sl.step}}" value="{{sl.value}}" onInput="{{sl.change}}" style="width: 100%; accent-color: #141414">
</div>
</sc-for>
<span style="font-size: 13px; line-height: 1.55; color: #5c5c5c">{{caseNote}}</span>
</div>
<div style="flex: 1.3 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{caseBars}}" as="b" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 600"><span>{{b.label}}</span><span style="font-family: 'Space Grotesk', sans-serif">{{b.value}}</span></span>
<div style="height: 40px; border-radius: 12px; background: #f4f4f4; overflow: hidden"><div style="{{b.style}}"></div></div>
</div>
</sc-for>
<div style="background: #141414; color: #ffffff; border-radius: 18px; padding: 22px 24px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #b8b8b8">{{caseDiffLabel}}</span>

<style>
@font-face{font-family:Inter;src:url(/fonts/inter-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(/fonts/inter-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}

@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/space-grotesk-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}

body{margin:0;background:#ffffff;color:#141414;font-family:Inter,system-ui,sans-serif}
a{color:#141414}a:hover{color:#555555}
button{font-family:inherit}
@keyframes mid-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.mid-in{animation:mid-in .35s ease-out both}
.mk{display:inline-block;background:#F1D734;color:#141414;border-radius:.24em;padding:0 .2em .04em;margin:0 .06em;line-height:1.15;transform:rotate(-2deg);box-shadow:0 .08em 0 #141414}
.flapwrap{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(44px,5vw,76px);line-height:1.05;letter-spacing:-0.03em;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-start;gap:.08em}
.mk-flap{height:1.2em;overflow:hidden;text-align:left;margin-left:-.1em}
.flap-track{display:flex;flex-direction:column}.flap-track>span{height:1.2em;line-height:1.2em}
.fx .flap-track,.flap-track{animation:flap 10s cubic-bezier(.7,0,.2,1) infinite}
@keyframes flap{0%,20%{transform:translateY(0)}25%,45%{transform:translateY(-1.2em)}50%,70%{transform:translateY(-2.4em)}75%,95%{transform:translateY(-3.6em)}100%{transform:translateY(-4.8em)}}
.flap-sub{height:1.5em;overflow:hidden;font-size:20px;color:#3d3d3d}.flap-sub .flap-track>span{height:1.5em;line-height:1.5em}
.flap-sub .flap-track{animation-name:flapsub}
@keyframes flapsub{0%,20%{transform:translateY(0)}25%,45%{transform:translateY(-1.5em)}50%,70%{transform:translateY(-3em)}75%,95%{transform:translateY(-4.5em)}100%{transform:translateY(-6em)}}
@media (prefers-reduced-motion: reduce){.flap-track{animation:none !important}}
@media (max-width: 760px){.flapwrap{font-size:clamp(34px,11.5vw,56px)}}
:root{--sp:96px}@media (max-width: 760px){:root{--sp:60px}}
@media (max-width: 860px){.hdr{display:grid !important;grid-template-columns:1fr auto;row-gap:10px !important;padding:12px 18px !important}.hdr-nav{grid-column:1 / -1;grid-row:2;margin-left:0 !important;overflow-x:auto;white-space:nowrap;padding-bottom:4px;-webkit-overflow-scrolling:touch;gap:18px !important}.hdr-cta{grid-column:2;grid-row:1;padding:8px 16px !important;font-size:14px}}
.hl{background:linear-gradient(transparent 60%, #F1D734 60%, #F1D734 92%, transparent 92%)}

html{scroll-behavior:smooth;scroll-padding-top:90px}
@media (max-width:760px){header nav{flex-wrap:nowrap !important;overflow-x:auto;max-width:100%;padding-bottom:4px;-webkit-overflow-scrolling:touch}header nav a{white-space:nowrap}header nav:not(.hdr-nav) a:last-child{order:-1}}

:root{color-scheme:light}
html,body{overflow-x:clip}
h1,h2,h3{text-wrap:balance}
table,[data-count]{font-variant-numeric:tabular-nums}
section p{max-width:min(100%,70ch)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #F1D734;outline-offset:3px;border-radius:6px}
.fx .rv{opacity:1 !important}
.fx .sy:not(.hz) .sy-step:not(.seen):not(.act){opacity:.45 !important;transform:none !important}
html.show-b #story-a,html:not(.show-b) #story-b{display:none}
</style>

<body>
<template id="tpl">


<div style="width: 100%; background: #fafafa; color: #141414; font-family: Inter, system-ui, sans-serif">


<header style="position: sticky; top: 0; z-index: 50; background: #fafafa; border-bottom: 1px solid #ececec">
<div class="hdr" style="max-width: 1180px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px">
<a href="../b/index.html" class="hdr-logo" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; text-decoration: none">make it done</a>
<nav aria-label="Hauptmenü" class="hdr-nav" style="display: flex; gap: 22px; font-size: 15px; align-items: center; margin-left: auto">
<a href="../b/leistungen.html" style="text-decoration: none">Leistungen</a>
<a href="../b/so-arbeiten-wir.html" style="text-decoration: none">So arbeiten wir</a>
<a href="../b/fuer-wen.html" style="text-decoration: none; font-weight: 600">Für wen</a>
<a href="../b/rechner.html" style="text-decoration: none">Rechner</a>
<a href="../b/ueber-uns.html" style="text-decoration: none">Über uns</a>
<a href="../b/karriere.html" style="text-decoration: none">Karriere</a>
</nav>
<a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=nav-fuerwen-b" class="hdr-cta" style="text-decoration: none; background: #141414; color: #ffffff; padding: 10px 20px; border-radius: 999px; font-weight: 600; white-space: nowrap">Erstgespräch</a>
</div>
</header>

<section style="max-width: 1180px; margin: 0 auto; padding: var(--sp) 24px; display: flex; flex-direction: column; gap: 28px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ffffff; color: #3d3d3d; box-shadow: 0 2px 10px rgba(0,0,0,.08)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Für wen</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(40px, 6vw, 76px); line-height: 1.02; letter-spacing: -0.02em; max-width: 1000px">Für Unternehmer, die wachsen. Und es <em style="font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: 0; background: linear-gradient(transparent 62%, #F1D734 62%, #F1D734 92%, transparent 92%); padding: 0 .08em">richtig aufstellen</em> wollen.</h1>
<p style="margin: 0; font-size: 20px; line-height: 1.55; color: #3d3d3d; max-width: 780px">Inhabergeführt, vom Einzelunternehmen auf dem Weg zur GmbH bis zur Holding. Zu groß, um Zahlen und Struktur nebenbei zu machen – zu klein für eine eigene Finanzabteilung.</p>
</section>

<section>
<div style="max-width: 1180px; margin: 0 auto; padding: var(--sp) 24px; display: flex; flex-direction: column; gap: 28px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ffffff; color: #3d3d3d; box-shadow: 0 2px 10px rgba(0,0,0,.08)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Kurzer Selbstcheck</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 860px">Was trifft auf dich zu?</h2>
<div style="display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start">
<div role="group" aria-label="Aussagen wählen" style="flex: 1.4 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{checks}}" as="c" hint-placeholder-count="8">
<button type="button" onClick="{{c.toggle}}" aria-pressed="{{c.on}}" style="{{c.style}}"><span style="{{c.boxStyle}}">{{c.mark}}</span><span>{{c.text}}</span></button>
</sc-for>
</div>
<div style="flex: 1 1 320px; min-width: 0; background: #141414; color: #ffffff; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #b8b8b8">Dein Ergebnis</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.2">{{resTitle}}</span>
<span style="font-size: 16px; line-height: 1.6; color: #d4d4d4">{{resText}}</span>
<a href="{{resHref}}" style="align-self: flex-start; background: #ffffff; color: #141414; text-decoration: none; padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 15px">{{resCta}}</a>
</div>
</div>
</div>
</section>

<section style="max-width: 1180px; margin: 0 auto; padding: var(--sp) 24px; display: flex; flex-direction: column; gap: 32px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ffffff; color: #3d3d3d; box-shadow: 0 2px 10px rgba(0,0,0,.08)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Drei Lagen</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 860px">Wo du stehst – und was jetzt zählt.</h2>
<sc-for list="{{lagen}}" as="l" hint-placeholder-count="3">
<div id="{{l.id}}" style="display: flex; gap: 40px; flex-wrap: wrap; border-top: 1px solid #141414; padding: 22px 0 0">
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #5c5c5c">Lage {{l.num}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.15">„{{l.title}}“</span>
<span style="font-size: 17px; line-height: 1.6; color: #3d3d3d">{{l.story}}</span>
</div>
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5c5c5c">Was wir gemeinsam angehen</span>
<span style="font-size: 16px; line-height: 1.65">{{l.tun}}</span>
<div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px">
<a href="{{l.rechner}}" style="background: #141414; color: #ffffff; text-decoration: none; padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: 14px">{{l.rechnerLabel}}</a>
<a href="{{l.caseHref}}" style="background: #ffffff; color: #141414; border: 2px solid #141414; text-decoration: none; padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px">Geschichte von {{l.fall}} lesen ↓</a>
</div>
</div>
</div>
</sc-for>
</section>

<section id="geschichte" style="max-width: 1180px; margin: 0 auto; padding: 0 24px var(--sp); display: flex; flex-direction: column; gap: 28px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ffffff; color: #3d3d3d; box-shadow: 0 2px 10px rgba(0,0,0,.08)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Aus der Praxis</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(28px, 3.5vw, 42px); line-height: 1.12">So sah das bei <em style="font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: 0; background: linear-gradient(transparent 62%, #F1D734 62%, #F1D734 92%, transparent 92%); padding: 0 .08em">anderen</em> aus.</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 36px">
<a href="../b/so-arbeiten-wir.html#kunde-a-0" style="display: flex; flex-direction: column; gap: 10px; padding-top: 22px; border-top: 1px solid #141414; text-decoration: none; color: #141414"><span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5c5c5c">Kunde A · Holding &amp; Exit</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.2">Von verstreuten Beteiligungen zur doppelstöckigen Holding.</span><span style="font-size: 16px; color: #3d3d3d"><b class="hl" style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; color: #141414">rund 1,5 %</b> statt 28 % auf Exit-Erlöse</span><span style="font-weight: 600; font-size: 15px">Ganze Geschichte →</span></a>
<a href="../b/so-arbeiten-wir.html#kunde-b-0" style="display: flex; flex-direction: column; gap: 10px; padding-top: 22px; border-top: 1px solid #141414; text-decoration: none; color: #141414"><span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5c5c5c">Kunde B · Beratungsunternehmen</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.2">Vom Einzelunternehmen zur GmbH, mit Plan.</span><span style="font-size: 16px; color: #3d3d3d"><b class="hl" style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; color: #141414">rund 39.000 €</b> mehr im Jahr verfügbar</span><span style="font-weight: 600; font-size: 15px">Ganze Geschichte →</span></a>
</div>
<span style="font-size: 13px; color: #5c5c5c">Vereinfachte Darstellung, keine individuelle Gestaltungsempfehlung. Anonymisiert, Zitate nach Freigabe.</span>
</section>

<section>
<div style="max-width: 1180px; margin: 0 auto; padding: var(--sp) 24px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ffffff; color: #3d3d3d; box-shadow: 0 2px 10px rgba(0,0,0,.08)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Ehrlich gesagt</span>
<span style="font-size: 12px; font-weight: 600; border: 1px dashed #5c5c5c; border-radius: 999px; padding: 4px 10px; color: #3d3d3d">Zielgruppe offen – mit Heartbeat</span>
</div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; max-width: 860px">Wann wir gut passen – und wann nicht.</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #141414; padding: 22px 0 0">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Wir passen gut, wenn …</span>
<ul style="margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.8; color: #3d3d3d"><li>du dein Unternehmen selbst führst</li><li>Entscheidungen zu Rechtsform, Gehalt, Investitionen anstehen</li><li>du Zahlen willst, mit denen du steuern kannst</li><li>du willst, dass es umgesetzt wird – nicht nur geplant</li></ul>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #141414; padding: 22px 0 0">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Wir passen weniger, wenn …</span>
<ul style="margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.8; color: #3d3d3d"><li>du nur eine Steuererklärung oder den Jahresabschluss suchst – das macht dein Steuerberater</li><li>du ein schnelles Steuerspar-Modell von der Stange willst</li><li>du bereits eine eigene Finanzabteilung mit CFO hast</li><li>du Entscheidungen lieber allein und ohne Zahlen triffst</li></ul>
</div>
</div>
</div>
</section>

<section style="max-width: 1180px; margin: 0 auto; padding: var(--sp) 24px; display: flex; gap: 40px; flex-wrap: wrap">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ffffff; color: #3d3d3d; box-shadow: 0 2px 10px rgba(0,0,0,.08)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Typische Kunden</span>
<span style="font-size: 12px; font-weight: 600; border: 1px dashed #5c5c5c; border-radius: 999px; padding: 4px 10px; color: #3d3d3d">Werbesegment offen</span>
</div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(26px, 3vw, 36px); line-height: 1.15">Schnell gewachsen – oft online.</h2>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="border: 1px solid #141414; border-radius: 999px; padding: 10px 16px; font-size: 15px; font-weight: 500">Online-Unternehmer</span>
<span style="border: 1px solid #141414; border-radius: 999px; padding: 10px 16px; font-size: 15px; font-weight: 500">Beratung &amp; Coaching</span>
<span style="border: 1px solid #141414; border-radius: 999px; padding: 10px 16px; font-size: 15px; font-weight: 500">Agenturen</span>
<span style="border: 1px solid #141414; border-radius: 999px; padding: 10px 16px; font-size: 15px; font-weight: 500">Dienstleister</span>
<span style="border: 1px solid #141414; border-radius: 999px; padding: 10px 16px; font-size: 15px; font-weight: 500">Start-ups ab der ersten Finanzierung</span>
</div>
</div>
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ffffff; color: #3d3d3d; box-shadow: 0 2px 10px rgba(0,0,0,.08)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Wo</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(26px, 3vw, 36px); line-height: 1.15">Aus Erkelenz – digital für ganz Deutschland.</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3d3d3d">Wir arbeiten komplett digital – mit Zahlen-Cockpit, Video-Calls und kurzen Wegen. Deshalb ist es egal, wo dein Unternehmen sitzt.</p>
</div>
</section>

<section>
<div style="max-width: 880px; margin: 0 auto; padding: var(--sp) 24px; display: flex; flex-direction: column; gap: 24px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ffffff; color: #3d3d3d; box-shadow: 0 2px 10px rgba(0,0,0,.08)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1D734"></span>Häufige Fragen</span>
<h2 style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 44px); line-height: 1.1">Passt das zu mir?</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{faqs}}" as="f" hint-placeholder-count="4">
<div style="border-top: 1px solid #141414; padding: 22px 0 0">
<button type="button" onClick="{{f.toggle}}" aria-expanded="{{f.open}}" style="width: 100%; background: transparent; border: 0; padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; text-align: left; cursor: pointer; font-size: 17px; font-weight: 600; color: #141414; min-height: 44px">
<span>{{f.q}}</span>
<span aria-hidden="true" style="font-size: 22px; font-weight: 400">{{f.sign}}</span>
</button>
<sc-if value="{{f.open}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 0 24px 24px; font-size: 16px; line-height: 1.65; color: #3d3d3d">{{f.a}}</p>
</sc-if>
</div>
</sc-for>
</div>
</div>
</section>

<section style="max-width: 1180px; margin: 0 auto; padding: var(--sp) 24px; display: flex; flex-direction: column; gap: 24px; align-items: flex-start">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 4.5vw, 56px); line-height: 1.05; max-width: 820px">Unsicher, ob du gemeint bist? Frag uns.</h2>
<div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: center">
<a href="https://calendly.com/makeitdone/kennenlernen-15-min?utm_source=website&amp;utm_campaign=fuer-wen" style="background: #141414; color: #ffffff; text-decoration: none; padding: 16px 28px; border-radius: 999px; font-weight: 600; font-size: 16px">Jetzt Erstberatung sichern →</a>
</div>
</section>

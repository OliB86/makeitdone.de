<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { art: 'miete', mode: 'keep', miete: 40000, jahre: 12, verkauf: 400000, rate: 44, hebe: 400 };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    function eur(n) { return Math.round(n).toLocaleString('de-DE') + ' €'; }
    var K = 0.15 * 1.055, gw = 0.035 * st.hebe / 100;
    var r = st.rate / 100, n = st.jahre, L = st.miete * n, V = st.verkauf;
    var proj = st.art === 'projekt', out = st.mode === 'out';
    var pL, pV, gRate;
    if (proj) {
      var extra = 0.035 * Math.max(0, st.hebe - 400) / 100;
      pL = L * (r + extra); pV = V * (r + extra); gRate = K + gw;
    } else {
      pL = L * r; pV = n >= 10 ? 0 : V * r; gRate = K;
    }
    var gL = L * gRate, gV = V * gRate, gAfter = L + V - gL - gV;
    var hr = 0.05 * (K + gw);
    var toHold = gAfter * hr, inHold = gAfter - toHold;
    var abgG = out ? gAfter * 0.25 * 1.055 : 0, abgH = out ? inHold * 0.25 * 1.055 : 0;
    var tP = pL + pV, tG = gL + gV + abgG, tH = gL + gV + toHold + abgH;
    var base = 'padding: 14px 16px; font-size: 14px; border-top: 1px solid #e4e4e4;';
    function row(label, p, g, h, bold) {
      var fw = bold ? ' font-weight: 700;' : '';
      return { label: label, p: p, g: g, h: h, ls: base + ' font-weight: 600;', cs: base + fw, ks: base + ' background: #f7f7f7;' + fw };
    }
    var total = L + V;
    var rows = [
      row('Steuer auf die Überschüsse (' + n + ' Jahre)', eur(pL), eur(gL), eur(gL)),
      row('Steuer auf den Verkauf', (!proj && n >= 10) ? '0 € · nach 10 Jahren steuerfrei' : eur(pV), eur(gV), eur(gV)),
      row('Steuer auf dem Weg in die Holding', '–', '–', eur(toHold)),
      row('Abgeltungsteuer bei Ausschüttung', '–', out ? eur(abgG) : '–', out ? eur(abgH) : '–'),
      row('Steuern gesamt', eur(tP), eur(tG), eur(tH), true),
      row('Steuerquote', (tP / total * 100).toFixed(1).replace('.', ',') + ' %', (tG / total * 100).toFixed(1).replace('.', ',') + ' %', (tH / total * 100).toFixed(1).replace('.', ',') + ' %', true)
    ];
    var av = [['Privat', total - tP, 'privat'], ['Immobilien-GmbH', total - tG, out ? 'privat' : 'in der GmbH'], ['GmbH unter Holding', total - tH, out ? 'privat' : 'in der Holding']];
    var max = Math.max(av[0][1], av[1][1], av[2][1], 1);
    var bars = av.map(function (b, i) {
      var w = Math.max(4, b[1] / max * 100);
      return { label: b[0], value: eur(b[1]) + ' · ' + b[2], textColor: i === 2 ? '#ffffff' : '#141414',
        style: 'position: absolute; left: 0; top: 0; bottom: 0; width: ' + w.toFixed(1) + '%; border-radius: 999px; transition: width .4s ease; background: ' + (i === 2 ? '#141414' : i === 1 ? '#8a8a8a' : '#c8c8c8') };
    });
    var btn = function (on) { return 'border: 1px solid #141414; border-radius: 999px; padding: 10px 14px; font-size: 13px; cursor: pointer; min-height: 40px; ' + (on ? 'background: #141414; color: #ffffff; font-weight: 600;' : 'background: #ffffff; color: #141414; font-weight: 500;'); };
    function group(label, key, opts) {
      return { label: label, opts: opts.map(function (o) { var on = st[key] === o[0]; return { label: o[1], on: on, style: btn(on), pick: function () { var x = {}; x[key] = o[0]; self.setState(x); } }; }) };
    }
    var groups = [
      group('Was hast du vor?', 'art', [['miete', 'Vermieten und halten'], ['projekt', 'Projekte: bauen, sanieren, verkaufen']]),
      group('Gewinne der GmbH', 'mode', [['keep', 'werden reinvestiert'], ['out', 'werden privat ausgeschüttet']])
    ];
    function slider(id, label, key, min, max, step, shown, hint) {
      return { id: id, label: label, min: min, max: max, step: step, value: st[key], shown: shown, hint: hint,
        change: function (e) { var o = {}; o[key] = Number(e.target.value); self.setState(o); } };
    }
    var sliders = [
      slider('i-miete', 'Überschuss pro Jahr', 'miete', 0, 300000, 5000, eur(st.miete), 'Mieten minus Zinsen, Kosten und Abschreibung'),
      slider('i-jahre', 'Haltedauer', 'jahre', 1, 30, 1, n + ' Jahre', proj ? 'bei Projekten meist kurz' : 'privat ab 10 Jahren steuerfreier Verkauf'),
      slider('i-verkauf', 'Gewinn beim Verkauf', 'verkauf', 0, 3000000, 25000, eur(V), 'Verkaufspreis minus Buchwert'),
      slider('i-rate', 'Dein persönlicher Steuersatz', 'rate', 14, 48, 1, st.rate + ' %', 'Grenzsteuersatz, Soli eingerechnet'),
      slider('i-hebe', 'Gewerbesteuer-Hebesatz', 'hebe', 200, 900, 5, st.hebe + ' %', 'je nach Gemeinde')
    ];
    var notes = proj ? [
      { t: 'Projekte privat:', x: 'Wer innerhalb von fünf Jahren mehr als drei Objekte verkauft, wird schnell zum gewerblichen Grundstückshändler – mit Gewerbesteuer und ohne steuerfreien Verkauf.' },
      { t: 'Projekte in der GmbH:', x: 'Keine erweiterte Kürzung, dafür klare Trennung vom Bestand und von deinem Privatvermögen.' },
      { t: 'Unter der Holding:', x: 'Gewinne fließen für rund 1,5 % in die Holding und stehen dort für das nächste Projekt bereit.' }
    ] : [
      { t: 'Privat:', x: 'Mieten kosten deinen persönlichen Steuersatz. Nach zehn Jahren ist der Verkauf steuerfrei.' },
